    // the shape there is most of to look at rather than whatever the
    // catalogue happened to list first. The name settles ties, so a draw does
    // not depend on catalogue order either.
    caps.sort((a, b) => b.n - a.n || (a.t < b.t ? -1 : a.t > b.t ? 1 : 0));
    const capBoxes = [];
    for (const c of caps) {
      const w = cx2.measureText(c.t).width;
      const box = { x: c.x - w / 2 - 5, y: c.y - 9, w: w + 10, h: 18 };
      if (capBoxes.some(b => box.x < b.x + b.w && box.x + box.w > b.x
                          && box.y < b.y + b.h && box.y + box.h > b.y)) continue;
      capBoxes.push(box);
      cx2.fillText(c.t, c.x, c.y);
    }
    cx2.textAlign = 'left';
  }

  // A review board's names go where the captions would have, and off the same
  // star-to-pixel map, so placing one costs no second projection.
  drawReviewLabels(at);

  drawFlash(cam, now);

  // --- labels last, so nothing overdraws them.
  //
  // `showLabels` is one switch over two different things -- the constellation
  // captions above, and the star names here -- which is fine in the sky view
  // and not fine in a quiz: a question about which constellation a star is in
  // has to turn the CAPTIONS off, because a caption would be its answer, and
  // that should not also silence the one star it is asking about. So the
  // highlight names itself in its own pass, on its own terms.
  cx2.font = '600 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  cx2.textBaseline = 'middle';
  const placed = [];        // shared by both passes, so no two names overlap
  const nameStar = (q, colour, override) => {
    const nm = override || q.s.label;
    if (!nm) return;
    const x = q.x + q.r + 8, y = q.y;
    const w = cx2.measureText(nm).width;
    if (placed.some(b => x < b.x + b.w + 6 && x + w + 6 > b.x &&
                         y < b.y + 13 && y + 13 > b.y)) return;
    placed.push({ x, y: y - 6.5, w, h: 13 });
    cx2.fillStyle = colour;
    cx2.fillText(nm, x, y);
  };

  // A small highlight says which star it is, whatever the label layer is
  // doing: a ring with no name on it says "this star" without saying which.
  // In the ring's own violet, so the two plainly belong together. First, so
  // it wins the collision list against an ordinary label. Capped because the
  // search box can light 575 variables at once, and 575 names is not a
  // highlight, it is a wall of text.
  if (SEARCH_HIT && !showStarNames) {
    const q = proj.find(x => x.s === SEARCH_HIT);
    if (q) nameStar(q, 'rgba(190,200,215,0.85)');
  }
  if (MARKED.size && MARKED.size <= MARK_NAME_MAX)
    for (const q of proj)
      // starName, not s.label: the label falls back to prettyId(id), which is
      // the designation -- "bet Car" ringed next to the star is the answer to
      // "which constellation is Miaplacidus in?"
      if (MARKED.has(q.s)) nameStar(q, MARK_COLOR, starName(q.s));

  if (showLabels && showStarNames)
    for (const q of proj) {
      const s = q.s;
      // unobserved stars are only labelled when they are bright and there is
      // room; an observed star always gets its name
      if (!s.obs && !s.solar && s !== SEARCH_HIT
          && (s.vmag === null || s.vmag > Math.min(skyLimit(), 2.6))) continue;
      nameStar(q, s.obs ? '#ffffff' : 'rgba(190,200,215,0.62)');
    }
}

// A circle of constant angular radius about a direction: a cap on the
// sphere. Stereographic maps a circle on the sphere to a circle on the plane,
// but NOT to one centred on the projected centre -- so this samples the rim
// in 3D and projects each point, the same way a figure segment is drawn as an
// arc. That is exact at any field and anywhere off axis, including the
// all-sky end where a cap 150 degrees out is a badly skewed oval.
//
// Like the figure lines, a region is a line of sight and so it fades out as
// the stars are pushed off the sphere.
function drawRegions(cam, fade) {
  const N = 96;
  for (const reg of REGIONS) {
    const d = reg.dir;
    // A circle is gold while it is a question and green once it is the
    // answer. Nothing else about it changes -- same rim, same radius, same
    // number -- so the four circles of a `whichregion` stay exactly where
    // they were and one of them simply becomes the right one.
    const col = reg.col || REGION_COLOR;
    // any orthonormal pair perpendicular to d; the seed avoids the degenerate
    // cross product when d is itself near the pole
    const up = Math.abs(d[2]) < 0.9 ? [0, 0, 1] : [1, 0, 0];
    let e1 = [up[1] * d[2] - up[2] * d[1],
              up[2] * d[0] - up[0] * d[2],
              up[0] * d[1] - up[1] * d[0]];
    const l1 = Math.hypot(e1[0], e1[1], e1[2]) || 1;
    e1 = [e1[0] / l1, e1[1] / l1, e1[2] / l1];
    const e2 = [d[1] * e1[2] - d[2] * e1[1],
                d[2] * e1[0] - d[0] * e1[2],
                d[0] * e1[1] - d[1] * e1[0]];
    const r = reg.deg * Math.PI / 180, cr = Math.cos(r), sr = Math.sin(r);

    const pts = [];
    let whole = true;
    for (let i = 0; i <= N; i++) {
      const a = 2 * Math.PI * i / N, ca = Math.cos(a), sa = Math.sin(a);
      const p = project([(d[0] * cr + (e1[0] * ca + e2[0] * sa) * sr) * R0,
                         (d[1] * cr + (e1[1] * ca + e2[1] * sa) * sr) * R0,
                         (d[2] * cr + (e1[2] * ca + e2[2] * sa) * sr) * R0], cam);
      if (!p) whole = false;
      pts.push(p || null);
    }

    // The fill only when the whole rim is in front of the camera: a broken
    // path fills as a chord across the screen, which is worse than no fill.
    if (whole) {
      cx2.beginPath();
      pts.forEach((p, i) => i ? cx2.lineTo(p.x, p.y) : cx2.moveTo(p.x, p.y));
      cx2.closePath();
      cx2.fillStyle = hexA(col, (reg.col ? 0.12 : 0.07) * fade);
      cx2.fill();
    }
    cx2.strokeStyle = hexA(col, 0.85 * fade);
    cx2.lineWidth = 1.6;
    cx2.setLineDash([5, 4]);
    cx2.beginPath();
    let drawing = false;
    for (const p of pts) {
      if (!p) { drawing = false; continue; }
      if (drawing) cx2.lineTo(p.x, p.y);
      else { cx2.moveTo(p.x, p.y); drawing = true; }
    }
    cx2.stroke();
    cx2.setLineDash([]);

    // the number, for a question that asks WHICH circle
    if (reg.label) {
      const c = project([d[0] * R0, d[1] * R0, d[2] * R0], cam);
      if (c && c.x > -40 && c.x < W + 40 && c.y > -40 && c.y < H + 40) {
        cx2.font = '700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        cx2.textAlign = 'center'; cx2.textBaseline = 'middle';
        cx2.fillStyle = hexA(col, 0.95 * fade);
        cx2.fillText(reg.label, c.x, c.y);
        cx2.textAlign = 'left';
      }
    }
  }
}

// Paint one solar-system body as the thing it looks like, not as a dot.
// Everything is clipped to the disc so a band or a cap cannot leak outside
// it, and every feature is proportional to r, so it survives the Moon going
// from 7 pixels to 60 as the field closes.
//
// These are the features that identify a body at a glance in a small
// telescope: Jupiter's belts and its Red Spot, Saturn's rings, Mars's polar
// cap and dark albedo markings, the Moon's maria, the ice giants' flat
// methane-blue discs, Venus and the Sun as pure glare.
function drawSolarBody(x, y, r, s, col) {
  // Saturn's rings, back half first: they pass behind the globe on one side
  // and in front on the other, and drawing them in that order is what makes
  // the planet read as Saturn rather than as a dot in a circle.
  if (s.id === 'saturn') {
    cx2.strokeStyle = hexA('#f0dca0', 0.85);
    cx2.lineWidth = Math.max(1, r * 0.26);
    cx2.beginPath();
    cx2.ellipse(x, y, r * 2.05, r * 0.62, -0.32, Math.PI, Math.PI * 2);
    cx2.stroke();
  }

  cx2.save();
  cx2.beginPath(); cx2.arc(x, y, r, 0, 6.2832); cx2.clip();
  cx2.fillStyle = col;
  cx2.fillRect(x - r, y - r, 2 * r, 2 * r);

  if (s.id === 'jupiter') {
    cx2.fillStyle = hexA('#9c5f2c', 0.5);            // the belts
    for (const [o, h] of [[-0.72, 0.2], [-0.28, 0.24], [0.22, 0.26], [0.66, 0.18]])
      cx2.fillRect(x - r, y + o * r, 2 * r, h * r);
    cx2.fillStyle = hexA('#c8401c', 0.9);            // the Red Spot
    cx2.beginPath();
    cx2.ellipse(x + r * 0.3, y + r * 0.33, r * 0.3, r * 0.16, 0, 0, 6.2832);
    cx2.fill();
  } else if (s.id === 'mars') {
    cx2.fillStyle = hexA('#8a2f16', 0.45);           // dark albedo markings
    cx2.beginPath();
    cx2.ellipse(x - r * 0.15, y + r * 0.2, r * 0.62, r * 0.32, -0.4, 0, 6.2832);
    cx2.fill();
    cx2.fillStyle = hexA('#ffffff', 0.9);            // polar cap
    cx2.beginPath();
    cx2.ellipse(x, y - r * 0.85, r * 0.52, r * 0.3, 0, 0, 6.2832);
    cx2.fill();
  } else if (s.id === 'moon') {
    cx2.fillStyle = hexA('#9099a6', 0.55);           // maria
    for (const [dx, dy, rr] of [[-0.32, -0.3, 0.45], [0.28, 0.1, 0.32],
                                [-0.02, 0.5, 0.24], [0.45, -0.42, 0.2]]) {
      cx2.beginPath(); cx2.arc(x + dx * r, y + dy * r, rr * r, 0, 6.2832); cx2.fill();
    }
  } else if (s.id === 'uranus' || s.id === 'neptune') {
    // a featureless methane-blue deck, lit from one side
    const g = cx2.createLinearGradient(x - r, y - r, x + r, y + r);
    g.addColorStop(0, hexA('#ffffff', 0.34));
    g.addColorStop(0.6, hexA(col, 0));
    cx2.fillStyle = g; cx2.fillRect(x - r, y - r, 2 * r, 2 * r);
  } else if (s.id === 'venus' || s.id === 'sun') {
    const g = cx2.createRadialGradient(x - r * 0.2, y - r * 0.2, 0, x, y, r);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(1, hexA(col, 0));
    cx2.fillStyle = g; cx2.fillRect(x - r, y - r, 2 * r, 2 * r);
  } else if (s.id === 'mercury') {
    cx2.fillStyle = hexA('#5f584d', 0.4);            // a cratered, shaded limb
    cx2.beginPath(); cx2.arc(x + r * 0.4, y + r * 0.35, r * 0.8, 0, 6.2832); cx2.fill();
  }
  cx2.restore();

  if (s.id === 'saturn') {                           // the front half
    cx2.strokeStyle = hexA('#ffeec0', 0.95);
    cx2.lineWidth = Math.max(1, r * 0.26);
    cx2.beginPath();
    cx2.ellipse(x, y, r * 2.05, r * 0.62, -0.32, 0, Math.PI);
    cx2.stroke();
  }
}

// The "here it is" ping: rings expanding out of the thing you searched for,
// three of them staggered, over about a second and a half. It fires whether
// or not the view had to move -- when the target was already on screen it IS
// the whole answer, and when the view did move it says which of the dots it
// went to.
const FLASH_MS = 1500;
function drawFlash(cam, now) {
  if (!FLASH) return;
  const age = now - FLASH.t0;
  if (age > FLASH_MS + 400) { FLASH = null; return; }
  const pos = FLASH.kind === 'con' ? FLASH.pos
            : (FLASH.ref.pos || null);
  if (!pos) return;
  const p = project(pos, cam);
  if (!p) return;
  const base = FLASH.kind === 'con' ? 26
             : Math.max(6, (proj.find(q => q.s === FLASH.ref) || {}).r || 6);
  for (let k = 0; k < 3; k++) {
    const t = (age - k * 260) / 1100;
    if (t <= 0 || t >= 1) continue;
    cx2.strokeStyle = hexA('#ffffff', 0.85 * (1 - t));
    cx2.lineWidth = 2 - t;
    cx2.beginPath();
    cx2.arc(p.x, p.y, base + 4 + t * 46, 0, 6.2832);
    cx2.stroke();
  }
  if (FLASH.kind === 'con') {
    cx2.font = '600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    cx2.textAlign = 'center';
    cx2.fillStyle = hexA('#ffffff', Math.max(0, 1 - age / FLASH_MS));
    cx2.fillText(FLASH.label, p.x, p.y - 34);
    cx2.textAlign = 'left';
  }
}

// The ground colour for a sky: the page's own black at class 1, a grey-brown
// wash at the bottom of the slider. Linear in the slider, which is the only
// defensible curve given the scale is a set of descriptions rather than a
// measurement. Class 1 has to land exactly on the page background, or the
// default view is quietly a different colour from the one it was designed in.
function skyGlow(i) {
  const t = (SKY_BEST - i) / SKY_BEST;
  const mix = (a, b) => Math.round(a + (b - a) * t);
  return `rgb(${mix(5, 27)},${mix(7, 28)},${mix(13, 33)})`;
}

function hexA(hex, a) {
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

// the observed stars pulse, so the scene animates even when nothing is touched
function loop() { glide(); draw(); requestAnimationFrame(loop); }

// ============================================================ data
function build(d) {
  NAME_OWNER = null;          // names are claimed per catalogue, not per page
  DATA = d;
  FACTS = d.facts || {};        // reference facts, keyed by catalogue id
  const cat = d.catalog;
  SITE_LAT = (typeof d.site_lat === 'number') ? d.site_lat : null;
  const obsByName = new Map(d.observed.map(o => [o.name, o]));
  // SOLAR_SKY too: it is filled from the ephemeris below, and placeSolar()
  // walks it rather than STARS. Left uncleared, a second build() leaves nine
  // orphaned bodies in it that no longer stand on any sky and that every date
  // change goes on moving.
  STARS = []; FIGS = []; SOLAR_SKY = [];

  // The names of the solar-system bodies, so an observed target called
  // "saturn" is not matched against a star and is left to the ephemeris
  // below. It also used to feed the floating spectra strip, which this page
  // does not inherit -- see further down.
  const ss = new Set((d.solar_system || []).map(x => x.toLowerCase()));

  const byId = new Map(), byHip = new Map();
  if (cat) {
    for (const c of cat.stars) {
      if (c.ra === null || c.dec === null) continue;
      const dist = c.plx && c.plx > 0 ? 1000 / c.plx : null;   // mas -> parsec
      const s = {
        id: c.id, label: c.name || prettyId(c.id), sp: c.sp,
        vmag: c.vmag, dist, hip: c.hip, dir: unitVec(c.ra, c.dec),
        ra: c.ra, dec: c.dec, obs: null, cat: c, con: c.con || null,
        inFig: false,
      };
      STARS.push(s);
      byId.set(c.id, s);
      if (c.hip) {
        const prev = byHip.get(c.hip);
        // both components of a close pair can carry the same HIP number
        // (zet01 / zet02 UMa); the figure means the brighter one
        if (!prev || (s.vmag ?? 99) < (prev.vmag ?? 99)) byHip.set(c.hip, s);
      }
    }
    const alias = cat.aliases || {};
    const norm = t => String(t || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    for (const [name, o] of obsByName) {
      if (ss.has(name.toLowerCase())) continue;
      // The alias table is the fast path, but it does not always have an
      // entry -- a name the atlas carries in two forms ("Mizar" and "Mizar A")
      // can resolve only under one of them. Fall back to the catalogue's own
      // names before giving up, or the star silently stops being clickable.
      const n = norm(name);
      // the server resolved this already (sky_names.resolve): alias, then the
      // catalogue's own spelling, then the structural keys that make "Eta
      // Herculis" and "* eta Her" the same star without anything being cached.
      // The chain below stays for a payload served before that existed.
      const s = byId.get(o.star_id)
             || byId.get(alias[name])
             || STARS.find(x => norm(x.label) === n)
             || STARS.find(x => norm(x.cat && x.cat.name) === n)
             || STARS.find(x => norm(x.id) === n)
             || STARS.find(x => norm(x.label).startsWith(n) && n.length >= 4);
      if (s) {
        s.obs = o; s.label = name;
        // the observation's own stated type wins over the catalogue's for
        // colour: it is what the capture was reduced against
        if (o.sptype) s.sp = o.sptype;
        if (s.con) MAIN_CONS.add(s.con);
      } else {
        o.unplaced = true;   // resolved by no catalogue entry: reported, not drawn
      }
    }
    for (const [abbr, segs] of Object.entries(cat.figures || {})) {
      for (const [a, b] of segs) {
        const sa = byHip.get(a), sb = byHip.get(b);
        if (!sa || !sb) continue;
        sa.inFig = sb.inFig = true;
        FIGS.push({ a: sa, b: sb, con: abbr });
      }
      const mem = STARS.filter(x => x.con === abbr && x.inFig);
      if (mem.length) CON_LABELS.push({ abbr, stars: mem });
    }
    rankConstellations();
    syncFigsSlider();
  }
  const nCat = STARS.length;

  // ---- the solar system, placed by date --------------------------------
  // These were kept off the sky while there was no time in the view: a dot
  // for Saturn is wrong the moment it is drawn unless the page knows *when*.
  // The date slider is that when, so each body now stands where it really
  // does at midnight on the slider's date, and moves along the ecliptic as
  // the slider runs. All nine are drawn, not just the ones with a spectrum --
  // the ephemeris costs the same either way, and a planet you have not shot
  // yet is exactly the thing you would want to find.
  const eph = (d.ephemeris && d.ephemeris.bodies) || null;
  adoptEphemerisYear(d);
  if (eph) {
    for (const [body, track] of Object.entries(eph)) {
      if (!track || !track.length) continue;
      let o = null;
      for (const [name, ob] of obsByName)
        if (name.toLowerCase() === body) { o = ob; break; }
      const s = {
        id: body, label: body[0].toUpperCase() + body.slice(1),
        sp: o ? o.sptype : null, vmag: null, dist: null, hip: null,
        ra: null, dec: null, dir: [1, 0, 0], obs: o, cat: null, con: null,
        inFig: false, solar: true, track,
      };
      STARS.push(s); SOLAR_SKY.push(s);
    }
  }

  for (const s of STARS) s.pos = [0, 0, 0];
  placeSolar(currentDay());
  updatePositions();

  const nObs = STARS.filter(s => s.obs).length;
  document.getElementById('count').textContent =
    cat ? `${nCat} stars · ${FIGS.length} figure lines · ${nObs} with spectra`
        : `${d.observed.length} observed targets`;

  if (!cat) { showNoCatalog(d); return; }
  buildIndex(cat);
  renderUnplaced(d.observed.filter(o => o.unplaced));
}

// A star with a spectrum and nowhere to stand used to be a console.warn, which
// is to say invisible: the observer saw a sky that simply did not have their
// star on it, with nothing to read. Two things can put a target here, and they
// have different answers, so the notice names which.
//
//   * a designation the catalogue does not hold -- rare, and nothing to do
//     about it but check the spelling;
//   * a proper name or survey id (Vega, WR 136) the catalogue has never been
//     told belongs to that star. sky_names can derive `eta Herculis` from
//     `* eta Her`, but "Vega" is not a form of `* alf Lyr` and no rule will
//     make it one -- that mapping is a fact SIMBAD holds, and it arrives only
//     when build_sky_catalog.py is run.
function renderUnplaced(list) {
  const el = document.getElementById('unplaced');
  if (!el) return;
  if (!list.length) { el.style.display = 'none'; el.textContent = ''; return; }
  const derivable = n => /\s/.test(n.trim());
  const names = list.map(o => o.name);
  el.style.display = '';
  el.style.color = '#d29922';
  el.textContent = `${names.length} observed target`
    + (names.length === 1 ? '' : 's')
    + ` could not be placed on the sky: ${names.join(', ')}. `
    + (names.every(derivable)
       ? 'Check the spelling against the star it should be — a designation and '
         + 'a constellation ("eta Herculis", "eta Her", "61 Cygni A") is '
         + 'matched structurally and needs nothing rebuilt.'
       : 'A proper name or survey id (Vega, WR 136) can only be matched from '
         + 'the catalogue, which learns it from the star list in the '
         + 'observation panel — add it there and re-run '
         + 'build_sky_catalog.py. A designation plus a constellation '
         + '("eta Herculis", "61 Cygni A") needs no rebuild at all.');
}

// ============================================================ search
// One flat list of {key, label, kind, ref}, keys already normalised, so a
// keystroke is a scan of a few thousand short strings -- no structure worth
// more than that at this size.
//
// A star earns several keys because it has several names: the proper one
// where it has it (Sirius), the Bayer designation the catalogue stores
// (`* alf CMa`), that designation spelled out (`alpha Canis Major`, so
// "alpha orionis" finds Betelgeuse), its HIP number, and any name the app's
// own atlas resolves to it -- that last one is why "Mizar" works when the
// catalogue only knows "Mizar A".
const GREEK = {
  alf: 'alpha', bet: 'beta', gam: 'gamma', del: 'delta', eps: 'epsilon',
  zet: 'zeta', eta: 'eta', tet: 'theta', iot: 'iota', kap: 'kappa',
  lam: 'lambda', 'mu.': 'mu', 'nu.': 'nu', ksi: 'xi', omi: 'omicron',
  'pi.': 'pi', rho: 'rho', sig: 'sigma', tau: 'tau', ups: 'upsilon',
  phi: 'phi', chi: 'chi', psi: 'psi', ome: 'omega',
};
const normKey = t => String(t || '').toLowerCase().replace(/[^a-z0-9]/g, '');

function addKey(map, key, label, kind, ref, pos) {
  const k = normKey(key);
  if (k.length < 2) return;
  map.push({ key: k, label, kind, ref, pos });
}

function buildIndex(cat) {
  INDEX = [];
  for (const s of STARS) {
    const label = s.label || prettyId(s.id);
    const kind = s.solar ? 'body' : 'star';
    addKey(INDEX, label, label, kind, s);
    if (s.cat) {
      if (s.cat.name) addKey(INDEX, s.cat.name, label, kind, s);
      const bayer = prettyId(s.cat.id);
      addKey(INDEX, bayer, label, kind, s);
      const m = bayer.match(/^([a-z]{2,3}\.?)(\d*)\s+(\w+)$/i);
      if (m && GREEK[m[1].toLowerCase()]) {
        const con = CON_NAMES[m[3]] || m[3];
        addKey(INDEX, GREEK[m[1].toLowerCase()] + m[2] + ' ' + con, label, kind, s);
      }
      if (s.cat.hip) addKey(INDEX, 'hip' + s.cat.hip, label, kind, s);
    }
    // ...and what it DOES, for the stars that do something: "variable",
    // the class, the type and the type's code all find this star.
    const f = FACTS[s.id] || (s.cat && FACTS[s.cat.id]);
    if (f && f.var) addVarKeys(INDEX, f.var, s);
  }
  for (const [alias, id] of Object.entries((cat && cat.aliases) || {})) {
    const s = STARS.find(x => x.cat && x.cat.id === id);
    if (s) addKey(INDEX, alias, s.label || prettyId(s.id), 'star', s);
  }
  // constellations: the mean direction of the figure is where to aim
  for (const c of CON_LABELS) {
    const v = [0, 0, 0];
    for (const st of c.stars) { v[0] += st.dir[0]; v[1] += st.dir[1]; v[2] += st.dir[2]; }
    const len = Math.hypot(v[0], v[1], v[2]) || 1;
    const dir = [v[0] / len, v[1] / len, v[2] / len];
    const name = CON_NAMES[c.abbr] || c.abbr;
    addKey(INDEX, name, name, 'con', c, dir);
    addKey(INDEX, c.abbr, name, 'con', c, dir);
  }
}

// Exact first, then prefix (shortest key wins, so "vega" beats "vegas"),
// then anywhere in the name. Ties go to the brighter star, which is almost
// always the one meant.
//
// Names come back as one row each, traits as one row for the whole trait:
// every star a trait key matched is gathered behind it, and the row lights
// them all rather than going anywhere.
function searchIndex(qRaw) {
  const q = normKey(qRaw);
  if (q.length < 1) return [];
  const seen = new Set(), out = [];
  const scored = [], groups = new Map();
  for (const e of INDEX) {
    let sc;
    if (e.key === q) sc = 0;
    else if (e.key.startsWith(q)) sc = 10 + (e.key.length - q.length) * 0.01;
    // The other way round as well, which is what makes the Latin genitives
    // work without a table of them: the key holds "alpha Orion" and the query
    // is "alpha Orionis", "alpha Lyrae" against "alpha Lyra", "Canis Majoris"
    // against "Canis Major". A few letters of overhang, no more, so a key
    // cannot swallow a much longer query.
    else if (e.key.length >= 4 && q.length - e.key.length <= 3
             && q.startsWith(e.key)) sc = 60 + (q.length - e.key.length);
    else if (e.key.includes(q)
             // a trait matches from the start of one of its words or not at
             // all; a name still matches anywhere in it
             && (!e.starts || e.starts.has(e.key.indexOf(q))))
      sc = 100 + e.key.indexOf(q);
    else continue;
    if (e.kind === 'trait') {
      // one row per trait, however many stars stand behind it. The score is
      // the best any of that trait's keys managed -- "DSCT" typed exactly is
      // the same row as "delta Scuti" typed exactly.
      let g = groups.get(e.trait);
      if (!g) groups.set(e.trait, g = { kind: 'group', trait: e.trait,
                                        label: e.trait, stars: new Set(),
                                        sc: Infinity });
      g.sc = Math.min(g.sc, sc + e.pen);
      g.stars.add(e.ref);
      continue;
    }
    const v = e.ref.vmag;
    scored.push([sc + (v === null || v === undefined ? 0.4 : v * 0.02), e]);
  }
  scored.sort((a, b) => a[0] - b[0]);
  const rows = [];
  for (const [sc, e] of scored) {
    // on the star itself, not on kind+label: one star can be reached by more
    // than one of its names, and it is still one row
    const id = e.kind === 'con' ? 'con:' + e.ref.abbr : e.ref;
    if (seen.has(id)) continue;
    seen.add(id); rows.push([sc, e]);
    if (rows.length >= 8) break;
  }
  for (const g of groups.values()) rows.push([g.sc, g]);
  rows.sort((a, b) => a[0] - b[0]);
  for (const [, e] of rows) {
    out.push(e);
    if (out.length >= 8) break;
  }
  return out;
}

// 'main' is the constellations that actually hold one of this installation's
// observed stars -- the reason to be looking at all. With nothing observed yet
// there is no meaningful subset, so it falls back to the whole sky.
function showCon(abbr) {
  if (lineMode === 'off') return false;
  // An isolated figure is an explicit request for that shape and nothing
  // else, so it is drawn PAST the prominence cut rather than under it --
  // otherwise a question about Lacerta would pose itself on a blank sky.
  if (ISOLATE) return ISOLATE.has(abbr) || nearCon(abbr);
  // the prominence cut sits on top of the line mode: a figure below it is
  // gone whichever mode is selected, including 'main'
  const rank = CON_RANK.get(abbr);
  if (rank !== undefined && rank >= conCut) return false;
  if (lineMode === 'all' || !MAIN_CONS.size) return true;
  return MAIN_CONS.has(abbr);
}

// Rank the figures by the light they actually put on the sky: the summed
// flux of every star the figure draws a line to. Summing rather than taking
// the brightest member is what puts Orion above Lyra -- Vega alone outshines
// any single star in Orion, but the figure it belongs to is a small faint
// parallelogram. The order this gives runs CMa, Car, Ori, Cen, Sco ... down
// to Sex, Ant and Men, which is the order they are noticed in.
//
// Flux is summed over the FIGURE's stars, not the constellation's members:
// a figure line may run to a star stamped into the neighbouring
// constellation, and that star is part of what the shape looks like.
function rankConstellations() {
  const flux = new Map(), seen = new Map();
  for (const f of FIGS) {
    let mine = seen.get(f.con);
    if (!mine) { mine = new Set(); seen.set(f.con, mine); flux.set(f.con, 0); }
    for (const st of [f.a, f.b]) {
      if (mine.has(st)) continue;
      mine.add(st);
      if (st.vmag !== null && st.vmag !== undefined)
        flux.set(f.con, flux.get(f.con) + Math.pow(10, -0.4 * st.vmag));
    }
  }
  CON_ORDER = [...flux.entries()].sort((a, b) => b[1] - a[1]).map(e => e[0]);
  CON_RANK = new Map(CON_ORDER.map((abbr, i) => [abbr, i]));
  conCut = CON_ORDER.length;
}

function prettyId(id) { return (id || '').replace(/^\* /, '').replace(/^NAME /, ''); }

// Move every body to its place on day `day` of the ephemeris year. The table
// is sampled once a day, which is exactly the date slider's own step, so this
// is an index rather than an interpolation -- and the Moon, which moves 13
// degrees between rows, never has to be guessed at halfway.
function placeSolar(day) {
  for (const s of SOLAR_SKY) {
    const row = s.track[Math.max(0, Math.min(s.track.length - 1, Math.round(day)))];
    if (!row) continue;
    s.ra = row[0]; s.dec = row[1]; s.au = row[2];
    s.dir = unitVec(s.ra, s.dec);
    const r = radiusOf(s);
    s.pos = [s.dir[0] * r, s.dir[1] * r, s.dir[2] * r];
  }
}

function updatePositions() {
  for (const s of STARS) {
    const r = radiusOf(s);
    s.pos = [s.dir[0] * r, s.dir[1] * r, s.dir[2] * r];
  }
}

// ============================================================ interaction
let dragging = false, lx = 0, ly = 0, moved = 0;
// A second finger is not a drag, and this is the guard that says so.
//
// It has to live in THESE handlers rather than in the pinch ones, because the
// pinch listeners are on the capture phase and these are on the bubble: the
// pinch handler sets `dragging = false` and then this one, running after it,
// set it straight back to true. So a pinch was also a drag, and `turn()` ran
// for every move of BOTH fingers -- two large opposing rotations a frame,
// which is a sky that loops rather than zooms. The zoom was never the part
// that was wrong.
cv.addEventListener('pointerdown', e => {
  if (TOUCHES.size >= 2) { dragging = false; return; }
  dragging = true; moved = 0; lx = e.clientX; ly = e.clientY; vx = vy = 0;
  TWEEN = null;                          // taking the wheel cancels the turn
  cv.classList.add('drag'); cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointerup', e => {
  dragging = false; cv.classList.remove('drag');
  // Coming out of a pinch, neither finger is a tap. Both lift having barely
  // moved, so `moved < 5` is true for each -- which would open the detail
  // panel, or put a name down on a review board, at the end of every zoom.
  if (PINCHED) return;
  if (moved < 5) {                          // a click, not the end of a drag
    // With a name picked up, a click is where that name goes. It takes the
    // click outright: opening the detail panel over a board would both name
    // the star it was asking about and cover the shape it sits in.
    if (REVIEW.on && reviewClick(ex(e), ey(e))) return;
    const hit = pick(ex(e), ey(e));
    // a click on empty sky dismisses the reading, the way clicking off any
    // popover does; a click on another star just swaps the panel's contents
    if (hit) openPanel(hit.s); else panel.classList.remove('open');
  }
});
cv.addEventListener('pointermove', e => {
  if (TOUCHES.size >= 2) return;        // a pinch, and the pinch handler has it
  if (dragging) {
    const dx = e.clientX - lx, dy = e.clientY - ly;
    moved += Math.abs(dx) + Math.abs(dy);
    lx = e.clientX; ly = e.clientY;
    turn(dx, dy);
    vx = dx; vy = dy;                       // for the glide after release
    // The centring is no longer the one the date set -- but the date itself
    // still stands, and the planets are still placed by it, so the readout is
    // dimmed rather than cleared.
    seasonOut.classList.add('stale');
    tip.style.display = 'none';
    return;
  }
  const hit = pick(ex(e), ey(e));
  hoverStar = hit ? hit.s : null;
  if (!hit) { tip.style.display = 'none'; return; }
  showTip(hit.s, e.clientX, e.clientY);
});
cv.addEventListener('pointerleave', () => { tip.style.display = 'none'; hoverStar = null; });
// A wheel event is not a click. A mouse notch arrives as one event of about
// 100px, but a trackpad flick arrives as thirty or forty small ones -- so
// treating every event as a fixed 1.08x step zoomed by 1.08^35, which is the
// whole range in one gesture. The factor is proportional to the distance the
// wheel actually reported, normalised out of the three deltaModes, and capped
// per event so a coarse mouse or an inertial tail cannot jump the view either.
const ZOOM_PER_PX = Math.log(1.05) / 100;   // one mouse notch = 5%
const ZOOM_EVENT_CAP = Math.log(1.10);      // no single event moves more
function wheelPixels(e) {
  const unit = e.deltaMode === 1 ? 16       // lines
             : e.deltaMode === 2 ? 400      // pages
             : 1;                           // pixels
  return e.deltaY * unit;
}
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const t = Math.max(-ZOOM_EVENT_CAP,
            Math.min(ZOOM_EVENT_CAP, wheelPixels(e) * ZOOM_PER_PX));
  if (!t) return;
  zoomAbout(ex(e), ey(e), Math.exp(t));
  vx = vy = 0; TWEEN = null;         // a zoom cancels any leftover motion
}, { passive: false });

// Turning the shell. The sky is a sphere seen from the inside, so a drag has
// to move the sky WITH the cursor: grab a star and it should stay under the
// pointer. Increasing RA projects to screen-left, so dragging right must
// RAISE the yaw to bring higher-RA sky into view.
//
// The rate is set by the focal length rather than a small-angle guess, so a
// pixel of drag really is a pixel of sky; and the horizontal rate is divided
// by cos(pitch), because a rotation about the celestial pole moves the view
// centre by only cos(pitch) of itself. Without that the sky seizes up near
// the pole -- which is where half of these targets are.
function turn(dx, dy) {
  // Turn the shell about the CELESTIAL POLE. This is the planetarium motion:
  // declination is preserved, so the sky slides along its parallels and north
  // stays up without any roll ever accumulating.
  //
  // The rate comes from the focal length rather than a small-angle guess, so a
  // pixel of drag is a pixel of sky; and the horizontal rate is divided by
  // cos(pitch), because a rotation about the pole moves the view centre by
  // only cos(pitch) of itself. Without that the sky seizes up near the pole --
  // which is where most of these targets are.
  //
  // A horizontal drag still slides the field a little vertically (about 13px
  // per 120px at dec +55, more further north). That is the projection, not the
  // control: parallels of declination are curves in a gnomonic projection, so
  // a star cannot both keep its declination and hold a straight screen line.
  // Rotating about the camera's own axes instead removes the declination
  // change but doubles the drift, so this is the better of the two. Narrowing
  // the field shrinks it either way.
  const focal = focalOf();
  const cosP = Math.max(0.12, Math.cos(pitch));
  yaw += (dx / focal) / cosP;
  pitch += dy / focal;
  pitch = Math.max(-1.5533, Math.min(1.5533, pitch));
  if (yaw > Math.PI * 2) yaw -= Math.PI * 2;
  if (yaw < 0) yaw += Math.PI * 2;
}

// a short glide after letting go, so the shell has some weight to it
let vx = 0, vy = 0;
function glide() {
  if (TWEEN) { stepTween(); return; }        // a search turn overrides drift
  if (!dragging && (Math.abs(vx) > 0.05 || Math.abs(vy) > 0.05)) {
    turn(vx, vy);
    vx *= 0.93; vy *= 0.93;
  }
}

// Turning to something searched for, eased rather than cut. A jump loses the
// one thing this view is for -- knowing where you ended up relative to where
// you were -- so the shell swings round instead, over about two thirds of a
// second. The yaw takes the short way round the pole; going the long way
// round to a star 10 degrees away looks like a fault.
function tweenTo(dir) {
  let y1 = Math.atan2(dir[1], dir[0]);
  const p1 = Math.max(-1.5533, Math.min(1.5533, Math.asin(dir[2])));
  let dy = y1 - yaw;
  while (dy > Math.PI) dy -= Math.PI * 2;
  while (dy < -Math.PI) dy += Math.PI * 2;
  TWEEN = { y0: yaw, dy, p0: pitch, dp: p1 - pitch, t0: performance.now(), dur: 680 };
  vx = vy = 0;
}
function stepTween() {
  const t = Math.min(1, (performance.now() - TWEEN.t0) / TWEEN.dur);
  const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;   // ease in-out
  yaw = TWEEN.y0 + TWEEN.dy * e;
  pitch = TWEEN.p0 + TWEEN.dp * e;
  if (yaw > Math.PI * 2) yaw -= Math.PI * 2;
  if (yaw < 0) yaw += Math.PI * 2;
  if (t >= 1) TWEEN = null;
}

function pick(px, py) {
  const slop = touchSlop();
  let best = null, bd = (slop + 5) * (slop + 5);
  for (const q of proj) {
    const d2 = (q.x - px) * (q.x - px) + (q.y - py) * (q.y - py);
    const lim = Math.max(slop, q.r + 8);
    if (d2 < lim * lim && d2 < bd) { bd = d2; best = q; }
  }
  return best;
}

// While a question stands, the sky does not answer it for you. Hovering a
// star used to print its designation, its type, its magnitude and its
// distance -- which is the literal answer to `home`, `kind`, `brightest` and
// `nearest` respectively, available by accident to anyone moving the mouse.
//
// Held back rather than removed, and it says so: a silent hover reads as a
// broken page, and "answer first, then go and look" is the loop this page
// wants anyway. One rule over every question rather than a list of fields per
// generator -- a new generator cannot forget to opt in.
// A board holds the sky back for exactly the same reason a question does,
// and needs no separate rule: hovering a star prints its designation, and
// "bet UMi" beside a ringed star answers the board outright. The spectral
// ladder asks nothing of the sky, so it holds nothing.
function quizHolds() {
  if (REVIEW.on)
    return REVIEW.kind !== 'spectra' && !REVIEW.checked && REVIEW.targets.length > 0;
  return !!(QUIZ && QUIZ.q && !QUIZ.answered);
}

function placeTip(px, py) {
  tip.style.display = 'block';
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(px + 16, window.innerWidth - r.width - 12) + 'px';
  tip.style.top = Math.min(py + 16, window.innerHeight - r.height - 12) + 'px';
}

function showTip(s, px, py) {
  if (quizHolds()) {
    tip.innerHTML = REVIEW.on
      ? '<div class="n">place them first</div>'
        + '<div class="s">Every star opens once the board is checked — its '
        + 'name, type, distance, and its spectrum where there is one.</div>'
      : '<div class="n">answer first</div>'
        + '<div class="s">Every star opens once the question is answered — its '
        + 'name, type, distance, and its spectrum where there is one.</div>';
    placeTip(px, py);
    return;
  }
  const bits = [];
  if (s.solar) {
    // for a planet the useful line is where it is tonight, not a parallax
    bits.push('midnight ' + seasonLabel(currentDay()));
    bits.push(fmtRaDec(s.ra, s.dec));
    if (s.au) bits.push(fmtAu(s.au));
    let html = `<div class="n">${esc(s.label)}</div>` +
               `<div class="s">${bits.join(' · ')}</div>`;
    if (s.obs) html += `<div class="obs">spectrum recorded — click to open</div>`;
    tip.innerHTML = html;
    tip.style.display = 'block';
    const rr = tip.getBoundingClientRect();
    tip.style.left = Math.min(px + 16, window.innerWidth - rr.width - 12) + 'px';
    tip.style.top = Math.min(py + 16, window.innerHeight - rr.height - 12) + 'px';
    return;
  }
  if (s.sp) bits.push(esc(s.sp));
  if (s.vmag !== null && s.vmag !== undefined) bits.push('mag ' + s.vmag.toFixed(2));
  bits.push(s.dist ? fmtDist(s.dist) : 'no parallax');
  let html = `<div class="n">${esc(s.label || prettyId(s.id))}</div>` +
             `<div class="s">${bits.join(' · ')}</div>`;
  if (s.obs) html += `<div class="obs">spectrum recorded — click to open</div>`;
  tip.innerHTML = html;
  tip.style.display = 'block';
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(px + 16, window.innerWidth - r.width - 12) + 'px';
  tip.style.top = Math.min(py + 16, window.innerHeight - r.height - 12) + 'px';
}

// AU is the right unit for a planet and a silly one for the Moon, which sits
// at 0.0026 of one
function fmtAu(au) {
  if (!au) return '';
  return au < 0.01 ? Math.round(au * 149597.87) + ' thousand km'
                   : au.toFixed(2) + ' AU';
}

function fmtRaDec(ra, dec) {
  if (ra === null || dec === null) return '';
  const h = ra / 15, hh = Math.floor(h), mm = Math.round((h - hh) * 60);
  const d = Math.round(dec);
  return `${hh}h${String(mm % 60).padStart(2, '0')} ${d >= 0 ? '+' : ''}${d}°`;
}

function fmtDist(pc) {
  const ly = pc * 3.2616;
  return ly < 1000 ? ly.toFixed(ly < 100 ? 1 : 0) + ' ly'
                   : (ly / 1000).toFixed(2) + ' kly';
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// ============================================================ detail panel
const panel = document.getElementById('panel');
const pbody = document.getElementById('pbody');
document.getElementById('pclose').onclick = () => panel.classList.remove('open');

// ============================================================ description
// What build_star_facts.py fetched, laid out as the observer asked for it:
// the fields down the side, one column per star of the system. A single star
// is the same table with one column, so there is only ever one layout.
let FACTS = {};

const FACT_ROWS = [
  ['sp',          'spectral type', v => esc(v)],
  ['teff_k',      'temperature',   v => Math.round(v).toLocaleString() + ' K'],
  ['mass_msun',   'mass',          v => (+v).toFixed(v < 10 ? 2 : 1) + ' M☉'],
  ['vmag',        'apparent mag',  v => (+v).toFixed(2)],
  ['rv_kms',      'radial velocity', v => (+v).toFixed(1) + ' km/s'],
  ['radius_rsun', 'radius',        v => (+v).toFixed(2) + ' R☉'],
  ['lum_lsun',    'luminosity',    v => (+v).toLocaleString() + ' L☉'],
];

function fmtPeriod(d) {
  if (d === null || d === undefined) return null;
  if (d < 1) return (d * 24).toFixed(1) + ' hours';
  if (d < 900) return (+d).toFixed(d < 10 ? 3 : 2) + ' days';
  return (d / 365.25).toFixed(d / 365.25 < 100 ? 1 : 0) + ' years';
}

// The lines a star of this class should show, which is the thing the panel is
// FOR: it tells you what to look for in the plot underneath. Static knowledge
// keyed on the class, so it needs no fetch and can be reworded freely.
const CLASS_LINES = {
  O: 'the He II lines (4541, 4686) and He I, on a steep blue continuum. Hydrogen is present but weak — at this temperature it is nearly all ionised',
  B: 'He I (4471, 4922, 5876) at its strongest around B2, with the Balmer series deepening towards A',
  A: 'the Balmer series at its deepest — H-delta 4101, H-gamma 4340, H-beta 4861 and H-alpha 6563 — with the metal lines almost absent',
  F: 'the Balmer lines still clear but weakening, with Ca II H+K and the G band at 4300 coming up as the metals strengthen',
  G: 'the G band, Ca II H+K, Mg b at 5175 and Na D at 5893, with the Balmer lines now shallow',
  K: 'a crowded metal spectrum: Mg b, Na D, the Ca I 4227 line and the blue forest. The Balmer lines are barely there',
  M: 'the TiO bands, which is what makes an M star unmistakable — broad heads near 4760, 4954, 5167, 5448 and 6159 — over Na D and Ca I',
};

// 'kA4hF2VmF3' -> 'F2', 'K5V' -> 'K5', 'A3V + F0V' -> 'A3'. The Am case takes
// the hydrogen type for the same reason build_star_facts does: at 55 A FWHM
// the Balmer series is what the frame shows.
function displayType(sp) {
  let s = String(sp || '').trim();
  const am = /^k[OBAFGKM][\d.]*h([OBAFGKM][\d.]*)/.exec(s);
  if (am) s = am[1];
  const m = /^\s*(?:sd)?([OBAFGKM]\s*\d?(?:\.\d)?)/.exec(s);
  return m ? m[1].replace(/\s+/g, '') : null;
}

function linesSentence(sp) {
  const L = typeLetter(sp);
  if (!L) return null;
  if (L === 'W') return `As a Wolf-Rayet, this spectrum is one of the few in
    <em>emission</em>: broad He II and, for a WC, C III/C IV peaks standing well
    above the continuum rather than dips cut into it.`;
  const txt = CLASS_LINES[L];
  if (!txt) return null;
  const shown = displayType(sp) || L;
  const an = 'AFMO'.includes(shown[0]) ? 'an' : 'a';   // an A3, a K5
  return `As ${an} ${esc(shown)} star, expect ${txt}.`;
}

// ------------------------------------------------------------- variability
// What a variable star does, keyed on the GCVS/VSX type code. Static knowledge
// like CLASS_LINES: build_star_facts.py fetches WHICH type a star is, the
// period and the epoch, and this says what that type MEANS -- so the wording
// can be changed without re-running an hour of queries.
//
// `at_max` answers the only question worth asking of a variable star from a
// spectrograph: at the top of the cycle, is anything happening that the frame
// downstairs would show? For most types the honest answer is "it gets
// brighter and that is all", and it says so; a Mira is the one that puts the
// Balmer series into emission, and that is worth going out for.
const VAR_TYPES = {

         of which is not extra output but TiO: the bands that swallow the
         visual band at minimum thin out as the star heats. The thing to
         actually look for is emission: the pulsation shock reaches the
         photosphere around maximum and drives the Balmer lines into emission,
         H-delta and H-gamma first and strongest, H-beta and H-alpha weaker and
         partly re-absorbed above them. That reversal is the single most
         striking thing an amateur spectrum can catch on a star.` },
  SR: { label: 'semiregular', gloss: 'a pulsating red giant or supergiant that keeps only rough time',
        at_max: `it brightens by a few tenths to a couple of magnitudes, with
          the TiO band depths following it — shallower at maximum, deeper at
          minimum. No Balmer emission worth waiting for: the shock a Mira runs
          is not there.` },
  SRC: { label: 'semiregular supergiant', gloss: 'a pulsating red supergiant — Betelgeuse and mu Cephei are the type',
         at_max: `a magnitude or so, slowly and not on a schedule, with the TiO
           bands shallowest at maximum. The cycle repeats loosely at best and
           a long secondary period often runs underneath it.` },
  SRD: { label: 'semiregular yellow giant', gloss: 'an F, G or K giant or supergiant pulsating loosely',

  SRA: { label: 'semiregular, stable period', gloss: 'a late-type giant keeping a Mira-like period at a smaller amplitude',

  SRB: { label: 'semiregular, poor period', gloss: 'a late-type giant that drifts in and out of its period',

           the period is a mean, not a schedule.` },
  SRS: { label: 'short-period semiregular', gloss: 'a red giant pulsating in a low overtone',
         at_max: `hundredths to tenths of a magnitude over days to weeks.` },
  L: { label: 'slow irregular', gloss: 'it varies, and nothing about it repeats',
       at_max: `there is no cycle to date and no maximum to predict — the
         brightness wanders over a magnitude or so with no period behind it.` },
  LB: { label: 'slow irregular red giant', gloss: 'a late-type giant varying without a period',
        at_max: `a few tenths of a magnitude to about one, wandering. There is
          no cycle to predict from and no maximum to be at — Arcturus and many

  LC: { label: 'slow irregular supergiant', gloss: 'a red supergiant varying without a period',
        at_max: `about a magnitude, wandering, with no repeat to predict from.` },
  DCEP: { label: 'classical Cepheid', gloss: 'a radially pulsating yellow supergiant',
          at_max: `the star is at its hottest, bluest and smallest-looking just
            BEFORE maximum light, and the spectral type swings a whole class or
            more over the cycle — delta Cephei runs F5 at maximum to G1 at
            minimum. The lines ride the pulsation: tens of km/s of radial

            amateur spectroscopy project on one of these.` },
  DCEPS: { label: 'first-overtone Cepheid', gloss: 'a Cepheid pulsating in the first overtone, so nearly sinusoidal and small',

             and its amplitude has been shrinking for a century. The type still
             swings a little, and the radial velocity with it.` },
  CW: { label: 'W Virginis Cepheid', gloss: 'a Population II Cepheid — older and less luminous than a classical one',

  RR: { label: 'RR Lyrae', gloss: 'a pulsating horizontal-branch star',

  RV: { label: 'RV Tauri', gloss: 'a pulsating yellow supergiant with alternating minima',

  DSCT: { label: 'delta Scuti', gloss: 'a short-period pulsating A or F star',
          at_max: `hundredths of a magnitude on a cycle of hours. Real, and

  BCEP: { label: 'beta Cephei', gloss: 'a pulsating hot B star',

  ROAP: { label: 'rapidly oscillating Ap', gloss: 'a magnetic peculiar A star oscillating in minutes',

  PULS: { label: 'pulsating', gloss: 'pulsating, sub-type not settled',
          at_max: `it brightens as it pulses; the catalogue does not say which

  ACV: { label: 'alpha-2 Canum Venaticorum', gloss: 'a magnetic chemically peculiar star, varying by rotation',

  SXARI: { label: 'SX Arietis', gloss: 'a helium-variable magnetic B star',
           at_max: `hundredths of a magnitude, while the He I and Si III lines

  ROT: { label: 'rotational', gloss: 'brightness following features that turn with the star',

  ELL: { label: 'ellipsoidal', gloss: 'a close pair distorted by tides — no eclipse',
         at_max: `nothing intrinsic happens. The pair are pulled into ellipsoids

  BY: { label: 'BY Draconis', gloss: 'a spotted cool dwarf',

  E: { label: 'eclipsing binary', gloss: 'two stars, one passing in front of the other',

  EA: { label: 'Algol-type eclipsing binary', gloss: 'detached pair, flat outside eclipse',

  EB: { label: 'beta Lyrae-type eclipsing binary', gloss: 'a close, tidally distorted pair',

  SDOR: { label: 'luminous blue variable', gloss: 'an S Doradus variable, near the empirical luminosity limit',
          at_max: `one to several magnitudes over years, and NOT a change in

  WR: { label: 'Wolf-Rayet', gloss: 'a bare helium core driving an enormous wind',

  YHG: { label: 'yellow hypergiant', gloss: 'a rare unstable post-red-supergiant',

  ZAND: { label: 'symbiotic (Z Andromedae)', gloss: 'a red giant feeding a hot compact companion',

  UV: { label: 'flare star', gloss: 'a cool dwarf with magnetic flares',
        at_max: `flares of minutes, up to several magnitudes in the blue, with

  IA: { label: 'irregular, early type', gloss: 'an irregular variable with no period',
        at_max: `no cycle to predict; the changes are aperiodic.` },
  I: { label: 'irregular', gloss: 'an irregular variable with no period',
       at_max: `no cycle to predict; the changes are aperiodic.` },
  DPV: { label: 'double periodic variable', gloss: 'a mass-transferring pair with a long cycle on top of the orbit',
         at_max: `the orbital light curve plus a slow cycle of roughly 33 times
           the period, from the mass transfer itself.` },
  AGN: { label: 'active galactic nucleus', gloss: 'not a star at all — an accreting supermassive black hole',
         at_max: `aperiodic changes on timescales of days upwards, with broad
           emission lines throughout.` },
  R: { label: 'reflection variable', gloss: 'a close pair, one side of the cool star lit by the hot one',
       at_max: `nothing intrinsic: the heated face of the cooler star turns
         towards us once per orbit, so the period here is the orbit and the
         change is a few hundredths.` },
  VAR: { label: 'variable, type unknown', gloss: 'catalogued as varying, with the type not settled',
