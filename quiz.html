<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Constellation quiz</title>
<style>
  :root {
    --bg: #05070d; --panel: #161b22; --border: #30363d;
    --text: #e6edf3; --dim: #8b949e;
    --ok: #3fb950; --warn: #d29922; --fail: #f85149; --run: #58a6ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); overflow: hidden;
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  canvas#sky { display: block; width: 100vw; height: 100vh; cursor: grab; }
  canvas#sky.drag { cursor: grabbing; }

  /* ---- top-left title ---- */
  #brand { position: fixed; top: 16px; left: 18px; pointer-events: none; }
  #brand h1 { margin: 0; font-size: 1.05rem; letter-spacing: .02em; }
  #brand p { margin: 2px 0 0; color: var(--dim); font-size: .8rem; }
  #brand a { pointer-events: auto; color: var(--run); text-decoration: none; }
  #brand a:hover { text-decoration: underline; }

  /* ---- controls ---- */
  #ctl { position: fixed; bottom: 18px; left: 18px; background: rgba(22,27,34,.92);
         border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
         width: 340px; backdrop-filter: blur(6px); }
  #ctl .row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
  #ctl .row:last-child { margin-bottom: 0; }
  #ctl label { font-size: .78rem; color: var(--dim); width: 74px; flex: none; }
  #ctl input[type=range] { flex: 1; accent-color: var(--run); }
  #ctl .val { font-size: .74rem; color: var(--text); width: 54px; text-align: right;
              font-variant-numeric: tabular-nums; flex: none; }
  #ctl .val.stale { color: var(--dim); }
  /* A slider row stacks: the track, and its reading directly under it. The
     number belongs to the slider, so it sits with it rather than in a column
     off to the right that has to be read back across the panel. */
  #ctl .row.slider { align-items: flex-start; margin-bottom: 6px; }
  #ctl .row.slider label { padding-top: 1px; }
  #ctl .row.slider .track { flex: 1; min-width: 0; }
  #ctl .row.slider input[type=range] { display: block; width: 100%; margin: 0; }
  #ctl .row.slider .val { display: block; width: auto; text-align: right;
                          font-size: .7rem; margin-top: 1px; }
  /* The field is the one slider whose rate the observer feels, so it gets the
     whole panel width rather than sharing the row with its label. */
  /* a button sharing a slider row lines up with the track, not with the
     reading under it */
  #ctl .row.slider button.seg { align-self: flex-start; flex: none;
                                margin-top: -1px; white-space: nowrap; }
  #ctl .row.slider.wide { display: block; }
  #ctl .row.slider.wide label { display: block; width: auto; padding: 0 0 2px; }
  #ctl .toggles { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  #ctl .toggles button { background: #21262d; border: 1px solid var(--border);
        color: var(--dim); border-radius: 7px; padding: 4px 9px; font-size: .74rem;
        cursor: pointer; }
  #ctl .toggles button.on { background: #0d2b4e; border-color: var(--run); color: var(--run); }
  #ctl button.seg { background: #21262d; border: 1px solid var(--border); color: var(--dim);
        border-radius: 7px; padding: 3px 10px; font-size: .74rem; cursor: pointer; }
  #ctl button.seg.on { background: #0d2b4e; border-color: var(--run); color: var(--run); }
  #ctl .sep { border-top: 1px solid var(--border); margin: 11px 0 0; padding-top: 10px; }
  /* Minimise. The panel is 340px of controls over the bottom-left corner of a
     view whose whole point is the sky behind it, so it folds down to a chip
     that says what it is and gets out of the way. It stays anchored to the
     same corner either way -- a control that moves when you collapse it has
     to be hunted for when you want it back. */
  #ctl .min { position: absolute; top: 7px; right: 9px; background: none;
        border: 1px solid transparent; color: var(--dim); font-size: .9rem;
        line-height: 1; padding: 2px 6px; border-radius: 6px; cursor: pointer;
        font-family: inherit; }
  #ctl .min:hover { color: var(--text); background: #21262d; border-color: var(--border); }
  #ctl.folded { width: auto; padding: 6px 11px; }
  #ctl.folded #ctlbody { display: none; }
  #ctl.folded .min { position: static; font-size: .74rem; padding: 0; }
  #depthnote { font-size: .72rem; color: var(--dim); margin: 6px 0 0; line-height: 1.35; }

  /* ---- search ---- */
  #search { position: fixed; top: 62px; left: 18px; width: 252px; z-index: 15; }
  #search input { width: 100%; background: rgba(22,27,34,.92); color: var(--text);
        border: 1px solid var(--border); border-radius: 9px; padding: 7px 10px;
        font-size: .82rem; font-family: inherit; backdrop-filter: blur(6px); }
  #search input:focus { outline: none; border-color: var(--run); }
  #search input::placeholder { color: var(--dim); }
  #qlist { margin-top: 5px; background: rgba(22,27,34,.96); border: 1px solid var(--border);
        border-radius: 9px; overflow: hidden; display: none; backdrop-filter: blur(6px); }
  #qlist div { padding: 5px 10px; font-size: .8rem; cursor: pointer;
        display: flex; justify-content: space-between; gap: 8px; }
  #qlist div.sel, #qlist div:hover { background: #0d2b4e; }
  /* a variability note ("semiregular supergiant") is longer than "mag 2.1",
     so both halves give way rather than push the row wider than the box */
  #qlist div > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #qlist .k { color: var(--dim); font-size: .72rem; flex: 0 1 auto;
        align-self: center; }
  #qlist .miss { color: var(--dim); cursor: default; }
  #qlist .miss:hover { background: none; }
  /* a trait is one row for a whole set, and says so in the colour it will
     paint the sky */
  #qlist div.grp { color: #d2a8ff; }
  #qlist div.grp .k { color: #a371d6; }
  /* what is currently lit, and the way out of it */
  #mark { display: none; margin-top: 5px; align-items: center; gap: 8px;
        justify-content: space-between; background: rgba(43,27,61,.94);
        border: 1px solid #4c356b; border-radius: 9px; padding: 5px 10px;
        font-size: .76rem; color: #d2a8ff; backdrop-filter: blur(6px); }
  #mark .x { color: var(--dim); cursor: pointer; flex: none; }
  #mark .x:hover { color: #e6edf3; }

  /* ---- legend ---- */
  #legend { position: fixed; top: 16px; right: 18px; background: rgba(22,27,34,.92);
            border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px;
            backdrop-filter: blur(6px); }
  #legend .t { font-size: .72rem; color: var(--dim); margin-bottom: 7px;
               white-space: nowrap; }
  #legend .t b { color: var(--text); font-weight: 600; }
  #legend .ramp { display: flex; gap: 3px; }
  #legend .ramp div { width: 24px; text-align: center; font-size: .7rem;
                      padding: 3px 0; border-radius: 4px; color: #05070d;
                      font-weight: 700; cursor: pointer;
                      outline: 1px solid transparent; outline-offset: 1px; }
  /* W sits off the hot end and C, S off the cool one; the gaps say so without
     a second row or a caption */
  #legend .ramp div.gap { margin-left: 9px; }
  #legend .ramp div:hover, #legend .ramp div.pin { outline-color: var(--text); }
  #legend .ramp div.none { color: var(--text); }

  /* ---- hover tooltip ---- */
  #tip { position: fixed; pointer-events: none; background: rgba(13,17,23,.96);
         border: 1px solid var(--border); border-radius: 9px; padding: 8px 11px;
         font-size: .8rem; display: none; max-width: 260px; z-index: 20; }
  #tip .n { font-weight: 600; }
  #tip .s { color: var(--dim); font-size: .75rem; }
  #tip .obs { color: var(--run); font-size: .72rem; margin-top: 4px; }

  /* ---- side panel ---- */
  #panel { position: fixed; top: 0; right: 0; width: 420px; max-width: 92vw;
           height: 100%; background: var(--panel); border-left: 1px solid var(--border);
           padding: 20px 22px 40px; overflow-y: auto; transform: translateX(100%);
           transition: transform .22s ease; z-index: 30; }
  #panel.open { transform: none; }
  #panel h2 { margin: 0 0 2px; font-size: 1.2rem; }
  #panel .sub { color: var(--dim); font-size: .84rem; margin: 0 0 16px; }
  #panel .close { position: absolute; top: 14px; right: 16px; background: none;
                  border: none; color: var(--dim); font-size: 1.4rem; cursor: pointer; }
  #panel canvas { width: 100%; height: 150px; background: #0d1117;
                  border: 1px solid var(--border); border-radius: 8px; }
  #panel .caption { color: var(--dim); font-size: .72rem; margin: 6px 0 16px; }
  #panel dl { display: grid; grid-template-columns: 116px 1fr; gap: 5px 12px;
              margin: 0 0 16px; font-size: .84rem; }
  #panel dt { color: var(--dim); }
  #panel dd { margin: 0; }
  #panel img { width: 100%; border-radius: 8px; border: 1px solid var(--border);
               background: #fff; margin-bottom: 8px; }
  /* The description table. One column per star of the system, so a binary is
     read across rather than as two stacked blocks. */
  #panel table.facts { width: 100%; border-collapse: collapse; font-size: .8rem;
                       margin: 0 0 14px; }
  #panel table.facts th, #panel table.facts td {
      text-align: left; padding: 4px 8px 4px 0; vertical-align: top;
      border-bottom: 1px solid rgba(48,54,61,.6); }
  #panel table.facts th.f { color: var(--dim); font-weight: 400; width: 108px; }
  #panel table.facts thead th { color: #e6edf3; font-weight: 600;
                                border-bottom: 1px solid var(--border); }
  #panel table.facts td.num { font-variant-numeric: tabular-nums; }
  /* An estimate is not a measurement and must never read like one. */
  #panel .est { color: var(--dim); font-style: italic; }
  #panel .est::after { content: ' est'; font-size: .68rem; opacity: .8; }
  #panel .lines { background: rgba(88,166,255,.08);
                  border-left: 2px solid var(--run); padding: 8px 10px;
                  font-size: .78rem; margin: 0 0 14px; border-radius: 0 6px 6px 0; }
  #panel a.link { color: var(--run); text-decoration: none; font-size: .82rem; }
  #panel a.link:hover { text-decoration: underline; }
  .badge { font-size: .68rem; padding: 2px 8px; border-radius: 10px;
           text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  .badge.ok { background: #12351c; color: var(--ok); }
  .badge.warn { background: #3a2d0c; color: var(--warn); }
  .badge.none { background: #21262d; color: var(--dim); }
  /* A variable star is flagged where the type is, because "does this one
     change" belongs with "what kind of star is this", not buried further down. */
  .badge.var { background: #2b1b3d; color: #d2a8ff; }
  #panel .vartype { font-size: .78rem; color: var(--dim); }
  #panel .dimtype { color: var(--dim); }
  #panel .varbox { background: rgba(210,168,255,.09);
                   border-left: 2px solid #d2a8ff; padding: 8px 10px;
                   font-size: .78rem; margin: 10px 0 6px; border-radius: 0 6px 6px 0; }
  .note { border-left: 2px solid var(--warn); padding: 7px 11px; margin: 0 0 14px;
          background: #1c1708; color: #e2cf9a; font-size: .78rem; border-radius: 0 6px 6px 0; }

  /* ---- fallback / message overlay ---- */
  #msg { position: fixed; inset: 0; display: none; place-items: center; padding: 24px;
         background: rgba(5,7,13,.94); z-index: 40; overflow-y: auto; }
  #msg .card { background: var(--panel); border: 1px solid var(--border);
               border-radius: 14px; padding: 26px 28px; max-width: 620px; }
  #msg h2 { margin: 0 0 10px; font-size: 1.15rem; }
  #msg p { color: var(--dim); font-size: .88rem; }
  #msg code { background: #0d1117; border: 1px solid var(--border); border-radius: 6px;
              padding: 2px 7px; color: var(--text); font-size: .84rem; }
  #msg pre { background: #0d1117; border: 1px solid var(--border); border-radius: 8px;
             padding: 12px 14px; overflow-x: auto; font-size: .82rem; color: var(--text); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
           gap: 10px; margin-top: 16px; }
  .cards button { background: #0d1117; border: 1px solid var(--border); border-radius: 10px;
                  padding: 10px 12px; text-align: left; cursor: pointer; color: var(--text); }
  .cards button:hover { border-color: var(--run); }
  .cards .nm { font-weight: 600; font-size: .86rem; }
  .cards .tp { color: var(--dim); font-size: .74rem; }

  /* ==================================================== the quiz rail
     The rail is a real column, not a floating card: the sky sits BESIDE it
     rather than behind it, because a question that hides its own answer
     under the panel asking it is not a question. That costs the canvas the
     left 380px, which is the whole reason pointer coordinates are taken
     through ex()/ey() below instead of straight off the event. */
  :root { --rail: 380px; }

  #rail { position: fixed; left: 0; top: 0; bottom: 0; width: var(--rail);
          background: var(--panel); border-right: 1px solid var(--border);
          padding: 15px 17px 22px; overflow-y: auto; z-index: 25;
          display: flex; flex-direction: column; gap: 13px; }
  canvas#sky { width: calc(100vw - var(--rail)); margin-left: var(--rail); }

  /* The three controls the rail inherits stop being fixed corners and become
     rows of one column. Their ids, handlers and keyboard shortcuts are all
     unchanged -- only where they sit is. */
  #rail #brand { position: static; }
  #rail #search { position: static; width: auto; }
  #rail #ctl { position: relative; width: auto; bottom: auto; left: auto;
               background: rgba(13,17,23,.55); padding: 11px 12px; }
  #rail #ctl.folded { width: auto; }
  #rail #depthnote { display: none; }

  /* The quiz sits between the search box and the sliders, which is where it
     belongs: the search box is how you go looking for an answer, and the
     sliders are how you change what the sky is showing you while you look. */
  #quiz { border: 1px solid var(--border); border-radius: 12px;
          background: #0d1117; padding: 13px 14px 14px; }
  #quiz .head { display: flex; align-items: baseline; justify-content: space-between;
                gap: 8px; font-size: .72rem; color: var(--dim); margin-bottom: 9px; }
  #quiz .head b { color: var(--text); font-weight: 600; }
  #quiz .head .streak { color: var(--warn); }
  #quiz .kindname { text-transform: uppercase; letter-spacing: .05em;
                    font-size: .63rem; color: var(--run); }
  #quiz .ask { font-size: .93rem; line-height: 1.45; margin: 0 0 11px; }
  #quiz .ask em { color: var(--run); font-style: normal; font-weight: 600; }
  #quiz .ask .dir { color: var(--warn); font-style: normal; font-weight: 600; }

  /* One answer per row, full width: the options are names of very different
     lengths, and a grid would set its column to "Piscis Austrinus" and leave
     "Leo" adrift in the middle of it. */
  #quiz .opts { display: flex; flex-direction: column; gap: 6px; }
  #quiz .opts button { display: flex; align-items: center; gap: 9px; width: 100%;
        text-align: left; background: #161b22; border: 1px solid var(--border);
        color: var(--text); border-radius: 9px; padding: 7px 10px; cursor: pointer;
        font: inherit; font-size: .84rem; line-height: 1.35; }
  #quiz .opts button:hover:not(:disabled) { border-color: var(--run); background: #0d2b4e; }
  #quiz .opts button:disabled { cursor: default; }
  #quiz .opts .n { flex: none; width: 18px; height: 18px; border-radius: 5px;
        background: #21262d; color: var(--dim); font-size: .66rem;
        display: grid; place-items: center; font-variant-numeric: tabular-nums; }
  /* Right and wrong are said three ways at once -- the colour, the badge and
     a mark -- because colour alone is the one of the three that a colour-blind
     reader does not get. */
  #quiz .opts button.right { border-color: var(--ok); background: #12351c; }
  #quiz .opts button.right .n { background: var(--ok); color: #05070d; }
  #quiz .opts button.wrong { border-color: var(--fail); background: #3d1418; }
  #quiz .opts button.wrong .n { background: var(--fail); color: #05070d; }
  #quiz .opts button.faded { opacity: .45; }

  #quiz .why { margin: 11px 0 0; font-size: .79rem; line-height: 1.5;
               background: rgba(88,166,255,.08); border-left: 2px solid var(--run);
               padding: 9px 11px; border-radius: 0 6px 6px 0; }
  #quiz .why.miss { background: rgba(248,81,73,.08); border-left-color: var(--fail); }
  #quiz .why .d { color: var(--dim); }
  #quiz canvas.qspec { width: 100%; height: auto; aspect-ratio: 760 / 300;
        background: #0d1117; border: 1px solid var(--border);
        border-radius: 7px; display: block; margin-top: 6px; }
  #quiz .why em { color: var(--run); font-style: normal; font-weight: 600; }

  #quiz .go { margin-top: 11px; display: flex; gap: 8px; align-items: center; }
  #quiz .go button { flex: 1; background: #21262d; border: 1px solid var(--border);
        color: var(--text); border-radius: 9px; padding: 7px 10px; cursor: pointer;
        font: inherit; font-size: .82rem; }
  #quiz .go button.primary { background: #0d2b4e; border-color: var(--run); color: var(--run); }
  #quiz .go button:hover { border-color: var(--run); }
  #quiz .go .kbd { color: var(--dim); font-size: .68rem; flex: none; }

  /* What the quiz may ask, UNDER the question rather than over it: it is set
     once and then left alone, so it must not be the first thing read on
     every new question. */
  #qsetup { border-top: 1px solid var(--border); margin-top: 12px; padding-top: 10px; }
  #qsetup .lab { font-size: .7rem; color: var(--dim); margin-bottom: 6px; }
  #qsetup .segs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  #qsetup button { background: #161b22; border: 1px solid var(--border); color: var(--dim);
        border-radius: 7px; padding: 3px 9px; font: inherit; font-size: .72rem;
        cursor: pointer; }
  #qsetup button.on { background: #0d2b4e; border-color: var(--run); color: var(--run); }


  /* ==================================================== review
     The other half of the rail. A quiz asks and grades; a review shows you
     the sky with the names taken off and hands them back to you as a tray to
     put where they belong. Same sky, same isolate, same frame -- what changes
     is that the answer is not four buttons, it is the position on the screen.

     The mode switch sits ABOVE both, because it is the first decision: am I
     being tested or am I learning this. */
  #mode { display: flex; gap: 6px; }
  #mode button { flex: 1; background: #161b22; border: 1px solid var(--border);
        color: var(--dim); border-radius: 9px; padding: 6px 10px; font: inherit;
        font-size: .8rem; cursor: pointer; }
  #mode button.on { background: #0d2b4e; border-color: var(--run); color: var(--run); }
  #mode button:hover:not(.on) { color: var(--text); border-color: var(--dim); }

  #review { border: 1px solid var(--border); border-radius: 12px;
            background: #0d1117; padding: 13px 14px 14px; }
  #review .head { display: flex; align-items: baseline; justify-content: space-between;
                  gap: 8px; font-size: .72rem; color: var(--dim); margin-bottom: 9px; }
  #review .head b { color: var(--text); font-weight: 600; }
  #review .kindname { text-transform: uppercase; letter-spacing: .05em;
                      font-size: .63rem; color: var(--run); }
  #review .ask { font-size: .82rem; line-height: 1.45; margin: 0 0 11px;
                 color: var(--dim); }
  #review .ask em { color: var(--run); font-style: normal; font-weight: 600; }

  /* The tray. A chip is a name with nowhere to be yet; one that has been put
     somewhere stays in the list rather than leaving it, because picking it up
     again to move it is most of how a board like this is actually worked. */
  #review .tray { display: flex; flex-wrap: wrap; gap: 6px; }
  #review .tray button { background: #161b22; border: 1px solid var(--border);
        color: var(--text); border-radius: 8px; padding: 5px 10px; font: inherit;
        font-size: .79rem; cursor: pointer; line-height: 1.25; }
  #review .tray button:hover { border-color: var(--run); }
  /* Picked up: the violet the view already uses for "this one, here" -- the
     highlight ring, the search chip. One colour for one meaning. */
  #review .tray button.sel { background: #2b1b3d; border-color: #d2a8ff;
        color: #d2a8ff; }
  #review .tray button.put { color: var(--dim); background: #0d1117;
        border-style: dashed; }
  #review .tray button.right { border-color: var(--ok); background: #12351c;
        color: var(--text); }
  #review .tray button.wrong { border-color: var(--fail); background: #3d1418;
        color: var(--text); }
  #review .tray button .n { color: var(--dim); font-size: .68rem; }
  #review .tray button .d { color: var(--dim); font-size: .72rem; }

  #review .off { margin: 9px 0 0; font-size: .74rem; color: var(--warn);
        line-height: 1.4; }
  #review .off button { background: none; border: none; padding: 0;
        color: var(--run); font: inherit; font-size: .74rem; cursor: pointer;
        text-decoration: underline; }
  #review .go { margin-top: 11px; display: flex; gap: 8px; align-items: center; }
  #review .go button { flex: 1; background: #21262d; border: 1px solid var(--border);
        color: var(--text); border-radius: 9px; padding: 7px 10px; cursor: pointer;
        font: inherit; font-size: .82rem; }
  #review .go button.primary { background: #0d2b4e; border-color: var(--run); color: var(--run); }
  #review .go button:disabled { opacity: .45; cursor: default; }
  #review .go button:hover:not(:disabled) { border-color: var(--run); }
  #review .go .kbd { color: var(--dim); font-size: .68rem; flex: none; }

  #review .why { margin: 11px 0 0; font-size: .79rem; line-height: 1.5;
                 background: rgba(88,166,255,.08); border-left: 2px solid var(--run);
                 padding: 9px 11px; border-radius: 0 6px 6px 0; }
  #review .why.miss { background: rgba(248,81,73,.08); border-left-color: var(--fail); }
  #review .why .d { color: var(--dim); }
  #review .why em { color: var(--run); font-style: normal; font-weight: 600; }
  #review .why ul { margin: 6px 0 0; padding-left: 17px; }
  #review .why li { margin: 2px 0; }

  /* ---- the spectral ladder ----
     O at the top and M at the bottom, each rung a real frame off this
     telescope. Read down it and the Balmer lines rise, peak at A, fade
     through F, and the metal forest crowds in below -- which is the sequence
     itself, and is the one thing a table of descriptions cannot show. */
  #review .rung { border-top: 1px solid var(--border); padding: 11px 0 3px; }
  #review .rung:first-child { border-top: none; padding-top: 2px; }
  #review .rh { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  #review .rh .cl { flex: none; width: 21px; height: 21px; border-radius: 6px;
        display: grid; place-items: center; font-weight: 700; font-size: .78rem;
        color: #05070d; }
  #review .rh .nm { font-size: .78rem; overflow: hidden; text-overflow: ellipsis;
        white-space: nowrap; }
  #review .rh .nm .d { color: var(--dim); }
  #review .rh .more { margin-left: auto; flex: none; background: #21262d;
        border: 1px solid var(--border); color: var(--dim); border-radius: 7px;
        padding: 2px 8px; font: inherit; font-size: .68rem; cursor: pointer; }
  #review .rh .more:hover { color: var(--text); border-color: var(--run); }
  #review .sh { font-size: .74rem; color: var(--dim); line-height: 1.4;
        margin-bottom: 5px; }
  #review canvas.qspec { width: 100%; height: auto; aspect-ratio: 760 / 300;
        background: #0d1117; border: 1px solid var(--border);
        border-radius: 7px; display: block; }
  #review .rung.hid canvas.qspec { cursor: pointer; }
  #review .none { font-size: .74rem; color: var(--dim); font-style: italic; }

  #rsetup { border-top: 1px solid var(--border); margin-top: 12px; padding-top: 10px; }
  #rsetup .lab { font-size: .7rem; color: var(--dim); margin-bottom: 6px; }
  #rsetup .segs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  #rsetup .segs:last-child { margin-bottom: 0; }
  #rsetup button { background: #161b22; border: 1px solid var(--border); color: var(--dim);
        border-radius: 7px; padding: 3px 9px; font: inherit; font-size: .72rem;
        cursor: pointer; }
  #rsetup button.on { background: #0d2b4e; border-color: var(--run); color: var(--run); }

  body.reviewing #quiz { display: none; }
  body:not(.reviewing) #review { display: none; }

  /* A folded rail: the sky is what the questions are about, and reading a
     shape sometimes wants the whole screen. */
  #railmin { position: fixed; left: 10px; top: 12px; z-index: 26;
             background: rgba(22,27,34,.94); border: 1px solid var(--border);
             color: var(--dim); border-radius: 8px; padding: 4px 9px;
             font: inherit; font-size: .74rem; cursor: pointer; display: none; }
  #railmin:hover { color: var(--text); border-color: var(--run); }
  body.railed #rail { display: none; }
  body.railed canvas#sky { width: 100vw; margin-left: 0; }
  body.railed #railmin { display: block; }

  /* Under about 1100px the rail is most of the screen. It narrows rather than
     leaving -- the questions ARE the page. */
  @media (max-width: 1100px) { :root { --rail: 320px; } }

  /* The canvas is dragged, not scrolled. Without this a touch device pans
     and pinch-zooms the PAGE instead of turning the sky, and the drag
     handler never sees a move. It does nothing to a mouse, which is why it
     is not behind the phone query -- a touch-screen laptop wants it too. */
  canvas#sky { touch-action: none; }

  /* ==================================================== the phone
     Everything below is additive and lives behind one query. No rule here
     changes a value the desktop layout reads, and the two numbers the sky's
     geometry depends on -- the origin and the focal length -- come from
     SKY_INSET, which is zero unless this query matches. golden_desktop.json
     is what keeps that honest.

     The rail stops being a column down the left and becomes a sheet across
     the bottom, which is the same argument in a different aspect ratio: the
     sky has to be BESIDE the question, and on a portrait phone the only
     direction with room is up. A dropdown would not do -- the boards are
     tap-a-name-then-tap-the-sky, so the tray and the sky have to be on
     screen at the same time, and a menu that covers the thing you are about
     to tap makes that twelve open-and-close cycles. */
  @media (max-width: 720px) and (orientation: portrait) {
    /* The canvas keeps the whole screen and the sheet sits over it. dvh, not
       vh: on iOS `100vh` is the LARGE viewport, so a bottom-anchored sheet
       measured in vh hangs under the URL bar and takes its own buttons with
       it. */
    canvas#sky { width: 100vw; height: 100vh; height: 100dvh; margin-left: 0; }

    #rail {
      left: 0; right: 0; top: auto; bottom: 0; width: auto;
      height: var(--sheet, 52dvh);
      border-right: none; border-top: 1px solid var(--border);
      border-radius: 16px 16px 0 0;
      padding: 0 13px calc(14px + env(safe-area-inset-bottom));
      gap: 11px;
      box-shadow: 0 -8px 28px rgba(0, 0, 0, .55);
      transition: height .22s ease;
      overscroll-behavior: contain;
    }
    body.sheet-peek #rail { --sheet: 128px; }
    body.sheet-full #rail { --sheet: 88dvh; }

    /* The order the rail is written in is a desktop reading order -- title,
       search, then the question. On a phone the sheet opens from the bottom
       and the first thing above the fold has to be the thing being answered. */
    #rail > * { order: 3; }
    #sheetgrab { order: 0; }
    #mode      { order: 1; }
    #quiz, #review { order: 2; }
    #search    { order: 4; }
    #ctl       { order: 5; }
    #brand     { display: none; }

    /* The grab bar. It stays put while the sheet scrolls under it, because
       the way out of a full sheet must not be something you scroll to find.

       32px of it, not the 20px it was: the dash is 4px and the rest is the
       part a finger actually lands on, at the top edge of the sheet with the
       sky right above it -- aim high by a few pixels and the tap went to the
       canvas, which is a control that does nothing rather than a control that
       is hard to hit. `touch-action: none` because the bar is DRAGGED: without
       it the first millimetre scrolls the sheet's own content instead. */
    #sheetgrab { display: block; position: sticky; top: 0; z-index: 2;
                 margin: 0 -13px; padding: 15px 0 13px;
                 background: linear-gradient(var(--panel) 72%, transparent);
                 border: none; width: calc(100% + 26px); cursor: grab;
                 touch-action: none; -webkit-user-select: none;
                 user-select: none; -webkit-tap-highlight-color: transparent; }
    #sheetgrab:active { cursor: grabbing; }
    #sheetgrab::before { content: ''; display: block; width: 42px; height: 4px;
                 margin: 0 auto; border-radius: 3px; background: #4d5662; }
    #sheetgrab:active::before { background: var(--run); }

    /* While a finger is on the bar the height IS the finger: a .22s ease on
       top of that is the sheet arriving where the finger was a moment ago. */
    body.sheet-dragging #rail { transition: none; }

    /* A finger is about 44px and does not get bigger when the text does, so
       these stay in px while the type around them stays in rem. */
    #quiz .opts button, #review .tray button, #review .go button,
    #mode button { min-height: 44px; }
    #quiz .opts button { font-size: .9rem; }
    #review .tray button { font-size: .86rem; padding: 6px 12px; }
    #qsetup button, #rsetup button { min-height: 34px; padding: 4px 11px; }

    /* Hover-only affordances have no touch equivalent. The legend is not one
       of them -- what it loses on a phone is the hover, not the ramp, and a
       colour nobody can ask about is decoration. So it stays, spanning the
       top the sheet never reaches, and a tap does what a hover did: see
       tapClass(). #railmin and #tip have no touch story and stay gone. */
    #railmin, #tip { display: none !important; }

    /* Eleven swatches at a fixed 24px plus the label beside them do not fit
       360px of screen, so the ramp becomes a full-width row that divides the
       space it has and the label wraps under it instead of running off. */
    #legend { top: calc(8px + env(safe-area-inset-top)); left: 10px; right: 10px;
              padding: 8px 9px; }
    #legend .t { white-space: normal; font-size: .68rem; margin-bottom: 6px; }
    #legend .ramp { gap: 2px; }
    #legend .ramp div { width: auto; flex: 1; min-width: 0; font-size: .68rem;
                        padding: 7px 0; }
    #legend .ramp div.gap { margin-left: 6px; }
    /* iOS leaves :hover stuck on the last thing tapped, which would outline a
       swatch that is not the pinned one. The pin is the only outline here. */
    #legend .ramp div:hover:not(.pin) { outline-color: transparent; }

    #panel { width: 100vw; max-width: 100vw; }
    #ctl { padding: 10px 11px; }
    #ctl label { width: 62px; }
    #msg .card { padding: 20px 18px; }
  }

  /* Landscape on the same handset is the tablet case: ~670-930px of width is
     enough for the column the desktop already has, and it is how somebody
     holds a phone to look at a sky chart anyway. So the rail stays a rail and
     only narrows. */
  @media (max-width: 960px) and (orientation: landscape) {
    :root { --rail: 290px; }
    #brand h1 { font-size: .95rem; }
    #brand p { display: none; }
  }
</style>
</head>
<body>

<canvas id="sky"></canvas>
<button id="railmin" title="Bring the questions back">questions</button>

<div id="rail">

<button id="sheetgrab" style="display:none" aria-label="Resize the panel"></button>

<div id="brand">
  <h1>Constellation quiz</h1>
  <p><span id="count"></span></p>
  <p id="unplaced" style="display:none"></p>
</div>

<div id="search">
  <input id="q" type="text" autocomplete="off" spellcheck="false"
         placeholder="a star, planet, constellation or &quot;variable&quot;  ( / )">
  <div id="qlist"></div>
  <div id="mark"></div>
</div>

<!-- Am I being tested, or am I learning this? That is the first decision on
     the page, so it sits above both panels rather than inside either. -->
<div id="mode">
  <button id="mQuiz" class="on">quiz</button>
  <button id="mReview">review</button>
</div>

<div id="quiz"></div>
<div id="review"></div>

<div id="ctl">
  <button id="ctlmin" class="min" title="Hide the controls">&minus;</button>
  <div id="ctlbody">
  <div class="row">
    <label>lines</label>
    <button id="tLines" class="seg on">all</button>
    <button id="tLabels" class="seg on">names</button>
    <button id="tObs" class="seg">only mine</button>
  </div>
  <div class="row">
    <label>colour</label>
    <button id="tClass" class="seg on">class</button>
    <button id="tNat" class="seg">natural</button>
  </div>
  <div class="row">
    <label>glow</label>
    <button id="tHalo" class="seg on">halos</button>
    <button id="tPulse" class="seg on">pulse</button>
  </div>
  <div class="row slider wide">
    <label for="zoom">field</label>
    <div class="track">
      <input type="range" id="zoom" min="0" max="1000" step="0.5" value="579">
      <span class="val" id="zoomv">70&deg;</span>
    </div>
  </div>
  <div class="row slider">
    <label for="mag">magnitude</label>
    <div class="track">
      <input type="range" id="mag" min="1" max="7.5" step="0.1" value="5.0">
      <span class="val" id="magv">5.0</span>
    </div>
    <button id="tRawMag" class="seg">raw mag</button>
  </div>
  <div class="row slider" title="Your sky, on the Bortle scale — worst on the left, pristine on the right, the same way up as the magnitude slider. Each class carries a naked-eye limiting magnitude, and the view is cut at whichever is tighter, this or the magnitude slider. The two stops past 9 are worse than the scale itself goes.">
    <label for="bortle">bortle</label>
    <div class="track">
      <input type="range" id="bortle" min="0" max="10" step="1" value="10">
      <span class="val" id="bortlev">B1 &rarr; 7.8</span>
    </div>
  </div>
  <div class="row slider" title="Figures ranked by the light they put on the sky. Slide left and the faint ones drop away first; slide right and they come back.">
    <label for="figs">figures</label>
    <div class="track">
      <input type="range" id="figs" min="0" max="88" step="1" value="88">
      <span class="val" id="figsv">all</span>
    </div>
  </div>
  <div class="row slider" title="The sky at midnight on this date: what is overhead then comes to the centre, and the Sun, Moon and planets move to where they really are.">
    <label for="season">date</label>
    <div class="track">
      <input type="range" id="season" min="0" max="365" step="1" value="0">
      <span class="val" id="seasonv">&mdash;</span>
    </div>
  </div>

  <p id="depthnote">Drag to turn the sky, scroll to zoom.</p>

  <!-- Everything below leaves the Earth's-eye view. It is deliberately behind
       a switch: the sky humans see is a shell, and a stray slider that shows
       Orion from the side is not a thing to stumble into. -->
  <div class="sep"><button id="b3d" class="seg">show real distances &raquo;</button></div>
  <div id="deep" style="display:none">
    <div class="row slider">
      <label for="depth">explode</label>
      <div class="track">
        <input type="range" id="depth" min="0" max="1" step="0.001" value="0">
        <span class="val" id="depthv">off</span>
      </div>
    </div>
    <div class="row slider">
      <label for="back">step back</label>
      <div class="track">
        <input type="range" id="back" min="0" max="1" step="0.001" value="0">
        <span class="val" id="backv">0</span>
      </div>
    </div>
    <div class="toggles">
      <button id="tLog">log scale</button>
      <button id="bReset">back to the Earth view</button>
    </div>
  </div>
  </div>
</div>

</div><!-- /rail -->

<div id="legend">
  <div class="t" id="ramplabel">spectral class</div>
  <div class="ramp" id="ramp"></div>
</div>

<div id="tip"></div>

<div id="panel">
  <button class="close" id="pclose">&times;</button>
  <div id="pbody"></div>
</div>

<div id="msg"><div class="card" id="msgbody"></div></div>

<script>
'use strict';

// ============================================================ colour by class
// Deliberately EXAGGERATED. Real stellar colours are far subtler than this --
// even Betelgeuse is a pale apricot to the eye, not the red drawn here -- but
// the whole point of the view is to read temperature at a glance, so the ramp
// is pushed well past what a camera would record.
const CLASS_COLOR = {
  W: '#c77dff',   // Wolf-Rayet: hotter than O, and off the MK sequence
  O: '#4d6bff', B: '#8fb2ff', A: '#dfe9ff', F: '#ffffff',
  G: '#ffe07a', K: '#ffa445', M: '#ff4a2a',
  C: '#ff2f14', S: '#ff5a2a',                  // carbon / S: deep red
};
const UNKNOWN_COLOR = '#8a93a3';

// What the eye actually gets. Stellar colours are washed out because the
// stars are near the top of the eye's range and colour vision gives up in the
// dark -- even Betelgeuse is a pale apricot, not red. These are the same
// sequence pulled most of the way to white, for the "natural" mode.
const NATURAL_COLOR = {
  W: '#e2e9ff', O: '#dde6ff', B: '#e8eeff', A: '#f5f7ff', F: '#fdfdfb',
  G: '#fff9ee', K: '#fff1de', M: '#ffe6d2', C: '#ffdfc8', S: '#ffe3cd',
};
const NATURAL_UNKNOWN = '#f6f8fb';

// Each body in its own colour -- the disc's true one, pushed the same way the
// stellar ramp is pushed, because the job here is to be findable among a
// thousand stars. Mars is the rust of its dust, Jupiter the tan of its bands,
// Saturn butterscotch, Uranus and Neptune the methane cyan and azure that
// their own spectra cause. They are the same in both colour modes: there is
// no MK ramp to undo, and a planet's spectral "type" is prose -- Saturn's
// reads "reflected sunlight + CH4", which the class ramp cannot read.
const SOLAR_COLOR = {
  sun: '#ffe066', moon: '#eceff3', mercury: '#b8a894', venus: '#fff0b0',
  mars: '#e2542a', jupiter: '#e8a951', saturn: '#e9c76a',
  uranus: '#4fd8e8', neptune: '#3f6fe0',
};
function solarColor(s) { return SOLAR_COLOR[s.id] || '#e9c76a'; }

// How big to draw each body. This is a glyph size, not a magnitude -- see the
// note in sizeOf() -- ordered roughly by how much of the sky each one owns.
// Saturn is drawn small because its rings take the space back.
const SOLAR_R = {
  sun: 7.5, moon: 7.5, venus: 7, jupiter: 7.5, mars: 6.5,
  saturn: 6, mercury: 5.5, uranus: 6, neptune: 5.5,
};

// 'class'   -- exaggerated, temperature readable at a glance
// 'natural' -- as the eye would see it, brightness doing the work
let colorMode = 'class';
// The legend is the MK ramp plus the three kinds of star that are not on it:
// Wolf-Rayets off the hot end, carbon and S stars off the cool end, and
// whatever carries no readable type at all. Leaving those out drew them on the
// sky in colours the legend never explained -- the violet in particular, which
// is the most conspicuous thing up there.
const RAMP_ORDER = ['W','O','B','A','F','G','K','M','C','S','?'];
const RAMP_GAP = new Set(['O', 'C', '?']);      // where the three groups part
const CLASS_NOTE = {
  W: 'Wolf-Rayet, hotter than O and off the sequence',
  O: 'the hot end, blue',
  B: 'blue-white',
  A: 'white',
  F: 'yellow-white',
  G: "yellow, the Sun's class",
  K: 'orange',
  M: 'red',
  C: 'carbon, off the sequence',
  S: 'S-type, zirconium oxide',
  '?': 'no type the catalogue could read',
};

// The highlight a searched-for trait paints: the violet of the panel's own
// variable badge, so the mark on the sky and the badge in the panel are
// plainly the same statement. MARK_DIM is what everything else drops to.
const MARK_COLOR = '#d2a8ff';
const MARK_DIM = 0.3;
const MARK_NAME_MAX = 8;   // a highlight this small is named as well as ringed

// The legend class under the pointer, as a set of stars. It is the same idea
// as MARKED and deliberately not the same state: a highlight you searched for
// is a thing you chose and has a chip and an Escape, and a class you are
// pointing at lasts exactly as long as you point at it.
let HOVER_SET = null, HOVER_KEY = null;

const CON_NAMES = {
  And:'Andromeda',Ant:'Antlia',Aps:'Apus',Aqr:'Aquarius',Aql:'Aquila',Ara:'Ara',
  Ari:'Aries',Aur:'Auriga',Boo:'Boötes',Cae:'Caelum',Cam:'Camelopardalis',
  Cnc:'Cancer',CVn:'Canes Venatici',CMa:'Canis Major',CMi:'Canis Minor',
  Cap:'Capricornus',Car:'Carina',Cas:'Cassiopeia',Cen:'Centaurus',Cep:'Cepheus',
  Cet:'Cetus',Cha:'Chamaeleon',Cir:'Circinus',Col:'Columba',Com:'Coma Berenices',
  CrA:'Corona Australis',CrB:'Corona Borealis',Crv:'Corvus',Crt:'Crater',
  Cru:'Crux',Cyg:'Cygnus',Del:'Delphinus',Dor:'Dorado',Dra:'Draco',
  Equ:'Equuleus',Eri:'Eridanus',For:'Fornax',Gem:'Gemini',Gru:'Grus',
  Her:'Hercules',Hor:'Horologium',Hya:'Hydra',Hyi:'Hydrus',Ind:'Indus',
  Lac:'Lacerta',Leo:'Leo',LMi:'Leo Minor',Lep:'Lepus',Lib:'Libra',Lup:'Lupus',
  Lyn:'Lynx',Lyr:'Lyra',Men:'Mensa',Mic:'Microscopium',Mon:'Monoceros',
  Mus:'Musca',Nor:'Norma',Oct:'Octans',Oph:'Ophiuchus',Ori:'Orion',Pav:'Pavo',
  Peg:'Pegasus',Per:'Perseus',Phe:'Phoenix',Pic:'Pictor',Psc:'Pisces',
  PsA:'Piscis Austrinus',Pup:'Puppis',Pyx:'Pyxis',Ret:'Reticulum',Sge:'Sagitta',
  Sgr:'Sagittarius',Sco:'Scorpius',Scl:'Sculptor',Sct:'Scutum',Ser:'Serpens',
  Sex:'Sextans',Tau:'Taurus',Tel:'Telescopium',Tri:'Triangulum',
  TrA:'Triangulum Australe',Tuc:'Tucana',UMa:'Ursa Major',UMi:'Ursa Minor',
  Vel:'Vela',Vir:'Virgo',Vol:'Volans',Vul:'Vulpecula',
};

// First MK letter of a type string. 'K3II + B8Ve' -> 'K' (the primary is what
// dominates the light). Mirrors sky_data.type_letter on the server.
function typeLetter(sp) {
  if (!sp) return null;
  const head = String(sp).trim().split(/\s*[+\/]\s*/)[0];
  if (/^W[NCO]/i.test(head)) return 'W';
  let m = head.match(/^\s*(?:sd)?([OBAFGKM])\s*\d/i);
  if (m) return m[1].toUpperCase();
  if (/^[CS]/.test(head) && head.length <= 12 && !/\s/.test(head))
    return head[0].toUpperCase();
  // Last resort only for things that still LOOK like a type. A planet's
  // "reflected sunlight + CH4" is prose, and the bare letter search would
  // pull the F out of "reflected" and paint Saturn as an F star.
  if (head.length > 12 || /\s/.test(head)) return null;
  m = head.toUpperCase().match(/([OBAFGKM])/);
  return m ? m[1] : null;
}
function colorFor(sp) {
  const l = typeLetter(sp);
  return colorMode === 'natural' ? (NATURAL_COLOR[l] || NATURAL_UNKNOWN)
                                 : (CLASS_COLOR[l] || UNKNOWN_COLOR);
}
// the panel's swatch always names the class, whatever the sky is showing
function classColorFor(sp) { return CLASS_COLOR[typeLetter(sp)] || UNKNOWN_COLOR; }

// ============================================================ state
const R0 = 100;          // the celestial-sphere radius, in scene units
// The field is the VERTICAL one: the screen's height spans exactly this many
// degrees. 340 is not an arbitrary ceiling -- it is the setting at which the
// whole sky, bar the 10 degree cap directly behind you that the projection
// sends to infinity, lands inside the screen height. (At the old 170 the top
// edge reached only 85 degrees off axis and the corners 124, so the far
// two-fifths of the sky was nowhere on the page.) Past about 180 the outer
// ring is sky behind you, which is what an all-sky chart is.
const FOV_MIN = 8, FOV_MAX = 340, FOV_OPEN = 70;
const FIG_MAX_DEG = 40;  // widest a figure segment may subtend at the camera
const FIG_MAX_COS = Math.cos(FIG_MAX_DEG * Math.PI / 180);
const D_REF = 40;        // parsecs that map onto R0 when depth is fully on
const cv = document.getElementById('sky');
const cx2 = cv.getContext('2d');
const tip = document.getElementById('tip');

let DATA = null, STARS = [], FIGS = [], SOLAR_SKY = [];
let yaw = 5.0, pitch = 0.5, back = 0, depth = 0, fovDeg = 70, magLimit = 5.0;
let rawMag = false;             // the slider as a flat cut, no exemptions
// The Bortle scale is defined BY its naked-eye limiting magnitude -- class 1
// is 7.6-8.0, class 9 is 4.0 AND WORSE -- so the class is already a magnitude
// and nothing has to be modelled to use it. Each entry is the middle of its
// class's range.
//
// The table runs in SLIDER order: worst sky on the left, pristine on the
// right, so it reads the same way up as the magnitude slider above it -- left
// is fewer stars on both, which is the only arrangement that does not have to
// be relearned each time.
//
// The last two stops are past the end of the scale and say so. Class 9 is
// open-ended at the bottom ("4.0 or less"), and a floodlit city centre or a
// full Moon over one goes well past 3.8 -- which is the honest place to put
// them, rather than quietly redefining what a 9 means.
const SKIES = [
  { cls: '9++', nelm: 2.5, name: 'a moonlit city centre — past the scale' },
  { cls: '9+',  nelm: 3.2, name: 'a floodlit sky — past the scale' },
  { cls: '9',   nelm: 3.8, name: 'an inner-city sky' },
  { cls: '8',   nelm: 4.3, name: 'a city sky' },
  { cls: '7',   nelm: 4.8, name: 'a suburban / urban sky' },
  { cls: '6',   nelm: 5.3, name: 'a bright suburban sky' },
  { cls: '5',   nelm: 5.8, name: 'a suburban sky' },
  { cls: '4',   nelm: 6.3, name: 'a rural / suburban sky' },
  { cls: '3',   nelm: 6.8, name: 'a rural sky' },
  { cls: '2',   nelm: 7.3, name: 'a typical dark sky' },
  { cls: '1',   nelm: 7.8, name: 'an excellent dark sky' },
];
const SKY_BEST = SKIES.length - 1;      // class 1: the far right, and the default
let bortle = SKY_BEST;                  // index into SKIES, not a class number
const sky = () => SKIES[bortle];

// The cut the sky is actually drawn to. The two sliders are different
// questions -- the magnitude one is how deep you want to look, the Bortle one
// is how much your sky takes away -- and the answer to both at once is
// whichever bites first. Bortle off leaves the magnitude slider alone.
function skyLimit() {
  return Math.min(magLimit, sky().nelm);
}
let lineMode = 'all';           // 'all' | 'main' | 'off'
let showLabels = true, obsOnly = false, logDepth = false;
// Star names, separately from the constellation captions. The two ride on
// showLabels together in the sky view, which is fine there and not here: a
// star's own label carries its constellation ("gam Cyg"), so above the easy
// level it answers half the questions on the page by itself.
let showStarNames = true;
let showHalo = true, pulsing = true;
let MAIN_CONS = new Set();      // constellations holding an observed star
let CON_LABELS = [];            // {abbr, name, stars[]} for the figure captions
let CON_RANK = new Map();       // abbr -> 0 (brightest figure) .. 87
let CON_ORDER = [];             // the same ranking as a list, brightest first
let conCut = 88;                // how many of that ranking are drawn
let SITE_LAT = null;            // degrees, from the captures; null if unknown
let INDEX = [];          // {key, label, kind, ref} for the search box
let SEARCH_HIT = null;   // the last thing found: always drawn, however faint
let MARKED = new Set();  // every star of a searched-for trait, lit where it is
let MARK_LABEL = '';     // the trait they were lit for
// The stars THIS QUESTION is pointing at, which is not the same thing as
// whatever is highlighted: the search box can light 575 variables, and they
// are not what is being asked about. Only markStars() fills it. It is the one
// thing the flat cut lets through, for the reason the search hit is let
// through -- see magHidden().
let QUIZ_MARKS = new Set();
let FLASH = null;        // {ref, kind, t0} -- the ping that says "here"
let TWEEN = null;        // an easing turn toward something searched for
let proj = [];           // per-frame [{s, x, y, r}] for hit-testing
// A question poses itself by taking the rest of the sky away. ISOLATE is the
// set of constellations still drawn and ISOLATE_STARS is exactly the stars
// their figures are built from -- so "only Orion, and the rest black" is one
// assignment rather than a second drawing path. Null the rest of the time.
let ISOLATE = null, ISOLATE_STARS = null;
// The ring of sky just outside an isolated board: drawn, but as context. A
// review group is what a beginner learns together, and the quiz is under no
// such rule -- "which constellation is this?" can put Lyra beside Leo. So a
// board that blacks out everything but its own six shapes teaches them with
// nothing to confuse them with, which is the one thing the question will do.
// These are drawn with a fainter figure, are never targets, and sit outside
// the frame the board opens at -- so they are found by turning the sky.
let ISOLATE_NEAR = null;
// The solar system, off. A `planet` question asks where a body stands on a
// given date, and a dot you can see is not a question about where it is. Only
// that generator sets this, and quizSky() clears it for every other one -- the
// same shape of rule as REGIONS, and for the same reason.
let HIDE_SOLAR = false;
// Circled areas of sky a question is asking about. A region is a direction
// and an angular radius -- a cap on the sphere -- not a shape on the screen,
// so it stays true wherever it lands in the projection.
let REGIONS = [];
const REGION_COLOR = '#f0b429';
// The one that turns out to be the answer. It is the card's own --ok, the
// green the right option goes on the button, so the colour says the same
// thing in both places rather than being a second vocabulary.
const REGION_HIT = '#3fb950';
let hoverStar = null, W = 0, H = 0, DPR = 1;

// Pointer events carry WINDOW coordinates and the drawing uses CANVAS ones.
// In the sky view those are the same number, because the canvas fills the
// window; here they are not, because it sits beside the rail. Read once per
// resize rather than per event -- a getBoundingClientRect on every
// pointermove is a forced layout on every frame of a drag.
let CVX = 0, CVY = 0;
const ex = e => e.clientX - CVX, ey = e => e.clientY - CVY;

// ---- the part of the canvas something is sitting on top of ---------------
// On a phone the rail is a sheet ACROSS the bottom rather than a column down
// the left, so the canvas keeps its full height and the bottom of it is
// covered. Which is the same problem ex()/ey() solves one axis over: a number
// that used to be the canvas is now only part of it, and everything that
// assumed otherwise is quietly off by half the difference.
//
// Centring at H/2 would put a constellation half under the sheet, and a field
// computed from H would mean a vertical angle that is partly not on screen.
// So the origin and the focal length are both taken from the VISIBLE height,
// and every projection, un-projection and drag goes through these three.
//
// It is zero on a desktop, where visH() === H and all three return exactly
// what the arithmetic returned before -- which is what golden_desktop.json is
// there to keep true.
let SKY_INSET = 0;
let PHONE = false;          // read on a change, not per star per frame
function visH() { return Math.max(80, H - SKY_INSET); }

// A star is drawn in PIXELS and a constellation is drawn in DEGREES. On a
// phone the figure shrinks with the screen and the dots do not, so the shape
// disappears under its own stars -- the bright ones stop carrying it and
// start covering it. This is the only place the size of the canvas enters the
// size curve, and it is exactly 1 anywhere but a phone, where the reference
// is the height the view was drawn for.
// The SMALLER of the two dimensions, not the height: what constrains how big
// the sky looks is the narrow side, and on a phone that is the width. Keying
// off height alone would also conflate two different things -- a screen that
// is small, and a sheet that happens to be open -- and shrink the stars every
// time the panel was raised.
const STAR_REF = 900;      // the short side of the canvas this was drawn for
// Where the magnitude ramp stops being the curve it was designed as. The
// radius at magnitude 0 is 8.5, so this is a shade above it: the brightest
// star the ramp was drawn for keeps its size and the two beyond it are
// compressed rather than cut, so Sirius is still plainly the biggest thing
// on the sky.
const STAR_KNEE = 9;
function starScale() {
  if (!PHONE) return 1;
  return Math.max(0.5,
                  Math.min(1, Math.pow(Math.min(W, visH()) / STAR_REF, 0.65)));
}
function ox0() { return W / 2; }
function oy0() { return visH() / 2; }
function focalOf() { return (visH() / 2) / (2 * Math.tan(fovDeg * Math.PI / 720)); }

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const box = cv.getBoundingClientRect();
  CVX = box.left; CVY = box.top;
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cx2.setTransform(DPR, 0, 0, DPR, 0, 0);
  draw();
}
window.addEventListener('resize', resize);

// ============================================================ geometry
function unitVec(raDeg, decDeg) {
  const ra = raDeg * Math.PI / 180, dec = decDeg * Math.PI / 180;
  const cd = Math.cos(dec);
  return [cd * Math.cos(ra), cd * Math.sin(ra), Math.sin(dec)];
}

// Where a star sits right now, between the sphere and its true distance.
// A star with no measured parallax cannot be moved outward at all, so it stays
// pinned to the sphere however far the slider is pushed -- and is drawn hollow
// once the slider leaves zero, so it never reads as a real position.
function radiusOf(s) {
  if (!s.dist) return R0;
  let tr;
  if (logDepth) {
    tr = R0 * (1 + Math.log10(Math.max(s.dist, 0.4) / D_REF));
    if (tr < R0 * 0.12) tr = R0 * 0.12;
  } else {
    tr = R0 * s.dist / D_REF;
  }
  return R0 * (1 - depth) + tr * depth;
}

function camera() {
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const f = [cp * Math.cos(yaw), cp * Math.sin(yaw), sp];
  // right = f x worldUp, normalised; pitch is clamped so this never degenerates
  let r = [f[1] * 1 - f[2] * 0, f[2] * 0 - f[0] * 1, 0];
  const rl = Math.hypot(r[0], r[1], r[2]) || 1;
  r = [r[0] / rl, r[1] / rl, r[2] / rl];
  const u = [r[1] * f[2] - r[2] * f[1],
             r[2] * f[0] - r[0] * f[2],
             r[0] * f[1] - r[1] * f[0]];
  // Depth alone is invisible from the origin: moving a star along its own
  // line of sight cannot change where it projects. So the depth slider drags
  // the camera out with it, and the manual control only ever adds to that.
  const backDist = Math.max(back, depth * 0.55) * 900;
  const c = [-f[0] * backDist, -f[1] * backDist, -f[2] * backDist];
  // k such that half the field lands on half the screen, with 2k tan(theta/2)
  return { f, r, u, c, focal: focalOf() };
}

// Stereographic, not gnomonic. A gnomonic projection is x/z -- a straight
// perspective divide -- and it runs to infinity at 90 degrees from the axis,
// so the field cannot usefully open past about 120 and the edges stretch
// horribly well before that. A constellation is 20-30 degrees across and you
// want several at once, so the wide end is exactly where this view lives.
// Stereographic (r = 2k tan(theta/2)) stays finite out to nearly 180, keeps
// circles as circles, and is what planetariums project with.
function project(pos, cam) {
  const v = [pos[0] - cam.c[0], pos[1] - cam.c[1], pos[2] - cam.c[2]];
  const z = v[0] * cam.f[0] + v[1] * cam.f[1] + v[2] * cam.f[2];
  const x = v[0] * cam.r[0] + v[1] * cam.r[1] + v[2] * cam.r[2];
  const y = v[0] * cam.u[0] + v[1] * cam.u[1] + v[2] * cam.u[2];
  const rho = Math.hypot(x, y);
  const len = Math.hypot(rho, z);
  if (!len) return null;
  const theta = Math.atan2(rho, z);
  if (theta > 2.967) return null;                  // within 10 deg of the antipode
  const R = 2 * cam.focal * Math.tan(theta / 2);
  if (!isFinite(R)) return null;
  const ux = rho ? x / rho : 0, uy = rho ? y / rho : 0;
  return { x: ox0() + R * ux, y: oy0() - R * uy, z: len, theta };
}

// The inverse of project(): which way in the sky is under this pixel.
// Stereographic maps screen radius R to angle theta by R = 2k tan(theta/2),
// so theta = 2 atan(R / 2k) and the rest is the camera basis.
function unproject(px, py, cam) {
  const ox = px - ox0(), oy = -(py - oy0());
  const R = Math.hypot(ox, oy);
  const theta = 2 * Math.atan(R / (2 * cam.focal));
  const st = Math.sin(theta), ct = Math.cos(theta);
  const ux = R ? ox / R : 0, uy = R ? oy / R : 0;
  const cxk = st * ux, cyk = st * uy, czk = ct;
  return [
    cam.r[0] * cxk + cam.u[0] * cyk + cam.f[0] * czk,
    cam.r[1] * cxk + cam.u[1] * cyk + cam.f[1] * czk,
    cam.r[2] * cxk + cam.u[2] * cyk + cam.f[2] * czk,
  ];
}

// Aim the camera so that world direction D lands exactly on pixel (px,py),
// solved rather than iterated.
//
// In the camera frame D must equal (sin(t)ux, sin(t)uy, cos(t)) = (a,b,c),
// where t is the angle the pixel sits off the axis. With
//   f = (cosP cosY, cosP sinY, sinP)
//   r = (sinY, -cosY, 0)
//   u = (-sinP cosY, -sinP sinY, cosP)
// the z row gives  D.z = b cosP + c sinP, a single sinusoid in P; and with P
// known the x,y rows are a plane rotation that inverts straight to Y.
//
// This replaced an iterative correction that used turn() to walk the anchor
// onto the cursor. It converged when zooming in, but turn() divides by
// cos(pitch), so near the pole the walk was not a contraction and ran away by
// hundreds of pixels.
function aimAt(D, px, py, focal) {
  const ox = px - ox0(), oy = -(py - oy0());
  const Rt = Math.hypot(ox, oy);
  const t = 2 * Math.atan(Rt / (2 * focal));
  const ux = Rt ? ox / Rt : 0, uy = Rt ? oy / Rt : 0;
  const a = Math.sin(t) * ux, b = Math.sin(t) * uy, c = Math.cos(t);
  const M = Math.hypot(b, c);
  if (M < 1e-9) return false;
  // D.z = b cosP + c sinP has range +/-M, so when |D.z| > M there is NO
  // orientation that puts this direction on this pixel with north up: the
  // declination a point can have at a given screen offset is bounded. That
  // happens when zooming out within ~15 deg of the pole with the cursor well
  // off centre. Clamping gives the closest reachable aim -- about 30px of slip
  // per scroll click, in the right direction -- rather than refusing to zoom.
  // Everywhere else this is exact.
  const ratio = Math.max(-1, Math.min(1, D[2] / M));
  const phi = Math.atan2(b, c), as = Math.asin(ratio);
  const LIM = 1.5533;                           // never point at the pole itself
  let best = null, bd = Infinity, nearest = null, nd = Infinity;
  for (let P of [as - phi, Math.PI - as - phi]) {
    while (P > Math.PI) P -= 2 * Math.PI;
    while (P < -Math.PI) P += 2 * Math.PI;
    const d = Math.abs(P - pitch);
    if (d < nd) { nd = d; nearest = P; }
    if (Math.abs(P) > LIM) continue;
    if (d < bd) { bd = d; best = P; }           // the branch nearest where we are
  }
  // Safety net for the case where both branches land past the pole limit.
  if (best === null) {
    if (nearest === null) return false;
    best = Math.max(-LIM, Math.min(LIM, nearest));
  }
  const K = c * Math.cos(best) - b * Math.sin(best);
  let Y = Math.atan2(a * D[0] + K * D[1], K * D[0] - a * D[1]);
  if (Y < 0) Y += Math.PI * 2;
  pitch = best; yaw = Y;
  return true;
}

// Zoom about the pointer rather than the screen centre: the sky under the
// cursor stays under the cursor while the field changes.
// A wheel notch is a RATIO -- five percent per click, whatever the field is
// now -- so the wheel path keeps the multiplying form. A pinch is not: the
// field it asks for is a fixed function of how far apart two fingers are, and
// applying it as a ratio per event compounds, double-counts (both fingers
// report a move for one change) and drifts. So the work happens in zoomTo(),
// which takes the field it is being asked for, and zoomAbout() is that with
// the multiplication done first.
function zoomAbout(px, py, factor) { zoomTo(px, py, fovDeg * factor); }

function zoomTo(px, py, fov) {
  const before = camera();
  const D = unproject(px, py, before);
  fovDeg = Math.max(FOV_MIN, Math.min(FOV_MAX, fov));
  const after = camera();
  if (!aimAt(D, px, py, after.focal)) {
    // no orientation can place it there with north up (the anchor would need
    // the camera tipped past the pole) -- leave the view where it is
  } else if (back > 0.001 || depth > 0.001) {
    // Off the sphere the camera position itself moves with the aim, so the
    // direction is only approximate; a couple of refinements settle it.
    for (let i = 0; i < 6; i++) {
      const cam = camera();
      const p = project([cam.c[0] + D[0] * R0 * 20, cam.c[1] + D[1] * R0 * 20,
                         cam.c[2] + D[2] * R0 * 20], cam);
      if (!p) break;
      const dx = px - p.x, dy = py - p.y;
      if (Math.hypot(dx, dy) < 0.1) break;
      turn(dx, dy);
    }
  }
  syncZoom();
}

function sizeOf(s, z) {
  const v = (s.vmag === null || s.vmag === undefined) ? 6.0 : s.vmag;
  // Magnitude is a log scale and has to be drawn like one. A gentle linear
  // ramp gives Vega and a mag-4 star nearly the same dot, and then the bright
  // stars stop carrying the shape -- which is the whole way a constellation
  // is read. This spans roughly 7.5px at mag 0 down to 1px at mag 6.
  let r = 9.0 * Math.exp(-0.30 * v) - 0.5;
  if (r < 0.7) r = 0.7;
  // ...and a knee at the top, because the ramp above is drawn for magnitudes
  // 0 to 6 and two stars are brighter than that. exp() runs away fast below
  // zero: Sirius at -1.46 comes out 63% wider than Vega and three times a
  // mag-2 star, which stops reading as a bright star and starts reading as a
  // blob sitting on Canis Major. Only Sirius and Canopus are out here --
  // Arcturus at -0.05 is already under the knee -- so the whole designed
  // range is untouched and the log scaling that makes bright stars carry a
  // shape still does.
  if (r > STAR_KNEE) r = STAR_KNEE + (r - STAR_KNEE) * 0.45;
  // A star with a spectrum is drawn a little brighter than it is, with a
  // floor under it: half the observed set -- the WR stars at V~7-8, HD 188209
  // at 5.6 -- is far too faint to notice at its true size, and the point of
  // the view is to find them. The boost is deliberately small, because the
  // halo, the pulsing ring and the permanent label already mark these out;
  // scaling the disc as well made the bright ones read as blobs.
  if (s.obs) r = Math.max(r * 0.98, 2.35);
  const persp = Math.min(3, Math.max(0.35, Math.pow(R0 / z, 0.35)));
  // shrink the dots as the field opens, or a wide view turns into a solid mat
  const fovScale = Math.min(1.5, Math.max(0.55, Math.pow(60 / fovDeg, 0.35)));

  // A body is drawn as a glyph, not from a magnitude. It has no catalogue V,
  // and a computed one would swing by a factor of a hundred through the
  // phases -- Venus runs -4.9 to -3.8, the Moon -12.7 to -3 -- while this
  // size curve is built for magnitudes 0 to 6 and would answer with a blob.
  // It is big enough to carry the features that say WHICH planet, which is
  // the whole job of the dot; a magnitude-scaled Venus or Jupiter would be
  // bigger than this anyway (34 and 19 pixels), so nothing here is inflated.
  if (s.solar) {
    const glyph = (SOLAR_R[s.id] || 6.5) * fovScale * starScale();
    // The Sun and the Moon are the only two with an angular size a human
    // sees: half a degree, which is under the glyph at a normal field and
    // over it once you zoom in. So they alone grow into real discs, and
    // zooming to 8 degrees gives the Moon at its true size on the sky.
    if (s.id === 'sun' || s.id === 'moon') {
      return Math.max(glyph, 2 * focalOf() * Math.tan(0.25 * Math.PI / 180));
    }
    return glyph;
  }
  return r * persp * fovScale * starScale();
}

// ============================================================ render
let t0 = performance.now();

// The "raw mag" cut. Off -- the default -- the slider is a chart control: a
// star holding up a figure, a star you have a spectrum for, the thing you
// just searched for and a highlighted set are all drawn however faint, and
// the slider only decides how far down the scatter around them is filled in.
// On, it is an observer's limiting magnitude instead: every star with a
// measured V goes the moment it is fainter than the slider, whatever else it
// is, so what is left on the screen is what the sky would actually give you.
//
// Three things are still exempt, and none of them is a magnitude judgement. A
// body has no catalogue V at all (it is a phase and a date, swinging by a
// factor of a hundred), so there is nothing to compare and the planets stay.
// Whatever was just searched for stays drawn, because finding a star and then
// not seeing it is worse than not finding it. And the star a question is
// pointing at stays drawn, which is the same promise: a question that rings a
// star and then does not draw it is not a harder question, it is a broken
// one. That last is the QUESTION'S own marks and not the highlight at large --
// a searched-for trait lights hundreds of stars, and those are ordinary sky.
function magHidden(s) {
  if (!rawMag) return false;
  if (s.vmag === null || s.vmag === undefined) return false;
  if (s === SEARCH_HIT || QUIZ_MARKS.has(s)) return false;
  return s.vmag > skyLimit();
}

function draw() {
  if (!W) return;
  const cam = camera();
  const now = performance.now();
  // the observed-star beacon; frozen at mid-strength when pulsing is off, so
  // the ring is still there and only the motion goes
  const pulse = pulsing ? 0.5 + 0.5 * Math.sin((now - t0) / 620) : 0.5;

  // A light-polluted sky is not black -- it is a grey-brown wash, and that is
  // most of what makes it look like the sky you are actually under. The lift
  // is kept small (class 9 reaches #16171c) because the stars still have to
  // read against it, and it is the star cut, not this, that carries the mode.
  cx2.fillStyle = skyGlow(bortle);
  cx2.fillRect(0, 0, W, H);

  // --- constellation figures, behind the stars
  const at = new Map();
  for (const s of STARS) {
    const p = project(s.pos, cam);
    if (p) at.set(s, p);
  }
  // A figure is a line of sight, so it is only true from the sphere. As the
  // stars are pushed out to real distances the lines stop meaning anything and
  // are faded out; by a little over half way they are gone.
  const figFade = Math.max(0, 1 - depth / 0.55);
  // Twice: the board's own figures at full weight, then the ring around it
  // faintly. Without a second pass they would share a path and a colour.
  for (let fpass = 0; fpass < 2; fpass++) {
    const fnear = fpass === 1;
    if (fnear && !(ISOLATE && ISOLATE_NEAR && ISOLATE_NEAR.size)) break;
    if (lineMode !== 'off' && !obsOnly && figFade > 0.02) {
      // The ring of neighbours is drawn at a third of the weight: on the
      // sky beside the board it reads as sky, and next to a shape being
      // named it reads as not-the-question. One path per weight, because
      // a stroke per segment is 800 strokes a frame.
      cx2.strokeStyle = `rgba(130,175,235,${((fnear ? 0.15 : 0.42) * figFade).toFixed(3)})`;
      cx2.lineWidth = 1;
      cx2.beginPath();
      for (const f of FIGS) {
        if (!showCon(f.con) || nearCon(f.con) !== fnear) continue;
        const pa = at.get(f.a), pb = at.get(f.b);
        if (!pa || !pb) continue;
        // a line to an undrawn star is a line into empty space, and under the
        // raw cut a figure star is no longer guaranteed to be drawn
        if (magHidden(f.a) || magHidden(f.b)) continue;
        // Cull by the angle the segment subtends AT THE CAMERA, not by its
        // length on screen. Two stars a few degrees apart on the sky can be 20
        // and 800 parsecs away; the moment they are pushed out to those
        // distances they sit on opposite sides of the scene, still joined by
        // their figure line. On the sphere this rejects nothing -- no real
        // figure segment spans anywhere near FIG_MAX_DEG.
        const ax = f.a.pos[0] - cam.c[0], ay = f.a.pos[1] - cam.c[1], az = f.a.pos[2] - cam.c[2];
        const bx = f.b.pos[0] - cam.c[0], by = f.b.pos[1] - cam.c[1], bz = f.b.pos[2] - cam.c[2];
        const la = Math.hypot(ax, ay, az), lb = Math.hypot(bx, by, bz);
        if (!la || !lb) continue;
        const cosSeg = (ax * bx + ay * by + az * bz) / (la * lb);
        if (cosSeg < FIG_MAX_COS) continue;
        // Stereographic shows very nearly the whole sphere, so a segment on the
        // far side of the sky still lands somewhere on the plane. Both endpoints
        // off screen means the figure is behind you: drawing it puts a chord
        // across the view that belongs to a constellation you are not looking
        // at. (It would be wrong as well as unwanted -- this projection maps
        // great circles to arcs, and a straight line only approximates one over
        // a short span near the axis.)
        const M = 120;
        if ((pa.x < -M || pa.x > W + M || pa.y < -M || pa.y > H + M) &&
            (pb.x < -M || pb.x > W + M || pb.y < -M || pb.y > H + M)) continue;
        // Draw the segment as the arc it is, not as a chord. Stereographic maps
        // a great circle to a circle on the plane, and near the rim of a wide
        // field the two part company badly -- at the all-sky end a 10 degree
        // segment 150 degrees off axis bows far off a straight line, because
        // the radial scale 2k tan(theta/2) is stretching hard out there.
        //
        // Interpolating the two POSITIONS in 3D and projecting each step
        // follows it exactly: every point of the chord lies in the plane that
        // A, B and the origin span, so seen from the Earth it sits on their
        // great circle. Off the sphere the same interpolation walks the real
        // line between two real positions, which is what a segment means there.
        // At a normal field this costs a few thousand multiplies and changes
        // nothing visible, which is the point.
        const segDeg = Math.acos(Math.max(-1, Math.min(1, cosSeg))) * 180 / Math.PI;
        const steps = Math.min(16, Math.max(1, Math.ceil(segDeg / 3)));
        let drawing = false;
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const p = i === 0 ? pa : i === steps ? pb : project([
            f.a.pos[0] + (f.b.pos[0] - f.a.pos[0]) * t,
            f.a.pos[1] + (f.b.pos[1] - f.a.pos[1]) * t,
            f.a.pos[2] + (f.b.pos[2] - f.a.pos[2]) * t], cam);
          if (!p) { drawing = false; continue; }  // that step is behind the camera
          if (drawing) cx2.lineTo(p.x, p.y);
          else { cx2.moveTo(p.x, p.y); drawing = true; }
        }
      }
      cx2.stroke();
    }
  }

  // --- the circled regions, over the figure lines and under the stars
  if (REGIONS.length && figFade > 0.02) drawRegions(cam, figFade);

  // --- stars, faintest first so the bright ones land on top
  proj = [];
  const list = STARS.slice().sort((a, b) => (b.vmag ?? 9) - (a.vmag ?? 9));
  for (const s of list) {
    // Isolation comes first, ahead of every exemption below it. The search
    // hit and the highlighted set each promise to draw a star however faint,
    // and neither of those outranks "the question is about Orion". A planet
    // carries no constellation, so the solar system leaves with everything
    // else -- which is right: a planet is not part of any figure, and a dot
    // that wanders is a poor thing to be asked to recognise a shape by.
    if (ISOLATE && !ISOLATE_STARS.has(s)) continue;
    if (HIDE_SOLAR && s.solar) continue;
    if (rawMag) {
      if (magHidden(s)) continue;
      if (obsOnly && !s.obs) continue;
    } else if (!s.obs) {
      if (obsOnly) continue;
      const partOfShape = s.inFig && lineMode !== 'off' && showCon(s.con);
      // whatever you just searched for is drawn however faint it is, and
      // stays drawn: finding a magnitude-7 star and then not seeing it is
      // worse than not finding it. A highlighted trait is the same promise
      // over a set rather than over one star -- half the variables are below
      // the slider, and a highlight with holes in it answers nothing.
      if (!partOfShape && s !== SEARCH_HIT && !MARKED.has(s)
          && !(HOVER_SET && HOVER_SET.has(s)) && s.vmag !== null
          && s.vmag !== undefined && s.vmag > skyLimit()) continue;
    }
    const p = at.get(s);
    if (!p) continue;
    if (p.x < -60 || p.x > W + 60 || p.y < -60 || p.y > H + 60) continue;
    const r = sizeOf(s, p.z);
    // Colour is the ONLY thing the two modes differ in. Size, halo and
    // brightness are computed identically either way, so switching is a
    // straight A/B on the palette and nothing else moves.
    const col = s.solar ? solarColor(s) : colorFor(s.sp);
    // A planet's place is a line of sight and a date, true from the Earth and
    // nowhere else -- the same reason the figure lines go -- so it fades out
    // on the same schedule as the sky is pushed off the sphere.
    // A highlight has to take light away as well as add it, or 500 rings on
    // a sky of 1000 stars is not a highlight, it is more sky. Everything
    // outside the set stays drawn -- where the marked ones sit among the
    // others is most of what is being asked -- but well back.
    // While a class is under the pointer it IS the question, so it overrides a
    // pinned highlight rather than intersecting with it -- two sets ANDed
    // together are usually empty, and an empty sky answers nothing.
    const lit = HOVER_SET ? HOVER_SET.has(s) : (!MARKED.size || MARKED.has(s));
    if (s.solar) {
      if (figFade <= 0.02) continue;
      cx2.globalAlpha = figFade * (lit ? 1 : MARK_DIM);
    } else if (!lit) {
      cx2.globalAlpha = MARK_DIM;
    }

    // halo: a soft radial gradient, widened hard for the observed stars.
    // Off, every star is its bare disc -- which is the honest thing to pair
    // with the natural palette, and the reason the two go together there.
    if (showHalo && !boardOwnsHalo()) {
      // The stellar multipliers assume a dot two or three pixels across. A
      // body is ten times that, and the Moon at an 8 degree field is fifty,
      // so its glow is proportional AND capped -- otherwise a zoomed-in Moon
      // washes the screen with a 300 pixel halo.
      const halo = s.solar
        ? Math.min(r * (s.obs ? 2.8 : 2.2), r + 26)
        : r * (s.obs ? 6.5 + 1.6 * pulse : 3.0);
      const g = cx2.createRadialGradient(p.x, p.y, 0, p.x, p.y, halo);
      g.addColorStop(0, col);
      g.addColorStop(s.obs ? 0.22 : 0.30,
                     hexA(col, s.obs ? 0.55 : s.solar ? 0.42 : 0.28));
      g.addColorStop(1, hexA(col, 0));
      cx2.fillStyle = g;
      cx2.beginPath(); cx2.arc(p.x, p.y, halo, 0, 6.2832); cx2.fill();
    }

    // core. A solar-system body is painted as itself; the hollow dark fill
    // below means "no measured parallax", which is a thing to say about a
    // star and nonsense about Saturn -- it was what left it a black disc.
    if (s.solar) {
      drawSolarBody(p.x, p.y, r, s, col);
    } else {
      cx2.fillStyle = s.dist ? col : '#0d1117';
      cx2.beginPath(); cx2.arc(p.x, p.y, r, 0, 6.2832); cx2.fill();
    }
    if (!s.dist && !s.solar && depth > 0.02) {   // no parallax: hollow, on the sphere
      cx2.strokeStyle = hexA(col, 0.8); cx2.lineWidth = 1;
      cx2.beginPath(); cx2.arc(p.x, p.y, r, 0, 6.2832); cx2.stroke();
    }

    // The "there is a spectrum here" ring. It clears Saturn's rings rather
    // than crossing them -- two concentric rings on one planet is one ring
    // too many, and only one of them means anything.
    //
    // It leaves with the halo on a star board, and for a sharper reason than
    // the halo does: this one is a RING, four pixels outside the star, which
    // is the board's own vocabulary for "a name goes here" at very nearly the
    // board's own radius -- and it pulses, so it takes the eye first. An
    // observed star that is not a target was reading as the one thing on the
    // sky you are meant to click.
    if (s.obs && !boardOwnsHalo()) {
      cx2.strokeStyle = hexA('#ffffff', 0.30 + 0.42 * pulse);
      cx2.lineWidth = 1.3;
      const gap = s.id === 'saturn' ? r * 1.4 : 4;
      cx2.beginPath();
      cx2.arc(p.x, p.y, r + gap + 1.8 * pulse, 0, 6.2832); cx2.stroke();
    }
    // The highlight ring. Violet, and steady where the spectrum ring pulses:
    // the two mean different things and can land on the same star, so they
    // are told apart by colour and by movement, not by radius alone. It is
    // the violet of the panel's own variable badge.
    // A hovered class rings in ITS OWN colour, which is the colour of the
    // swatch the pointer is on -- the ring and the thing you are pointing at
    // are then plainly the same statement. It replaces the violet rather than
    // stacking with it, for the same reason the lit test above does.
    if (HOVER_SET) {
      if (HOVER_SET.has(s)) {
        cx2.strokeStyle = hexA(CLASS_COLOR[HOVER_KEY] || UNKNOWN_COLOR, 0.9);
        cx2.lineWidth = 1.2;
        cx2.beginPath();
        cx2.arc(p.x, p.y, r + (s.obs ? 8.5 : 3.6), 0, 6.2832); cx2.stroke();
      }
    } else if (MARKED.has(s)) {
      cx2.strokeStyle = hexA(MARK_COLOR, 0.85);
      cx2.lineWidth = 1.2;
      cx2.beginPath();
      cx2.arc(p.x, p.y, r + (s.obs ? 8.5 : 3.6), 0, 6.2832); cx2.stroke();
    }
    if (s === hoverStar) {
      cx2.strokeStyle = '#ffffff'; cx2.lineWidth = 1.4;
      cx2.beginPath(); cx2.arc(p.x, p.y, r + 10, 0, 6.2832); cx2.stroke();
    }
    cx2.globalAlpha = 1;
    proj.push({ s, x: p.x, y: p.y, r });
  }

  // --- constellation captions. Naming the shape is most of what makes it
  // recognisable; an unlabelled stick figure is just lines.
  if (lineMode !== 'off' && !obsOnly && showLabels) {
    cx2.font = '600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    cx2.textAlign = 'center'; cx2.textBaseline = 'middle';
    cx2.fillStyle = 'rgba(125,170,230,0.55)';
    // Worked out first, drawn second, because two names on top of each other
    // are worth less than one of them. The star names below have always
    // thinned themselves this way and the captions never did -- which is
    // fine at 40 degrees, where the figures on screen are a handful, and is
    // the wall of overlapping words a question posed at 200 turns into.
    const caps = [];
    for (const c of CON_LABELS) {
      if (!showCon(c.abbr)) continue;
      let sx = 0, sy = 0, n = 0;
      for (const st of c.stars) {
        const p = at.get(st);
        if (!p || p.x < 0 || p.x > W || p.y < 0 || p.y > H) continue;
        if (magHidden(st)) continue;   // a caption over a shape that is gone
        sx += p.x; sy += p.y; n++;
      }
      // only caption a figure that is mostly on screen, or the name drifts
      // to the edge and labels a shape you cannot see
      if (n < Math.max(2, c.stars.length * 0.5)) continue;
      caps.push({ t: CON_NAMES[c.abbr] || c.abbr, x: sx / n, y: sy / n, n });
    }
    // Most of the figure on screen wins the spot, so what survives a crowd is
