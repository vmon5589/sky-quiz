           nothing specific to expect at maximum.` },
};

// 'EA/SD' -> EA, 'DPV:/EB' -> EB, 'GCAS+X+LERI:' -> GCAS, 'E-DO/GS+SRD' -> E.
// Exact codes first, across every component of the type, and only then the
// longest prefix of at least two characters: collapsing by one character at a
// time would read VSX's 'LERI' as 'L' and call a rotating star irregular.
// Which of the types above a catalogue string ("EA/DM", "BCEP+SPB", "SRB:")
// resolves to. The code itself, not the description, because the search
// index needs something to key a class off.
function varCode(v) {
  if (!v || !v.type) return null;
  const toks = String(v.type).toUpperCase().split(/[/+|,\-]/)
                 .map(t => t.trim().replace(/:+$/, '')).filter(Boolean);
  for (const t of toks) if (VAR_TYPES[t]) return t;
  for (const t of toks)
    for (let n = t.length - 1; n >= 2; n--)
      if (VAR_TYPES[t.slice(0, n)]) return t.slice(0, n);
  return null;
}
function varInfo(v) {
  const c = varCode(v);
  return c ? VAR_TYPES[c] : null;
}

// ---- variability as something to search for ---------------------------
// A variable star is worth finding by what it does, not only by what it is
// called: "variable" on its own, the GCVS class it belongs to ("pulsating",
// "eclipsing"), the type's name ("Mira", "delta Scuti") or the bare code the
// panel prints beside it ("DSCT").
//
// A trait is not a place, so it does not become eight rows to turn to. Five
// hundred variable stars listed eight at a time is a list nobody can use; the
// question behind it is "which of these are variable", and the answer to that
// is the sky with them marked. Every trait collapses to ONE row that lights
// its stars up where they stand -- see markTrait.
//
// Every trait key carries a handicap large enough to clear the whole range a
// name match can score, so a name ALWAYS wins however weakly it matched:
// "gamma Cassiopeiae" is the star gamma Cassiopeiae, and the eighteen stars
// that behave like it are the row under it.
const VAR_PENALTY = 200;
const VAR_SUSPECT_PENALTY = 8;   // and a confirmed variable leads a suspected one

// The GCVS's own top-level classes, which are the words someone types when
// they do not have a type in mind. A type may sit in two: an eclipsing pair
// is also a binary.
const VAR_CLASSES = {
  pulsating: ['M', 'SR', 'SRA', 'SRB', 'SRC', 'SRD', 'SRS', 'L', 'LB', 'LC',
              'DCEP', 'DCEPS', 'CW', 'RR', 'RV', 'DSCT', 'BCEP', 'SPB',
              'GDOR', 'ACYG', 'ORG', 'ROAP', 'PULS'],
  eclipsing: ['E', 'EA', 'EB', 'EW', 'EP'],
  rotating:  ['ACV', 'SXARI', 'ROT', 'ELL', 'BY', 'RS', 'FKCOM', 'R'],
  eruptive:  ['GCAS', 'BE', 'SDOR', 'WR', 'YHG', 'RCB', 'UV', 'IA', 'I',
              'DPV', 'ZAND'],
  binary:    ['E', 'EA', 'EB', 'EW', 'EP', 'ELL', 'HB', 'DPV', 'ZAND',
              'RS', 'R'],
};
const VAR_CLASS_OF = new Map();
for (const [word, codes] of Object.entries(VAR_CLASSES))
  for (const c of codes) {
    if (!VAR_CLASS_OF.has(c)) VAR_CLASS_OF.set(c, []);
    VAR_CLASS_OF.get(c).push(word);
  }

// A trait key names the trait, not the star -- the star is what it collects.
// It also records where its words begin, because normKey has thrown the
// spaces away and a trait key is long enough for that to matter: "active
// galactic nucleus" contains "vega" -- actiVEGAlactic -- and the only thing
// separating that from a real hit is that it starts mid-word.
function addTrait(map, key, trait, s, pen) {
  const k = normKey(key);
  if (k.length < 2) return;
  const starts = new Set([0]);
  let at = 0;
  for (const w of String(key).split(/[^a-zA-Z0-9]+/)) {
    const n = normKey(w).length;
    if (n) starts.add(at += n);
  }
  map.push({ key: k, kind: 'trait', trait, ref: s, pen, starts });
}

function addVarKeys(map, v, s) {
  const pen = VAR_PENALTY + (v.confirmed ? 0 : VAR_SUSPECT_PENALTY);
  const trait = v.confirmed ? 'variable' : 'suspected variable';
  addTrait(map, 'variable', 'variable', s, pen);
  addTrait(map, 'variable star', 'variable', s, pen);
  if (!v.confirmed)
    addTrait(map, 'suspected variable', 'suspected variable', s, pen);
  const code = varCode(v);
  if (!code) return;
  // the code and the type's name are the same trait, so "DSCT" and
  // "delta Scuti" are one row and not two
  const info = VAR_TYPES[code];
  const name = info ? info.label : code;
  addTrait(map, code, name, s, pen);
  if (info) addTrait(map, info.label, name, s, pen);
  for (const w of VAR_CLASS_OF.get(code) || [])
    addTrait(map, w, w, s, pen);
}

// Julian date both ways. The epochs are HJD and the difference between
// heliocentric and geocentric time is at most 8 minutes, which matters to
// nothing on this page -- a Mira's maximum is uncertain by weeks.
const JD_UNIX = 2440587.5;
function jdToDate(jd) { return new Date((jd - JD_UNIX) * 86400000); }
function dateToJd(d) { return d.getTime() / 86400000 + JD_UNIX; }
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function fmtUT(d, withTime) {
  const s = `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
  if (!withTime) return s;
  const p = n => String(n).padStart(2, '0');
  return `${s}, ${p(d.getUTCHours())}:${p(d.getUTCMinutes())} UT`;
}
function fmtMag(m) {
  const s = (Math.round(m * 1000) / 1000).toString();
  return s.includes('.') ? s : s + '.0';
}
// maxima and minima, not maximums and minimums
function plural(event) { return event.replace(/um$/, 'a'); }

// The cycle the star is in NOW, and the events of this kind that fall in the
// current calendar year. `n` is how many cycles have run since the catalogued
// epoch, which is the whole story about how much to trust the date: a Mira's
// epoch can be fifty years and forty-five cycles back.
function varEphemeris(v, now) {
  if (!v || !v.period_d || v.epoch_jd === null || v.epoch_jd === undefined)
    return null;
  const P = v.period_d, E = v.epoch_jd, jd = dateToJd(now);
  const n = Math.floor((jd - E) / P);
  const year = now.getUTCFullYear();
  const y0 = dateToJd(new Date(Date.UTC(year, 0, 1)));
  const y1 = dateToJd(new Date(Date.UTC(year + 1, 0, 1)));
  const events = [];
  for (let k = Math.ceil((y0 - E) / P); E + k * P < y1 && events.length < 400; k++)
    events.push(jdToDate(E + k * P));
  return { P, cycles: n, year, events,
           start: jdToDate(E + n * P), end: jdToDate(E + (n + 1) * P),
           next: jdToDate(E + (n + 1) * P) };
}

// The one-line answer for the top of the panel, next to the spectral type.
// A star that is IN the variability catalogues and flagged constant, or not in
// them at all, is reported as such rather than left silent: "is this one
// variable" is a question with a no.
function varChip(f) {
  if (!f || !('var' in f)) return null;    // built before variability existed
  const v = f.var;
  if (!v) return `<span class="badge none">not a known variable</span>`;
  const info = varInfo(v);
  const bits = [];
  if (info) bits.push(info.label);
  if (v.amplitude !== null && v.amplitude !== undefined)
    bits.push(fmtMag(v.amplitude) + ' mag');
  const cls = v.confirmed ? 'var' : 'none';
  const word = v.confirmed ? 'variable' : 'suspected variable';
  return `<span class="badge ${cls}">${word}</span>` +
         (bits.length ? ` <span class="vartype">${esc(bits.join(', '))}</span>` : '');
}

// The rest of it, for the description: what kind, how big, how long, where in
// the cycle this year sits, and what is supposed to happen at the top of it.
function varSection(f) {
  const v = f && f.var;
  if (!v) return '';
  const info = varInfo(v);
  const eph = varEphemeris(v, new Date());
  const isMin = v.epoch_of === 'minimum';
  const event = isMin ? 'minimum' : 'maximum';
  let h = '<p class="caption" style="margin-top:14px"><b>Variability</b></p>';
  h += '<table class="facts"><tbody>';

  const typ = esc(v.type || '?');
  h += `<tr><th class="f">type</th><td>${info
        ? `${esc(info.label)} <span class="dimtype">(${typ})</span> — ${esc(info.gloss)}`
        : `<span class="dimtype">${typ}</span> — not one of the types this page
           has a description for`}</td></tr>`;
  if (!v.confirmed)
    h += `<tr><th class="f">status</th><td>suspected; not yet confirmed</td></tr>`;

  if (v.mag_max !== null && v.mag_max !== undefined) {
    const band = v.band ? ' ' + esc(v.band) : '';
    const range = (v.mag_min !== null && v.mag_min !== undefined)
      ? `${fmtMag(v.mag_max)} → ${fmtMag(v.mag_min)}${band}` : `${fmtMag(v.mag_max)}${band} at maximum`;
    const amp = (v.amplitude !== null && v.amplitude !== undefined)
      ? ` <span class="dimtype">(${fmtMag(v.amplitude)} mag swing)</span>` : '';
    h += `<tr><th class="f">brightness</th><td>${range}${amp}</td></tr>`;
  }

  if (v.period_d) {
    // The GCVS overloads one column: M-m/D is the RISE time for a pulsating
    // star and the ECLIPSE DURATION for an eclipsing one. Printing an Algol's
    // 14% as a rise would have it climbing for ten hours a night it is flat.
    let cyc = fmtPeriod(v.period_d);
    if (v.rise_pct)
      cyc += isMin
        ? `, with the eclipse itself lasting ${v.rise_pct}% of that`
        : `, rising over ${v.rise_pct}% of it and fading over the other ${
           (100 - v.rise_pct).toFixed(0)}%`;
    h += `<tr><th class="f">cycle</th><td>${esc(cyc)}</td></tr>`;
  } else {
    h += `<tr><th class="f">cycle</th><td>none catalogued — this one does not
          keep time</td></tr>`;
  }

  if (eph) {
    const short = eph.P < 30;
    h += `<tr><th class="f">this cycle</th><td>${event} ${
          fmtUT(eph.start, short)} → next ${fmtUT(eph.end, short)}</td></tr>`;
    if (short) {
      h += `<tr><th class="f">in ${eph.year}</th><td>${eph.events.length}
            ${plural(event)} — one every ${esc(fmtPeriod(eph.P))}, the next on
            ${fmtUT(eph.next, true)}</td></tr>`;
    } else if (eph.events.length) {
      h += `<tr><th class="f">in ${eph.year}</th><td>${
            eph.events.length > 1 ? plural(event) : event} on ${
            eph.events.map(d => fmtUT(d, false)).join(', ')}</td></tr>`;
    } else {
      h += `<tr><th class="f">in ${eph.year}</th><td>no ${event} falls in this
            year — the cycle running through it turned over on ${
            fmtUT(eph.start, false)}</td></tr>`;
    }
  } else if (v.period_d) {
    h += `<tr><th class="f">this cycle</th><td>unknown — the catalogues give the
          period but no epoch, so there is nothing to count cycles from and the
          phase is not pinned</td></tr>`;
  }
  h += '</tbody></table>';

  if (info) {
    h += `<p class="varbox"><b>At ${event}:</b> ${info.at_max}</p>`;
  }

  // Where the prediction comes from and how far it has been carried. A date
  // propagated forty cycles from a fifty-year-old epoch is a guess with a
  // decimal point on it, and the panel says so rather than printing it clean.
  const prov = [];
  if (v.source) prov.push(esc(v.source));
  if (eph) {
    prov.push(`dates predicted from the catalogued epoch, ${
              eph.cycles < 0 ? 'still ahead of' : eph.cycles + ' cycles on from'
              } it`);
    if (eph.cycles > 20 && eph.P > 30)
      prov.push(`a long-period red variable does not keep a schedule — real
                 maxima wander from the ephemeris by weeks, and this many cycles
                 of carrying makes that worse, so read the date as the middle of
                 a broad window`);
  }
  h += `<p class="caption">${prov.join('. ')}.</p>`;
  return h;
}

// ------------------------------------------------------- solar-system bodies
// A planet is not on the MK sequence, so the stellar table above has nothing
// true to say about one: no spectral type, no mass in suns, no luminosity.
// This is the parallel set -- the quantities that actually characterise a
// body, and what its atmosphere should put into the spectrum below. Static
// knowledge like CLASS_LINES, so it needs no fetch and can be reworded freely.
//
//  radius_km  equatorial; r_earth compares it with Earth's 6378 km.
//  period_d   sidereal orbit about the SUN, in days as asked. The Moon's is
//             about the Earth instead, and is labelled that way.
//  temp       where the light you actually see comes from -- the 1-bar level
//             on a giant (there is no surface), the ground on a rocky body,
//             and for Venus the cloud tops rather than the 737 K furnace
//             underneath them, because the cloud tops are what reflects.
const PLANET_FACTS = {
  mercury: {
    radius_km: 2440, r_earth: 0.383, period_d: 87.97,
    temp: '100 - 700 K', temp_note: 'night to day: no air to carry heat around',
    atmos: 'effectively none — a surface-bounded exosphere of Na, K, O, H and He',
  },
  venus: {
    radius_km: 6052, r_earth: 0.949, period_d: 224.70,
    temp: '~230 K', temp_note: 'cloud tops; the surface under them is 737 K at 92 bar',
    atmos: '96.5% CO₂, 3.5% N₂, under a permanent sulphuric-acid cloud deck',
  },
  mars: {
    radius_km: 3396, r_earth: 0.532, period_d: 686.98,
    temp: '~210 K', temp_note: 'mean surface; 130 - 308 K over a year',
    atmos: '95% CO₂, 2.6% N₂, 1.9% Ar — but only 6 mbar of it',
  },
  jupiter: {
    radius_km: 71492, r_earth: 11.21, period_d: 4332.59,
    temp: '165 K', temp_note: 'at the 1-bar level; there is no surface',
    atmos: '89% H₂, 10% He, with ~0.3% CH₄ and ammonia clouds',
  },
  saturn: {
    radius_km: 60268, r_earth: 9.45, period_d: 10759.22,
    temp: '134 K', temp_note: 'at the 1-bar level; there is no surface',
    atmos: '96% H₂, 3% He, with CH₄ — and rings that reflect plain sunlight',
  },
  uranus: {
    radius_km: 25559, r_earth: 4.01, period_d: 30688.5,
    temp: '76 K', temp_note: 'at the 1-bar level; the coldest atmosphere in the system',
    atmos: '83% H₂, 15% He, 2.3% CH₄ — and that methane is what you see',
  },
  neptune: {
    radius_km: 24764, r_earth: 3.88, period_d: 60182,
    temp: '72 K', temp_note: 'at the 1-bar level; there is no surface',
    atmos: '80% H₂, 19% He, 1.5% CH₄',
  },
  moon: {
    radius_km: 1738, r_earth: 0.272, period_d: 27.32, period_about: 'the Earth',
    temp: '100 - 390 K', temp_note: 'night to day; no atmosphere to even it out',
    atmos: 'none',
  },
  sun: {
    radius_km: 696000, r_earth: 109.2, period_d: null,
    temp: '5,772 K', temp_note: 'photosphere — this one IS a star (G2V)',
    atmos: 'n/a — a stellar photosphere, not an atmosphere over a surface',
  },
};

// The band depths quoted here are the ones this pipeline measures on its own
// templates (band mean against the mean of two shoulders 260 A out), so the
// numbers on the page and the numbers in a run are the same numbers.
const PLANET_LINES = {
  mercury: `a plain reflected solar spectrum — the Sun's own Fraunhofer lines and
    nothing of Mercury's. There is no atmosphere here to absorb anything.`,
  venus: `reflected sunlight off a sulphuric-acid cloud deck: bright, smooth and
    almost featureless. The CO₂ that is 96% of the air is nearly invisible in
    this range — its visible bands are weak overtones near 7820 and 8690 Å, and
    the strong ones sit at 1.05, 1.4 and 2.0 µm, far past this sensor.`,
  mars: `reflected sunlight on a steep red slope from ferric-oxide dust. That
    slope IS the identification — it is a mineral continuum, not a band. Six
    millibars of CO₂ leaves nothing an SA100 can reach, so expect no gas
    feature at all.`,
  jupiter: `reflected sunlight cut by <em>shallow</em> methane — about 10% deep at
    CH₄ 6190 Å and 39% at 7250 Å — plus a weak ammonia band near 6450 Å, which
    only Jupiter and Saturn have. A deep 6190 band would mean this is not Jupiter.`,
  saturn: `reflected sunlight with shallow methane, close to Jupiter's: ~10% at
    CH₄ 6190 Å and ~42% at 7250 Å. The rings add plain reflected sunlight to the
    disc's light and dilute the bands further.`,
  uranus: `reflected sunlight cut by <em>deep</em> methane: about 50% at CH₄ 6190 Å
    and 77% at 7250 Å, with 5430 Å and 7900 Å also present. That depth is the
    whole identification — Saturn and Jupiter reach only ~10% at 6190 Å, so the
    6190 band alone separates the far giants from the near ones.`,
  neptune: `deep methane like Uranus and a little deeper still — about 52% at
    CH₄ 6190 Å. Band depth barely separates the two; brightness does, since
    Neptune is some 2.3 magnitudes fainter.`,
  moon: `a plain reflected solar spectrum, slightly reddened by the regolith.
    No atmosphere means no absorption of its own.`,
  sun: `the Fraunhofer spectrum itself — Ca II H+K, the G band, Mg b, Na D —
    since this is a G2V star, and the source that every reflected spectrum on
    this page is a copy of.`,
};

// Which body a panel is about, or null. Checked against several fields because
// a body arrives three ways: as an ephemeris marker (id 'uranus'), as a strip
// entry the ephemeris could not place (label), and as an observation whose
// pipeline run recorded a planet template (o.planet).
function planetKey(s, o) {
  for (const c of [s && s.id, s && s.label, o && o.planet, o && o.name]) {
    const k = String(c || '').trim().toLowerCase();
    if (PLANET_FACTS[k]) return k;
  }
  return null;
}

function fmtDays(d) {
  if (d === null || d === undefined) return null;
  const days = d.toLocaleString(undefined, { maximumFractionDigits: 2 });
  if (d < 900) return `${days} days`;
  // asked for days, but 30,689 of them means nothing without the years beside it
  return `${days} days (${(d / 365.25).toFixed(1)} years)`;
}

function planetDescribe(key) {
  const f = PLANET_FACTS[key];
  if (!f) return '';
  let h = '<table class="facts"><tbody>';
  h += `<tr><th class="f">size</th><td class="num">${
        f.radius_km.toLocaleString()} km radius <span class="sub"
        style="font-size:.9em">(${f.r_earth} × Earth)</span></td></tr>`;
  const per = fmtDays(f.period_d);
  if (per) h += `<tr><th class="f">orbit</th><td class="num">${esc(per)}${
        f.period_about ? ' around ' + esc(f.period_about) : ''}</td></tr>`;
  h += `<tr><th class="f">temperature</th><td class="num">${esc(f.temp)}</td></tr>`;
  if (f.temp_note) h += `<tr><th class="f"></th><td class="sub">${esc(f.temp_note)}</td></tr>`;
  h += `<tr><th class="f">atmosphere</th><td>${esc(f.atmos)}</td></tr>`;
  h += '</tbody></table>';
  return h;
}

function planetLinesSentence(key) {
  const t = PLANET_LINES[key];
  if (!t) return null;
  const name = key[0].toUpperCase() + key.slice(1);
  // "the Moon" takes its article, and the Sun cannot be introduced as "not a
  // star" when it is the only one on this list that IS one.
  const lead = key === 'sun'  ? 'Being the Sun'
             : key === 'moon' ? 'Being the Moon and not a star'
             : `Being ${name} and not a star`;
  return `${lead}, expect ${t}`;
}

function factsTable(f) {
  let cols = (f.components && f.components.length) ? f.components : [{
    label: null, sp: f.sp, teff_k: f.teff_k, mass_msun: f.mass_msun,
    vmag: f.vmag, rv_kms: f.rv_kms,
    teff_estimated: !f.teff_n, mass_estimated:
      !(f.mass_source || '').startsWith('measured'),
  }];
  if (cols.length > 4) cols = cols.slice(0, 4);   // the panel is 420px wide

  const multi = cols.length > 1;
  let h = '<table class="facts">';
  if (multi) {
    h += '<thead><tr><th class="f"></th>' +
         cols.map(c => `<th>${esc(c.label || '—')}</th>`).join('') +
         '</tr></thead>';
  }
  h += '<tbody>';
  for (const [key, label, fmt] of FACT_ROWS) {
    if (!cols.some(c => c[key] !== null && c[key] !== undefined)) continue;
    h += `<tr><th class="f">${label}</th>` + cols.map(c => {
      const v = c[key];
      if (v === null || v === undefined) return '<td>—</td>';
      const est = c[key.split('_')[0] + '_estimated'];
      return `<td class="num${est ? ' est' : ''}">${fmt(v)}</td>`;
    }).join('') + '</tr>';
  }
  h += '</tbody></table>';
  return h;
}

function describe(f, s) {
  if (!f) return '';
  let h = '<table class="facts"><tbody>';
  const con = f.con || (s && s.cat && s.cat.con);
  if (con) h += `<tr><th class="f">constellation</th><td>${esc(con)}</td></tr>`;
  const per = fmtPeriod(f.period_d);
  if (per) h += `<tr><th class="f">orbital period</th><td>${esc(per)}</td></tr>`;
  h += '</tbody></table>';
  h += factsTable(f);
  h += varSection(f);
  if (f.names && f.names.length) {
    h += `<p class="caption"><b>also known as</b> ${esc(f.names.join(', '))}</p>`;
  }
  return h;
}

function openPanel(s) {
  // Same reason as showTip: the panel is every one of those answers at
  // length, with the spectral type at the top of it.
  if (quizHolds()) return;
  const o = s.obs || null;   // `solarObs` went with the solar-system strip
  const name = s.label || prettyId(s.id);
  const letter = typeLetter(s.sp);
  const swatch = s.solar ? solarColor(s) : classColorFor(s.sp);
  // Looked up before the sub line rather than after it: whether the star is a
  // variable is part of what kind of star it is, and belongs on the same row
  // as the spectral type.
  const facts = FACTS[s.id] || (s.cat && FACTS[s.cat.id]) || null;
  // A body gets the planet description instead of the stellar one, and never
  // both: FACTS is keyed by catalogue id and holds nothing for a planet anyway.
  // It must not draw "not a known variable" out of that absence either.
  const pkey = planetKey(s, o);
  let h = `<h2>${esc(name)}</h2>`;
  const sub = [];
  if (s.sp) sub.push(`<span style="color:${swatch}">■</span> ${esc(s.sp)}`);
  if (s.solar && s.ra !== null && s.ra !== undefined) {
    sub.push(`<span style="color:${swatch}">■</span> ${fmtRaDec(s.ra, s.dec)}
              at midnight, ${esc(seasonLabel(currentDay()))}`);
    if (s.au) sub.push(fmtAu(s.au));
  }
  if (s.vmag !== null && s.vmag !== undefined) sub.push('mag ' + s.vmag.toFixed(2));
  if (s.dist) sub.push(fmtDist(s.dist));
  if (!pkey) {
    const chip = varChip(facts);
    if (chip) sub.push(chip);
  }
  h += `<p class="sub">${sub.join(' &middot; ')}</p>`;


  if (!o) {
    h += pkey ? planetDescribe(pkey) : describe(facts, s);
    const ls = pkey ? planetLinesSentence(pkey) : linesSentence(s.sp);
    if (ls) h += `<p class="lines">${ls} No spectrum from this installation
          yet, so there is nothing here to check it against.</p>`;
    else h += `<p class="sub">No spectrum from this installation yet. Capture it
          with the pipeline and it will appear here automatically.</p>`;
    if (s.cat && s.cat.id) h += `<p class="sub">catalogue id ${esc(s.cat.id)}</p>`;
    pbody.innerHTML = h; panel.classList.add('open'); return;
  }

  // The description comes BEFORE the plot, and the expected lines sit directly
  // above it, because the sentence is there to be read against the curve.
  h += pkey ? planetDescribe(pkey) : describe(facts, s);

  if (o.contested_with && o.contested_with.length) {
    h += `<div class="note"><b>Ambiguous capture.</b> The same recording is also
      filed under ${esc(o.contested_with.join(', '))}. One of them is a re-run
      with a different name typed in, and nothing on disk says which — pin the
      right run in <code>sky_targets.json</code>.</div>`;
  }
  if (o.spectrum && o.spectrum.derived) {
    h += `<div class="note">Curve rebuilt from <code>spectrum_calibrated.dat</code>:
      this run predates the pipeline writing <code>normalized.json</code>, so the
      continuum here is a plain median, not the pipeline's own fit.</div>`;
  }

  // Not linesSentence() for a body: typeLetter('Uranus') falls through to its
  // bare-letter search and returns the A of "urAnus", which had the panel
  // promising a deep Balmer series on a methane spectrum.
  const ls = pkey ? planetLinesSentence(pkey) : linesSentence(o.sptype || s.sp);
  if (ls) h += `<p class="lines">${ls}</p>`;
  h += `<canvas id="spec" width="760" height="300"></canvas>`;
  h += `<p class="caption">normalised flux, ${o.spectrum ?
        o.spectrum.wave.length + ' points' : 'unavailable'}</p>`;

  const chk = o.check === 'ok' ? 'ok' : (o.check === 'warn' ? 'warn' : 'none');
  h += `<p class="caption" style="margin-top:14px"><b>This run</b> — measured
        here, not catalogue values</p>`;
  h += '<dl>';
  h += row(pkey ? 'template used' : 'stated type', esc(o.sptype || '—'));
  // The chi2 winner, the index estimate and the MK verdict are all answers to
  // "which point on the MK sequence is this", and a planet is not on it. The
  // pipeline still computes them (they are its diagnostic) but reporting them
  // here only invites reading Uranus as a K2I.
  if (!pkey) {
    h += row('measured (chi2)', `${esc(o.measured || '—')} <span class="badge ${chk}">${
             esc(o.check || 'unchecked')}</span>`);
    if (o.indices) h += row('by indices', esc(o.indices));
    if (o.mk) h += row('MK verdict', esc(o.mk));
  }
  if (o.snr !== null) h += row('S/N', o.snr);
  if (o.rms !== null && o.rms !== undefined) h += row('wavecal rms', o.rms + ' Å');
  if (o.rv !== null && o.rv !== undefined)
    h += row('radial velocity', `${o.rv} ± ${o.rv_err ?? '?'} km/s`);
  if (o.date_obs) h += row('observed', esc(o.date_obs.replace('T', ' ').slice(0, 19)));
  if (o.source) h += row('capture', esc(o.source));
  if (o.n_runs > 1) h += row('runs on disk', o.n_runs + (o.pinned ? ' (pinned)' : ''));
  h += '</dl>';

  if (o.detail) h += `<p class="caption">${esc(o.detail)}</p>`;
  if (o.figure) {
    h += `<img src="/results/${encodeURIComponent(o.job_id)}/${o.figure}" alt="spectrum figure">`;
  }
  // Only where there is a run on disk to open. A frozen spectra.json carries
  // the curves and nothing else -- no job, no folder -- so job_id is null and
  // this was rendering `/results/null/results.json`, a dead link under every
  // observed star. Which is also the shape this takes on a static host, where
  // there is no pipeline behind it at all.
  if (o.job_id) {
    h += `<a class="link" href="/results/${encodeURIComponent(o.job_id)}/results.json"
           target="_blank">open this run's results.json &rarr;</a>`;
  }
  pbody.innerHTML = h;
  panel.classList.add('open');
  if (o.spectrum) plotSpectrum(document.getElementById('spec'), o.spectrum, swatch);
}
function row(k, v) { return `<dt>${k}</dt><dd>${v}</dd>`; }

// A small line plot of the normalised spectrum, drawn the same way the panel
// draws everything else: no library, just the canvas.
function plotSpectrum(c, spec, color, marks) {
  const g = c.getContext('2d');
  const w = c.width, hh = c.height, pad = { l: 34, r: 10, t: 12, b: 26 };
  // A run with no normalized.json and no readable .dat returns null from
  // sky_data.spectrum, so `spec` itself can be absent -- reading .wave off it
  // threw and took the whole panel down with it.
  const wave = (spec && spec.wave) || [], norm = (spec && spec.norm) || [];
  g.fillStyle = '#0d1117'; g.fillRect(0, 0, w, hh);
  if (wave.length < 2) return;
  const w0 = Math.min(...wave), w1 = Math.max(...wave);
  // A gap in the flux is a null, and Math.min(null, x) is Math.min(0, x) --
  // one null therefore pinned the floor at zero and squashed the whole curve
  // into the top of the box.
  const real = norm.filter(v => v !== null && v !== undefined && isFinite(v));
  if (real.length < 2) return;
  let y0 = Math.min(...real), y1 = Math.max(...real);
  const padY = (y1 - y0) * 0.12 || 0.1; y0 -= padY; y1 += padY;
  const X = v => pad.l + (v - w0) / (w1 - w0) * (w - pad.l - pad.r);
  const Y = v => hh - pad.b - (v - y0) / (y1 - y0) * (hh - pad.t - pad.b);

  g.strokeStyle = '#30363d'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(pad.l, pad.t); g.lineTo(pad.l, hh - pad.b);
  g.lineTo(w - pad.r, hh - pad.b); g.stroke();
  g.fillStyle = '#8b949e'; g.font = '16px sans-serif'; g.textAlign = 'center';
  for (let a = 4000; a <= 8000; a += 1000) {
    if (a < w0 || a > w1) continue;
    g.strokeStyle = 'rgba(48,54,61,.8)';
    g.beginPath(); g.moveTo(X(a), pad.t); g.lineTo(X(a), hh - pad.b); g.stroke();
    g.fillText(a, X(a), hh - 7);
  }
  // The lines that identify the class, drawn where they actually fall. This
  // is the whole point of showing a real spectrum next to "which lines would
  // you expect": the answer is a sentence, and then here they are.
  if (marks && marks.length) {
    g.setLineDash([4, 3]); g.lineWidth = 1;
    g.font = '15px sans-serif'; g.textAlign = 'center';
    for (const m of marks) {
      if (m.at < w0 || m.at > w1) continue;      // outside this frame's range
      g.strokeStyle = 'rgba(240,180,41,.55)';
      g.beginPath(); g.moveTo(X(m.at), pad.t + 12); g.lineTo(X(m.at), hh - pad.b); g.stroke();
      g.fillStyle = 'rgba(240,180,41,.95)';
      g.fillText(m.label, X(m.at), pad.t + 8);
    }
    g.setLineDash([]);
  }

  g.strokeStyle = color; g.lineWidth = 2; g.beginPath();
  let drawing = false;
  wave.forEach((v, i) => {
    const f = norm[i];
    if (f === null || f === undefined || !isFinite(f)) { drawing = false; return; }
    const x = X(v), y = Y(f);
    if (drawing) g.lineTo(x, y); else { g.moveTo(x, y); drawing = true; }
  });
  g.stroke();
}

// The sky view's solar-system strip -- a floating panel in the bottom corner
// offering the spectra the sky itself cannot point at, the Sun above all --

// planets themselves stay: they are placed from the ephemeris, they are dots

    <p>It needs the internet (SIMBAD for the stars, Stellarium's own

// ============================================================ controls
function setSlider(id, v) { document.getElementById(id).value = v; }
function bind(id, valId, fn, fmt) {
  const el = document.getElementById(id), out = document.getElementById(valId);
  const apply = () => { fn(parseFloat(el.value)); out.textContent = fmt(parseFloat(el.value)); };
  el.addEventListener('input', apply); apply();
}
bind('depth', 'depthv', v => { depth = v; updatePositions(); },
     v => v < 0.005 ? 'off' : (v > 0.995 ? 'true' : v.toFixed(2)));
// The field slider is logarithmic: equal travel is equal zoom factor, the
// same as a scroll click. It has to be -- the range now runs 8 to 340
// degrees, and a linear track would spend most of itself out at the wide end,
// where a degree means nothing, while the narrow end got a degree a pixel.
//
// It also has to stay EVENLY logarithmic. Biasing the curve towards the narrow
// end was tried and measured worse: it buys the 10 degree end its finer grip by
// making 70 degrees -- where the view actually sits -- move 0.53% per slider
// unit instead of 0.375%, and 300 degrees 0.66%. A power curve trades
// sensitivity between the ends, it does not remove any. The only two things
// that genuinely lower the rate are a shorter range, which would cost the
// all-sky framing, and a longer track. So the track got longer: the field row
// spans the full panel and the panel is wider, taking 176px of travel to 312
// and the rate from 2.2% of field per pixel to 1.2%.
function sliderToFov(v) { return FOV_MIN * Math.pow(FOV_MAX / FOV_MIN, v / 1000); }
function fovToSlider(f) {
  return 1000 * Math.log(f / FOV_MIN) / Math.log(FOV_MAX / FOV_MIN);
}
function fmtFov(f) {
  return f.toFixed(f < 20 ? 1 : 0) + '°' + (f > 320 ? ' whole sky' : '');
}
function syncZoom() {
  setSlider('zoom', fovToSlider(fovDeg));
  document.getElementById('zoomv').textContent = fmtFov(fovDeg);
}
bind('zoom', 'zoomv', v => { fovDeg = sliderToFov(v); }, v => fmtFov(sliderToFov(v)));
fovDeg = FOV_OPEN; syncZoom();      // open on the field the page is written for
bind('back', 'backv', v => { back = v; }, v => v < 0.005 ? '0' : Math.round(v * 900) + ' u');
bind('mag', 'magv', v => { magLimit = v; paintLimit(); }, v => v.toFixed(1));

// ---- how bad your sky is ---------------------------------------------
// The Bortle class IS a limiting magnitude, so the slider needs no model: it
// hands one number to skyLimit(), which takes whichever of the two sliders
// bites first. The readout says both the class and the magnitude it means,
// because "Bortle 5" answers nothing on its own.
bind('bortle', 'bortlev', v => { bortle = Math.round(v); paintLimit(); },
     v => 'B' + SKIES[Math.round(v)].cls + ' \u2192 ' + SKIES[Math.round(v)].nelm.toFixed(1));

// Exactly one of the two readings is doing the work at any moment, and it is
// the one still in black: whichever of the sliders is not binding greys out,
// the same way the date greys once the sky is dragged off it. Without that,
// dropping to a Bortle 2 sky at a magnitude 5 cut looks like a dead slider,
// when what it really means is that your sky is darker than you are asking to
// look -- which is a thing worth being told rather than left to infer.
function paintLimit() {
  const nelm = sky().nelm;
  const skyBinds = nelm < magLimit - 1e-9;
  const magv = document.getElementById('magv');
  const bv = document.getElementById('bortlev');
  if (magv) {
    magv.classList.toggle('stale', skyBinds);
    magv.title = skyBinds ? 'your sky cuts in first, at ' + nelm.toFixed(1) : '';
  }
  if (bv) {
    bv.classList.toggle('stale', !skyBinds);
    bv.title = sky().name + (skyBinds ? ''
      : ' \u2014 darker than the ' + magLimit.toFixed(1) + ' you are asking for');
  }
}
paintLimit();

// ---- how many figures ------------------------------------------------
// The cut runs down the prominence ranking, so the first figures to go are
// the ones that are hardest to find in the first place, and the sky empties
// the way light pollution empties it. Dropping a figure also drops the faint
// stars that were only drawn because they held it up, so the shape leaves
// with its lines.
function fmtFigs(v) {
  const n = CON_ORDER.length || 88;
  if (v >= n) return 'all';
  if (v <= 0) return 'none';
  return v + '/' + n;
}
bind('figs', 'figsv', v => {
  conCut = v;
  const out = document.getElementById('figsv');
  const faint = CON_ORDER[Math.round(v) - 1];
  out.title = v <= 0 ? 'no figures'
    : (faint ? 'faintest figure drawn: ' + (CON_NAMES[faint] || faint) : '');
}, fmtFigs);

function syncFigsSlider() {
  const el = document.getElementById('figs');
  el.max = CON_ORDER.length || 88;
  el.value = conCut;
  document.getElementById('figsv').textContent = fmtFigs(conCut);
}

// ---- the sky for a date ----------------------------------------------
// What stands overhead at local midnight is the anti-solar point: right
// ascension = the Sun's + 12h, declination = the observer's latitude. So the
// whole slider is one yaw, plus a pitch when the captures say where they were
// made -- no animation and no clock. Local midnight is defined by the Sun, so
// no timezone enters either.
//
// The Sun's place comes from the standard low-precision series (good to about
// a minute of arc, which is nothing at a 70 degree field): mean longitude and
// mean anomaly linear in days from J2000, two terms of the equation of
// centre, then a rotation into the equator by the obliquity.
function sunRA(date) {
  const rad = Math.PI / 180;
  const n = date.getTime() / 86400000 - 10957.5;      // days from J2000.0
  const L = (280.460 + 0.9856474 * n) * rad;
  const g = (357.528 + 0.9856003 * n) * rad;
  const lam = L + (1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * rad;
  const eps = (23.439 - 4e-7 * n) * rad;
  let ra = Math.atan2(Math.cos(eps) * Math.sin(lam), Math.cos(lam));
  if (ra < 0) ra += Math.PI * 2;
  return ra;
}

// The year the date slider runs over, and the year the planets are standing
// in. Under Flask these are the same number -- the payload is assembled today
// and the ephemeris is computed for today's year. On a baked static build they
// are not: the tracks are the year the file was written, and a slider that
// labelled them with the year the BROWSER happens to be in would make that
// drift silent, which is the one thing a date is not allowed to be. So build()
// takes this from the payload, and seasonLabel() shows the year whenever it is
// not the year outside the window.
let SEASON_YEAR = new Date().getFullYear();
const THIS_YEAR = new Date().getFullYear();
const seasonEl = document.getElementById('season');
const seasonOut = document.getElementById('seasonv');

function currentDay() { return parseFloat(seasonEl.value) || 0; }
function seasonDate(day) { return new Date(SEASON_YEAR, 0, 1 + day); }
function seasonLabel(day) {
  return seasonDate(day).toLocaleDateString(undefined,
    SEASON_YEAR === THIS_YEAR
      ? { month: 'short', day: 'numeric' }
      : { year: 'numeric', month: 'short', day: 'numeric' });
}
function goToDate(day) {
  placeSolar(day);                    // the planets move with the date too
  const ra = sunRA(seasonDate(day)) + Math.PI;        // anti-solar: midnight
  yaw = ra % (Math.PI * 2);
  if (SITE_LAT !== null)
    pitch = Math.max(-1.5533, Math.min(1.5533, SITE_LAT * Math.PI / 180));
  vx = vy = 0;                        // a date cancels any leftover glide
  seasonOut.textContent = seasonLabel(day);
  seasonOut.classList.remove('stale');
  seasonOut.title = SITE_LAT === null
    ? 'overhead at midnight on this date (declination left where you had it — '
      + 'no site latitude in these captures)'
    : `overhead at midnight on this date, from ${SITE_LAT.toFixed(2)}\u00b0 latitude`;
}
seasonEl.addEventListener('input', () => goToDate(parseFloat(seasonEl.value)));

// The date, without the camera.
//
// goToDate() is the SLIDER's handler and turns the sky to that date's midnight
// meridian, which is exactly right when a hand drags it and exactly wrong for
// a question: a `planet` question does its own framing, and a turn underneath
// it would take the circles it just drew off the screen.
//
// QUIZ_DAY is where the person had the slider before a question borrowed it.
// Null means nobody has borrowed it.
let QUIZ_DAY = null;
function setDay(day) {
  seasonEl.value = day;
  placeSolar(day);
  seasonOut.textContent = seasonLabel(day);
  seasonOut.classList.remove('stale');
}

// Opens on today's date but does NOT move the view: the page's own opening
// aim is the planetarium one, and a slider that fires on load would take it
// over. The readout is greyed until the slider is actually used, and greys
// again the moment the sky is dragged away from the date it set.
// Named rather than an IIFE, because build() calls it again: the payload is
// what says which year the slider is running over, and it arrives after this.
function initSeason() {
  // Today's date in the slider's year -- which on a baked build is not this
  // year, and then this is the same day of the year rather than today.
  const today = Math.round(
    (Date.now() - new Date(THIS_YEAR, 0, 1).getTime()) / 86400000);
  seasonEl.value = Math.max(0, Math.min(365, today));
  seasonOut.textContent = seasonLabel(currentDay());
  seasonOut.classList.add('stale');
}
initSeason();

// Take the slider's year from the payload. Its own function, and returning
// whether it moved, because this is the whole of the static build's honesty
// about its planets and it has to be checkable without rebuilding the page.
function adoptEphemerisYear(d) {
  const y = d && d.ephemeris && d.ephemeris.year;
  if (!y || y === SEASON_YEAR) return false;
  SEASON_YEAR = y;
  initSeason();                 // relabel, now that the label carries a year
  return true;
}

function toggle(id, get, set, after) {
  const b = document.getElementById(id);
  const paint = () => b.classList.toggle('on', get());
  b.onclick = () => { set(!get()); paint(); if (after) after(); };
  paint();
}
const bClass = document.getElementById('tClass');
const bNat = document.getElementById('tNat');
function paintColor() {
  bClass.classList.toggle('on', colorMode === 'class');
  bNat.classList.toggle('on', colorMode === 'natural');
  document.getElementById('ramp').style.opacity = colorMode === 'class' ? '1' : '.3';
}
// The two colour buttons carry the glow with them. Natural is the "what the
// eye actually gets" preset, and a haloed, pulsing star is not what the eye
// gets -- so natural drops both and class brings both back, and the pair
// stays one look against another rather than half of each. Either button can
// still be clicked on its own afterwards.
function setGlow(on) {
  showHalo = pulsing = on;
  document.getElementById('tHalo').classList.toggle('on', on);
  document.getElementById('tPulse').classList.toggle('on', on);
}
bClass.onclick = () => { colorMode = 'class'; setGlow(true); paintColor(); };
bNat.onclick = () => { colorMode = 'natural'; setGlow(false); paintColor(); };
paintColor();

toggle('tLabels', () => showLabels, v => showLabels = v);
toggle('tHalo', () => showHalo, v => showHalo = v);
toggle('tPulse', () => pulsing, v => pulsing = v);
toggle('tObs', () => obsOnly, v => obsOnly = v);
toggle('tRawMag', () => rawMag, v => rawMag = v);
toggle('tLog', () => logDepth, v => logDepth = v, updatePositions);

const HINTS = {

// ---- fold the panel away -----------------------------------------------

// be handed to someone who has never seen it.
const rail = document.getElementById('rail');
const ctlEl = document.getElementById('ctl');
const ctlMin = document.getElementById('ctlmin');
function paintFold() {

}
function toggleFold() { ctlEl.classList.toggle('folded'); paintFold(); }
ctlMin.onclick = toggleFold;
paintFold();

// lines cycle main -> all -> off, because "every figure at once" and "none"
// are both wrong most of the time
const LINE_MODES = ['all', 'main', 'off'];
const bLines = document.getElementById('tLines');
function paintLines() {

  bLines.classList.toggle('on', lineMode !== 'off');

    ? 'only the constellations holding a star you have observed'

// the explode slider is the one control that needs explaining, and the one
// that takes you off the sphere -- so it also reveals the camera control
const EARTH_NOTE = 'Drag to turn the sky, scroll to zoom.';
document.getElementById('depth').addEventListener('input', () => {
  document.getElementById('depthnote').textContent = depth < 0.005
    ? EARTH_NOTE
    : (depth > 0.995
       ? 'True distances, from outside. The figures are gone — they only ever existed from Earth.'
       : 'Pushing each star out toward its real distance, and lifting you off the sphere to see it happen.');
});

const deep = document.getElementById('deep'), b3d = document.getElementById('b3d');
b3d.onclick = () => {
  const on = deep.style.display === 'none';
  deep.style.display = on ? 'block' : 'none';
  b3d.textContent = on ? 'back to the Earth view «' : 'show real distances »';
  b3d.classList.toggle('on', on);
  if (!on) resetEarth();
};

// Returns the camera to the origin. While depth is 0 and back is 0 the camera
// sits exactly at the Earth, so the sphere can only ever be turned, never
// looked at from the side.
function resetEarth() {
  depth = 0; back = 0; fovDeg = FOV_OPEN; logDepth = false;
  setSlider('depth', 0); setSlider('back', 0); syncZoom();
  document.getElementById('depthv').textContent = 'off';
  document.getElementById('backv').textContent = '0';
  document.getElementById('tLog').classList.remove('on');
  document.getElementById('depthnote').textContent = EARTH_NOTE;
  updatePositions();
}
document.getElementById('bReset').onclick = () => {
  resetEarth();
  deep.style.display = 'none';
  b3d.textContent = 'show real distances »';
  b3d.classList.remove('on');
};

// ---- the search box ---------------------------------------------------
// Type, pick, and the sky goes there -- unless it is already in front of you,
// in which case moving the view would be the wrong answer: you would lose
// your place to be shown something you were already looking at. So an
// on-screen target is only pinged, and an off-screen one is turned to and
// then pinged, which is the same ending either way.
const qEl = document.getElementById('q');
const qList = document.getElementById('qlist');
let qHits = [], qSel = 0;

function paintHits() {
  if (!qHits.length) {
    qList.style.display = qEl.value.trim() ? 'block' : 'none';
    qList.innerHTML = qEl.value.trim()
      ? '<div class="miss">nothing by that name</div>' : '';
    return;
  }
  qList.style.display = 'block';
  qList.innerHTML = qHits.map((h, i) => {
    const s = h.ref;          // a group has none: it is a set, not a place
    const note = h.kind === 'group' ? 'highlight ' + h.stars.size
      : h.kind === 'con' ? 'constellation'
      : h.kind === 'body' ? 'solar system'
      : (s.vmag === null || s.vmag === undefined ? '' : 'mag ' + s.vmag.toFixed(1))
        + (s.obs ? ' · spectrum' : '');
    return `<div class="${i === qSel ? 'sel' : ''}${h.kind === 'group' ? ' grp' : ''}"` +
           ` data-i="${i}">` +
           `<span>${esc(h.label)}</span><span class="k">${esc(note)}</span></div>`;
  }).join('');
  qList.querySelectorAll('div[data-i]').forEach(d => {
    d.onmousedown = ev => { ev.preventDefault(); choose(+d.dataset.i); };
  });
}

function choose(i) {
  const h = qHits[i];
  if (!h) return;
  qList.style.display = 'none';
  qEl.blur();
  goToHit(h);
}

// A trait does not have a direction to turn to. Choosing one lights every
// star behind it where it already stands, and leaves the view alone: the
// answer to "which of these are variable" is this sky, marked -- moving it
// would only cost you the place you were reading.
function markTrait(h) {
  MARKED = new Set(h.stars);
  QUIZ_MARKS = new Set();       // a trait is sky, not the thing being asked
  MARK_LABEL = h.trait;
  renderMark();
  // A highlight nobody can see is not an answer. With 500 stars lit there is
  // always one in front of you and the view holds still, which is the whole
  // point; with six Wolf-Rayets there may be none, and then the rule for a
  // single star applies again -- turn to the brightest of them and ping it.
  const cam = camera();
  const M = 70;
  let best = null;
  for (const s of MARKED) {
    const p = project(s.pos, cam);
    if (p && p.x > M && p.x < W - M && p.y > M && p.y < H - M) return;
    if (!best || (s.vmag ?? 99) < (best.vmag ?? 99)) best = s;
  }
  if (!best) return;
  tweenTo(best.dir);
  FLASH = { ref: best, kind: 'star', label: best.label, pos: best.pos,
            t0: performance.now() + 520 };
}

function clearMark() {
  MARKED = new Set();
  QUIZ_MARKS = new Set();
  MARK_LABEL = '';
  renderMark();
}

function renderMark() {
  paintPins();                  // the legend outlines the class it is standing for
  const el = document.getElementById('mark');
  if (!MARKED.size) { el.style.display = 'none'; el.innerHTML = ''; return; }
  el.style.display = 'flex';
  el.innerHTML = `<span>${esc(MARK_LABEL)} · ${MARKED.size} highlighted</span>`
               + `<span class="x">clear</span>`;
  el.querySelector('.x').onclick = clearMark;
}

function goToHit(h) {
  if (h.kind === 'group') { markTrait(h); return; }
  const cam = camera();
  let pos, dir;
  if (h.kind === 'con') {
    dir = h.pos;
    pos = [dir[0] * R0, dir[1] * R0, dir[2] * R0];
    SEARCH_HIT = null;
    // a figure hidden by the prominence cut is put back, or the search would
    // turn to a name with nothing under it
    if (CON_RANK.has(h.ref.abbr) && CON_RANK.get(h.ref.abbr) >= conCut) {
      conCut = CON_RANK.get(h.ref.abbr) + 1;
      syncFigsSlider();
    }
  } else {
    SEARCH_HIT = h.ref;
    pos = h.ref.pos; dir = h.ref.dir;
  }
  const p = project(pos, cam);
  const M = 70;                       // "in the frame" means comfortably so
  const inFrame = p && p.x > M && p.x < W - M && p.y > M && p.y < H - M;
  if (!inFrame) tweenTo(dir);
  // an off-screen target is pinged as it arrives, not while the sky is still
  // swinging past it
  FLASH = { ref: h.ref, kind: h.kind, label: h.label, pos,
            t0: performance.now() + (inFrame ? 0 : 520) };
}

qEl.addEventListener('input', () => {

});
qEl.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { qSel = Math.min(qSel + 1, qHits.length - 1); paintHits(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { qSel = Math.max(qSel - 1, 0); paintHits(); e.preventDefault(); }
  else if (e.key === 'Enter') { choose(qSel); e.preventDefault(); }
  else if (e.key === 'Escape') { qEl.value = ''; qHits = []; paintHits(); qEl.blur(); }

qEl.addEventListener('blur', () => setTimeout(() => { qList.style.display = 'none'; }, 120));
qEl.addEventListener('focus', () => { if (qHits.length) paintHits(); });

  if (e.target === qEl) return;
  if (e.key === '/') { e.preventDefault(); qEl.focus(); qEl.select(); }

  // panel off it should not cost a trip to the corner with the mouse
  else if (e.key === 'h' || e.key === 'H') toggleFold();

// ---- colour legend
// The ramp is also the way to ask "where are they?". Hovering a swatch lights
// every star of that class and drops the rest to MARK_DIM, which is the one
// question the legend could previously only half answer: it told you what the
// colour meant and then left you to find them by eye among a thousand dots.
// Clicking pins the same set through the ordinary highlight, chip and Escape
// included, so you can let go of the mouse and go looking.
const rampEl = document.getElementById('ramp');
const rampLabel = document.getElementById('ramplabel');
const RAMP_TEXT = 'spectral class';

// A star's legend key: its MK letter, or '?' when the catalogue's type is not
// one. A solar-system body has no key at all -- its "type" is prose, and a
// planet is not a member of any spectral class.
function classKey(s) { return s.solar ? null : (typeLetter(s.sp) || '?'); }

function classStars(l) { return STARS.filter(s => classKey(s) === l); }

// What the label above the ramp reads for a class: what the colour means and
// how many stars carry it. Shared, because a tap has to be told the same
// thing a hover is told, and there is only one sentence to tell.
function classLabel(l) {
  if (!l) return RAMP_TEXT;
  const n = classStars(l).length;
  return `<b>${l === '?' ? 'no class' : l}</b> &middot; `
       + `${CLASS_NOTE[l]} &middot; ${n} star${n === 1 ? '' : 's'}`;
}

// The highlight's name for a class. One spelling, used by the thing that sets
// MARK_LABEL and by the thing that reads it back off the chip.
function classTrait(l) { return l === '?' ? 'no class' : 'class ' + l; }

function hoverClass(l) {
  HOVER_KEY = l;
  HOVER_SET = l ? new Set(classStars(l)) : null;
  rampLabel.innerHTML = classLabel(l);
}

// A coarse pointer has no hover, so the ramp's two behaviours collapse into
// one: the tap is the pin, and a second tap puts it out. That last part is
// phone-only on purpose -- with a mouse the chip and Escape are both in view
// and a second click re-pinning is what the ramp has always done.
//
// mq() is declared further down the page than this block runs, so the
// question is asked at tap time. Which is where it belongs anyway: a device
// can gain a mouse between one tap and the next.
const coarse = () => mq('(pointer: coarse)').matches;

// The swatch's whole behaviour, written as a function rather than only as a
// listener: the harness's stub DOM parses buttons and not divs, and a rule
// that exists only inside a listener on an element the tests cannot find is a
// rule with no test.
function tapClass(l) {
  if (coarse() && MARKED.size && MARK_LABEL === classTrait(l)) {
    clearMark();                // the swatch is the only way out on a phone
    return;
  }
  const stars = classStars(l);
  if (!stars.length) return;
  // Pinning hands the set to the ordinary highlight, so a class behaves
  // exactly like a searched-for trait from there on -- the same chip, the
  // same Escape, and the same turn-and-ping when none of them is on screen.
  markTrait({ stars, trait: classTrait(l) });
}

// Which swatch the pinned highlight is standing for, read off the highlight
// itself rather than off the DOM -- the answer is wanted before the swatches
// are painted, and is the same answer whether or not they exist.
function pinnedClass() {
  return MARKED.size
    ? (RAMP_ORDER.find(l => classTrait(l) === MARK_LABEL) || null) : null;
}

rampEl.innerHTML = RAMP_ORDER.map(l =>
  `<div data-l="${l}" class="${RAMP_GAP.has(l) ? 'gap' : ''}${l === '?' ? ' none' : ''}"`
  + ` style="background:${CLASS_COLOR[l] || UNKNOWN_COLOR}">${l}</div>`).join('');

for (const sw of rampEl.querySelectorAll('div')) {
  const l = sw.dataset.l;
  sw.title = CLASS_NOTE[l] + ' \u2014 click to keep it lit';
  // iOS synthesises a mouseenter on a tap and holds it until something else
  // is tapped. HOVER_SET outranks MARKED in the frame, so an ungated hover
  // handler would light the class transiently and leave the pin underneath it
  // with nothing to show for itself.
  sw.addEventListener('mouseenter', () => { if (!coarse()) hoverClass(l); });
  sw.addEventListener('mouseleave', () => { if (!coarse()) hoverClass(null); });
  sw.addEventListener('click', () => tapClass(l));
}

// which swatch, if any, the pinned highlight is currently standing for
function paintPins() {
  const pinned = pinnedClass();
  for (const sw of rampEl.querySelectorAll('div'))
    sw.classList.toggle('pin', sw.dataset.l === pinned);
  // With no hover there is nothing else to write the label, so the pin writes
  // it -- on a phone a tap is the only way left to ask what a colour means.
  // Every way out of a highlight goes through renderMark(), so the chip's
  // clear and Escape put the label back without knowing about the ramp.
  if (coarse()) rampLabel.innerHTML = classLabel(pinned);
}

// Star Names began publishing one approved spelling per star -- about 450 of

// This catalogue still carries the older names alongside, and they disagree:
// epsilon Cygni lists `Aljanah`, which is the approved name, and also
// `Gienah`, which the IAU moved to gamma Corvi; gamma Cassiopeiae lists
// `Tiansi` and also `Navi`, which was an Apollo crew's joke and was never
// official at all. Where the catalogue marks the IAU's entry, that is the
// one to print, and it outranks the catalogue's own `name` field.
const IAU_TAG = /^NAME[-\s]?IAU\s+(.+)$/i;

  const f = factsFor(s);

//
// `s.cat.name` is tried first and frequently holds one -- `Beta
// Cassiopeiae`, `mu Cephei`, `gam Delphini`, `Gamma Per` -- and because it
// is tried first it DISPLACES the real name sitting further down the list:
// Caph, Erakis, and for gamma Delphini nothing at all, since it has none and
// the designation is the whole of what there is to call it. One star was
// offering `lambda Ori X-5`, which is an X-ray source.
//
// Rejecting them here is what lets bayerName() spell the designation
// properly instead, with the genitive and the superscript. The trailing
// `\s+` is what keeps it safe: Etamin, Alphecca, Muphrid and Nunki all open

    // `gamma` as a name field spells it out

    // `d Serpentis` are designations too -- a single letter and a
    // constellation, which no proper name is.
    const letters = ['[a-z]'];

      + ')\\b', 'i');

    // exactly one candidate inside, or the circle has two right answers --
    // and over the whole level, not just the half being asked about
    const inside = conesInside(B.dir, deg, levelPool());
    if (inside.length !== 1 || inside[0] !== b) continue;
    const others = shuffle(near.filter(x => x !== b)).slice(0, 3);
    if (others.length < 3) continue;
    const opts = shuffle([b, ...others]);
    const { sep } = sepPA(A.dir, B.dir);
    return {
      kind: 'region', label: 'read the sky',
      ask: `Only <em>${esc(conName(a))}</em> is drawn. Which constellation `
         + `belongs in the <span class="dir">circled area</span>?`,
      opts: opts.map(x => ({ t: conName(x) })),
      answer: opts.indexOf(b),
      pose() {
        isolate([a]); setLabels(true);
        REGIONS = [{ dir: B.dir, deg }];
        frameDirs([A.dir, B.dir], 30);
      },
      reveal() {
        isolate([a, b]); setLabels(true);
        frameDirs([A.dir, B.dir], 30);
        pingCon(b);
      },
      why() {
        const story = CON_STORY[b] ? ` — ${CON_STORY[b]}` : '';
        return `<em>${esc(conName(b))}</em>${esc(story)}, about `
          + `${Math.round(sep)}° from ${esc(conName(a))}.`
          + `<div class="d">Its stars are named in the genitive, `
          + `<em>${esc(conGen(b))}</em>.</div>`;
      },
    };
  }
  return null;
}

// The same question the other way round: the sky is circled in four places
// and one of them is the constellation named. The options ARE the circles, so
// they are listed in their own order rather than shuffled -- the badge on the
// button is the number painted on the sky.
function qWhichRegion() {
  const P = pool();
  if (P.length < 6) return null;
  for (let t = 0; t < 60; t++) {
    const a = rnd(P);
    const A = CONS.get(a);
    const near = P.filter(b => {
      if (b === a) return false;
      const { sep } = sepPA(A.dir, CONS.get(b).dir);
      return sep >= 12 && sep <= 60;
    });
    if (near.length < 4) continue;
    const four = shuffle(near).slice(0, 4);
    const regs = four.map(x => ({ abbr: x, dir: CONS.get(x).dir,
                                  deg: regionRadius(CONS.get(x)) }));
    // No circle may hold more than its own constellation, and none may hold
    // the ANCHOR -- the one figure that is actually drawn sitting inside a
    // circled area is a confusing thing to be asked about.
    let bad = false;
    for (const r of regs) {
      const inside = conesInside(r.dir, r.deg, four.concat([a]));
      if (inside.length !== 1 || inside[0] !== r.abbr) { bad = true; break; }
    }
    if (bad) continue;
    const hit = Math.floor(Math.random() * 4);
    const b = four[hit];
    regs.forEach((r, i) => { r.label = String(i + 1); });
    return {
      kind: 'whichregion', label: 'read the sky',
      ask: `Only <em>${esc(conName(a))}</em> is drawn. Which `
         + `<span class="dir">circled area</span> is `
         + `<em>${esc(conName(b))}</em> in?`,
      opts: regs.map((r, i) => ({ t: 'circle ' + (i + 1) })),
      answer: hit,
      pose() {
        isolate([a]); setLabels(true);
        REGIONS = regs.map(r => ({ dir: r.dir, deg: r.deg, label: r.label }));
        frameDirs([A.dir, ...regs.map(r => r.dir)], 30);
      },
      reveal() {
        // Every circle is filled in, not just the one that was the answer.
        // The question drew one figure and four empty rings because finding
        // the shape is the whole of it; the moment it has been answered that
        // reason is spent, and four labelled figures where the four rings
        // were is the sky the NEXT question is going to be asked about. The
        // three that were wrong are the ones worth drawing most -- they are
        // three constellations somebody has just placed by elimination and
        // has not yet been shown.
        isolate([a, ...four]); setLabels(true);
        // All four stay up, and the right one turns green. Clearing the other
        // three at the moment of the answer takes away the thing the question
        // was about: it asked WHICH of these four, and the three it was not
        // are half of what there is to read afterwards -- where the answer
        // sits AMONG them is the lesson.
        REGIONS = regs.map((r, i) => ({ dir: r.dir, deg: r.deg, label: r.label,
                                        col: i === hit ? REGION_HIT : null }));
        // and the same framing pose() used, so the sky does not move under
        // the answer: circle 3 has to still be the circle that was 3.
        frameDirs([A.dir, ...regs.map(r => r.dir)], 30);
        pingCon(b);
      },
      why() {
        const sep = Math.round(sepPA(A.dir, CONS.get(b).dir).sep);
        const story = CON_STORY[b] ? ` — ${CON_STORY[b]}` : '';
        // ...and the key to the other three, in circle order, to go with the
        // figures the reveal has just drawn in them. The sky says which shape
        // is where; this says which NUMBER it was, and the number is the only
        // one of the two the sky cannot show.
        const rest = regs.map((r, i) => `${i + 1} ${conName(r.abbr)}`)
          .filter((_, i) => i !== hit).join(' · ');
        return `<em>Circle ${hit + 1}</em>: ${esc(conName(b))}${esc(story)}, `
          + `about ${sep}° from ${esc(conName(a))}.`
          + `<div class="d">The other three are drawn in now too — `
          + `${esc(rest)}.</div>`;
      },
    };
  }
  return null;
}

function qBrightest() {
  const P = pool();
  for (let t = 0; t < 40; t++) {
    const a = rnd(P);
    const ss = namedStars(a).filter(s => s.vmag !== null && s.vmag !== undefined)
                 .sort((x, y) => x.vmag - y.vmag);
    if (ss.length < 4) continue;
    if (ss[1].vmag - ss[0].vmag < 0.35) continue;   // too close to be a fair ask
    const opts = shuffle([ss[0], ...shuffle(ss.slice(1)).slice(0, 3)]);
    const info = CONS.get(a);
    return {
      kind: 'brightest', label: 'the stars in a figure',
      ask: `Which is the <em>brightest</em> star of `
         + `<em>${esc(conName(a))}</em>?`,
      opts: opts.map(s => ({ t: starName(s), sub: starAlt(s) })),
      answer: opts.indexOf(ss[0]),
      pose() { isolate([a]); setLabels(false); frameCon(info, 1.8); },
      reveal() { setLabels(true); ping(ss[0]); },
      why() {
        const rows = opts.slice().sort((x, y) => x.vmag - y.vmag)
          .map(s => `${esc(starName(s))} ${s.vmag.toFixed(2)}`).join(' · ');
        return `<em>${esc(starName(ss[0]))}</em> at magnitude `
          + `${ss[0].vmag.toFixed(2)}${ss[0].sp ? ', ' + esc(ss[0].sp) : ''}. `
          + `<div class="d">The four, by magnitude — and remember the scale runs `
          + `backwards, so smaller is brighter: ${rows}.</div>`;
      },
    };
  }
  return null;
}

function qPart() {
  const have = Object.keys(CON_PARTS).filter(a => CONS.has(a) && hemiOK(a)
                                                 && PARTS_OK[a] && PARTS_OK[a].length);
  if (!have.length) return null;
  for (let t = 0; t < 25; t++) {
    const a = rnd(have);
    const [what, star] = rnd(PARTS_OK[a]);
    const rest = namedStars(a).filter(s => s !== star);
    if (rest.length < 3) continue;
    const opts = shuffle([star, ...shuffle(rest).slice(0, 3)]);
    const info = CONS.get(a);
    return {
      kind: 'part', label: 'the stars in a figure',
      ask: `In <em>${esc(conName(a))}</em>, which star is `
         + `<em>${esc(what)}</em>?`,
      opts: opts.map(s => ({ t: starName(s), sub: starAlt(s) })),
      answer: opts.indexOf(star),
      pose() { isolate([a]); setLabels(false); frameCon(info, 1.8); },
      reveal() { setLabels(true); ping(star); },
      why() {
        const bits = [];
        if (star.sp) bits.push(esc(star.sp));
        if (star.vmag !== null && star.vmag !== undefined) bits.push('mag ' + star.vmag.toFixed(2));
        if (star.dist) bits.push(fmtDist(star.dist));
        const b = bayerName(star);
        return `<em>${esc(starName(star))}</em>${b && properName(star)
                  ? ' (' + esc(b) + ')' : ''} is ${esc(what)}.`
          + `<div class="d">${bits.join(' · ')}</div>`;
      },
    };
  }
  return null;
}

// Where a planet stands, on a named date.
//
// Every other question on this page is true of the whole year: which star is
// brightest in Cygnus does not depend on when you ask. A planet's place does,
// and that is the thing worth learning about one -- so this generator is the
// only one that touches the date slider, and it says out loud in the question
// which day it has set it to.
//
// It is asked as a CIRCLED AREA rather than as "which constellation is Mars
// in", because the catalogue has figures and not boundaries: it knows which
// constellation a star belongs to and has no way to say which constellation a
// point belongs to. A circle is drawn on the sky, so "inside this circle" is a
// claim the page can make good on. The ambiguous cases -- a body on a rim, or
// in two overlapping circles -- are dropped rather than guessed at, which is
// what the `home.length !== 1` test is doing.
//
// The bodies are hidden while it is up. A question about where Mars is, with
// Mars drawn, is a question about which circle a dot is in.
function qPlanet() {
  // No ephemeris, no question: a clone with no astropy, or a baked payload
  // built without one, gets `bodies: {}` and this returns null forever, which
  // is what every generator does when the sky cannot support it.
  const bodies = SOLAR_SKY.filter(
    // The Sun is left out. This is a midnight sky, and "where is the Sun at
    // midnight" is a question about the Earth rather than about the sky.
    b => b.id !== 'sun' && b.track && b.track.length > 1);
  if (!bodies.length) return null;
  const P = pool();
  if (P.length < 6) return null;

  for (let t = 0; t < 80; t++) {
    const b = rnd(bodies);
    const day = Math.floor(Math.random() * 365);
    const row = b.track[Math.min(b.track.length - 1, day)];
    if (!row) continue;
    const dir = unitVec(row[0], row[1]);

    // exactly one circle of the pool holds it, or this day is not askable
    const home = P.filter(a => sepPA(CONS.get(a).dir, dir).sep
                               <= regionRadius(CONS.get(a)));
    if (home.length !== 1) continue;
    const a = home[0];
    const A = CONS.get(a);
    if (!hemiOK(a)) continue;

    // Three more circles, near enough to be on the same screen and far enough
    // apart to be four separate places. They do not also have to be tested for
    // holding the body: they come out of the same pool, and `home.length !== 1`
    // above has already thrown the day away if ANY pool constellation but this
    // one contains it. One rule, at the top, rather than the same rule twice.
    const near = P.filter(x => {
      if (x === a) return false;
      const { sep } = sepPA(A.dir, CONS.get(x).dir);
      return sep >= 12 && sep <= 60;
    });
    if (near.length < 3) continue;
    const four = shuffle([a, ...shuffle(near).slice(0, 3)]);
    const regs = four.map((x, i) => ({
      abbr: x, dir: CONS.get(x).dir, deg: regionRadius(CONS.get(x)),
      label: String(i + 1),
    }));
    // ...and no circle may hold another option's centre, which is the same
    // fairness rule qWhichRegion applies: two circles that contain each other
    // are one place with two numbers on it.
    if (regs.some(r => {
      const inside = conesInside(r.dir, r.deg, four);
      return inside.length !== 1 || inside[0] !== r.abbr;
    })) continue;

    const hit = four.indexOf(a);
    const when = seasonLabel(day);
    const off = sepPA(A.dir, dir).sep;
    return {
      kind: 'planet', label: 'the sky on a date',
      ask: `At midnight on <em>${esc(when)}</em>, which `
         + `<span class="dir">circled area</span> is `
         + `<em>${esc(b.label)}</em> in?`,
      opts: regs.map((r, i) => ({ t: 'circle ' + (i + 1) })),
      answer: hit,
      pose() {
        clearIsolate(); setLabels(true);
        // the planets go off, and the date the question names goes on
        HIDE_SOLAR = true;
        if (QUIZ_DAY === null) QUIZ_DAY = currentDay();
        setDay(day);
        REGIONS = regs.map(r => ({ dir: r.dir, deg: r.deg, label: r.label }));
        frameDirs(regs.map(r => r.dir), 30);
      },
      reveal() {
        HIDE_SOLAR = false;
        setLabels(true);
        // All four stay up and the right one turns green, for the reason
        // qWhichRegion gives: the question asked which of these four, and
        // where the answer sits among them is half of what there is to read.
        REGIONS = regs.map((r, i) => ({ dir: r.dir, deg: r.deg, label: r.label,
                                        col: i === hit ? REGION_HIT : null }));
        frameDirs(regs.map(r => r.dir), 30);
        ping(b);
      },
      why() {
        const au = row[2];
        return `On ${esc(when)}, ${esc(b.label)} is in the circle around `
          + `<em>${esc(conName(a))}</em> — ${Math.round(off)}° from its centre`
          + `.<div class="d">A planet keeps none of this: it is here on this `
          + `date and somewhere else on another, which is what separates the `
          + `five you can see with an eye from the stars they move against`
          + (au ? ` · ${au.toFixed(2)} AU away on this date` : '') + `</div>`;
      },
    };
  }
  return null;
}

function qHome() {
  const P = pool();
  const set = new Set(P);
  const cands = STARS.filter(s => !s.solar && s.con && set.has(s.con)
                                  && s.inFig && properName(s)
                                  && s.vmag !== null && s.vmag < 3.2);
  if (cands.length < 1 || P.length < 4) return null;
  const s = rnd(cands);
  const others = shuffle(P.filter(x => x !== s.con)).slice(0, 3);
  if (others.length < 3) return null;
  const opts = shuffle([s.con, ...others]);
  return {
    kind: 'home', label: 'the stars in a figure',
    ask: `<em>${esc(starName(s))}</em> — which constellation is it in?`,
    opts: opts.map(x => ({ t: conName(x) })),
    answer: opts.indexOf(s.con),
    pose() {
      clearIsolate();
      // Never labelled, at any level: the caption on the figure IS the answer
      // to this question, and quizSky() does not reset the labels, so after a
      // direction question they were still on.
      setLabels(false);
      // At easy the star is shown, ringed, in the middle of the field, and
      // the question becomes "which shape is it part of" -- which is the
      // thing worth learning. Above easy the view is left exactly where it
      // was, because finding the star is the question.
      if (markStars([s], starName(s))) frame(s.dir, 60);
    },
    reveal() {
      isolate([s.con]); setLabels(true);
      frameCon(CONS.get(s.con), 1.9); ping(s);
    },
    why() {
      const b = bayerName(s);
      return `${esc(starName(s))} is in <em>${esc(conName(s.con))}</em>`
        + (b ? `, and its designation says so: <em>${esc(b)}</em> — the genitive of `
             + `${esc(conName(s.con))} is ${esc(conGen(s.con))}.` : '.')
        + `<div class="d">${s.sp ? esc(s.sp) + ' · ' : ''}mag `
        + `${s.vmag.toFixed(2)}${s.dist ? ' · ' + fmtDist(s.dist) : ''}</div>`;
    },
  };
}

// ---- what a star IS ------------------------------------------------------
// The MK letter is a temperature and the Roman numeral is a size, and those
// two together are most of what a spectral type says. The options are built
// out of those two axes so that every one of them is a real kind of star and
// the wrong answers are wrong about something specific.
const HUE = { O: 'blue', B: 'blue-white', A: 'white', F: 'yellow-white',
              G: 'yellow', K: 'orange', M: 'red' };
const LUM = [['Iab', 'supergiant'], ['Ia', 'supergiant'], ['Ib', 'supergiant'],
             ['III', 'giant'], ['IV', 'subgiant'], ['II', 'bright giant'],
             ['VI', 'subdwarf'], ['V', 'main-sequence star'], ['I', 'supergiant']];
function lumWord(sp) {
  const s = String(sp || '');
  for (const [code, word] of LUM) {
    // after the temperature part, so the V of "V*" or a leading numeral
    // cannot be read as a luminosity class
    // The lookahead stops III being read as II, and must NOT stop IIIb or
    // Va: a trailing a or b is the sub-class, not a different class.
    if (new RegExp('[0-9.]\\s*' + code + '(?![IV])').test(s)) return word;
  }
  return null;
}
function kindWords(sp) {
  const L = typeLetter(sp), w = lumWord(sp);
  if (!L || !HUE[L] || !w) return null;
  return HUE[L] + ' ' + w;
}
// an orange giant, a red supergiant
const an = t => (/^[aeiou]/i.test(t) ? 'an ' : 'a ') + t;

function qKind() {
  const cands = STARS.filter(s => !s.solar && starHemiOK(s) && s.sp && properName(s)
                                  && s.vmag !== null && s.vmag < 3.6
                                  && kindWords(s.sp));
  if (cands.length < 1) return null;
  const s = rnd(cands);
  const ans = kindWords(s.sp);
  const pool2 = [];
  for (const L of Object.keys(HUE))
    for (const w of ['main-sequence star', 'giant', 'supergiant']) {
      const t = HUE[L] + ' ' + w;
      if (t !== ans) pool2.push(t);
    }
  const opts = shuffle([ans, ...shuffle(pool2).slice(0, 3)]);
  const f = factsFor(s);
  return {
    kind: 'kind', label: 'what a star is',
    ask: `<em>${esc(starName(s))}</em> has the spectral type `
       + `<em>${esc(s.sp)}</em>. What kind of star does that make it?`,
    opts: opts.map(t => ({ t: an(t) })),
    answer: opts.indexOf(ans),
    pose() {
      clearIsolate();
      if (markStars([s], starName(s))) frame(s.dir, 60);
    },
    reveal() {
      if (s.con && CONS.has(s.con)) {
        isolate([s.con]); setLabels(true); frameCon(CONS.get(s.con), 1.9);
      }
      ping(s);
    },
    why() {
      const bits = [];
      if (f && f.teff_k) bits.push('about ' + Math.round(f.teff_k / 10) * 10 + ' K');
      if (s.dist) bits.push(fmtDist(s.dist));
      if (s.vmag !== null) bits.push('mag ' + s.vmag.toFixed(2));
      const lines = linesSentence(s.sp);
      return `<em>${esc(an(ans))}</em>. The letter is the temperature — `
        + `O B A F G K M runs hottest to coolest — and the Roman numeral is the `
        + `size: <b>V</b> is the main sequence, <b>III</b> a giant, `
        + `<b>I</b> a supergiant.`
        + (bits.length ? `<div class="d">${esc(bits.join(' · '))}</div>` : '')
        + (lines ? `<div class="d">${lines}</div>` : '');
    },
  };
}

function qHottest() {
  const cands = STARS.filter(s => {
    const f = factsFor(s);
    return !s.solar && starHemiOK(s) && properName(s) && f && f.teff_k
           && s.vmag !== null && s.vmag < 4;
  });
  if (cands.length < 8) return null;
  for (let t = 0; t < 30; t++) {
    // From one cap of sky, not from all of it -- see nearbyStars().
    const grp = nearbyStars(cands, 4);
    if (!grp) continue;
    const four = grp.sort((a, b) => factsFor(b).teff_k - factsFor(a).teff_k);
    const hot = factsFor(four[0]).teff_k, next = factsFor(four[1]).teff_k;
    if (hot < next * 1.25) continue;     // a fair gap, not a coin toss
    const opts = shuffle(four);
    return {
      kind: 'hottest', label: 'what a star is',
      ask: 'Which of these four stars is the <em>hottest</em>?',
      // the designation rides along with the type: publications pair the two,
    // and `hottest` is not asking which constellation anything is in, so the
    // genitive gives nothing away here
    opts: opts.map(s => ({ t: starName(s), sub: withDesig(s, s.sp) })),
      answer: opts.indexOf(four[0]),
      pose() {
        clearIsolate();
        if (markStars(four, 'the four')) frameAll(four);
      },
      reveal() { ping(four[0]); },
      why() {
        const rows = four.map(s => `${esc(starName(s))} ${esc(s.sp || '')} `
          + `${Math.round(factsFor(s).teff_k / 10) * 10} K`).join('<br>');
        return `<em>${esc(starName(four[0]))}</em>, at about `
          + `${Math.round(hot / 10) * 10} K. The MK letter alone answers this — `
          + `O B A F G K M is a temperature sequence, hottest first.`
          + `<div class="d">${rows}</div>`;
      },
    };
  }
  return null;
}

function qVariable() {
  const cands = [];
  for (const s of STARS) {
    if (s.solar || !starHemiOK(s) || s.vmag === null || s.vmag > 4.6) continue;
    const f = factsFor(s);
    if (!f || !f.var || !f.var.confirmed) continue;
    const code = varCode(f.var);
    if (!code || code === 'VAR' || code === 'PULS' || code === 'ROT') continue;
    if (!starName(s) || !s.con || !CON_NAMES[s.con]) continue;
    cands.push({ s, f, code, info: VAR_TYPES[code] });
  }
  if (!cands.length) return null;
  const c = rnd(cands);
  // Deduplicated by GLOSS, not by code: L and LB are different types with
  // the same description, and two identical options is a broken question.
  const said = new Set([c.info.gloss]);
  const wrong = [];
  for (const k of shuffle(Object.keys(VAR_TYPES))) {
    if (k === c.code || k === 'VAR' || k === 'PULS') continue;
    const g = VAR_TYPES[k].gloss;
    if (said.has(g)) continue;
    said.add(g); wrong.push(g);
    if (wrong.length === 3) break;
  }
  if (wrong.length < 3) return null;
  const opts = shuffle([c.info.gloss, ...wrong]);
  const v = c.f.var;
  return {
    kind: 'variable', label: 'what a star is',
    ask: `<em>${esc(starName(c.s))}</em>, in ${esc(conName(c.s.con))}, is a variable `
       + `star of type <em>${esc(c.info.label)}</em> (${esc(v.type)}). `
       + `What does that mean?`,
    opts: opts.map(t => ({ t })),
    answer: opts.indexOf(c.info.gloss),
    pose() {
      if (CONS.has(c.s.con)) {
        isolate([c.s.con]); setLabels(true); frameCon(CONS.get(c.s.con), 1.9);
      } else { clearIsolate(); }
      markStars([c.s], starName(c.s));
    },
    reveal() { ping(c.s); },
    why() {
      // The same two columns the detail panel reads, and the same trap: the
      // builder has already worked out whether VSX's minimum column was a
      // magnitude or an amplitude, so `amplitude` is the honest number for
      // the 56 stars whose "range" is a thousandth of a magnitude.
      const bits = [];
      if (v.mag_max !== null && v.mag_max !== undefined
          && v.mag_min !== null && v.mag_min !== undefined)
        bits.push(`${fmtMag(v.mag_max)} to ${fmtMag(v.mag_min)}`);
      else if (v.amplitude !== null && v.amplitude !== undefined)
        bits.push(`a ${fmtMag(v.amplitude)} mag swing`);
      if (v.period_d) bits.push('every ' + fmtPeriod(v.period_d));
      return `<em>${esc(c.info.gloss)}</em>.`
        + (bits.length ? ` <span class="d">(${esc(bits.join(', '))})</span>` : '')
        + `<div class="d">${c.info.at_max}</div>`;
    },
  };
}

function qNearest() {
  const cands = STARS.filter(s => !s.solar && starHemiOK(s) && s.dist && properName(s)
                                  && s.vmag !== null && s.vmag < 4);
  if (cands.length < 8) return null;
  for (let t = 0; t < 30; t++) {
    // From one cap of sky, not from all of it -- see nearbyStars().
    const grp = nearbyStars(cands, 4);
    if (!grp) continue;
    const four = grp.sort((a, b) => a.dist - b.dist);
    if (four[0].dist > four[1].dist * 0.6) continue;
    const opts = shuffle(four);
    return {
      kind: 'nearest', label: 'what a star is',
      ask: 'Which of these four stars is <em>nearest to us</em>?',
      opts: opts.map(s => ({ t: starName(s),
                          sub: withDesig(s, 'mag ' + s.vmag.toFixed(2)) })),
      answer: opts.indexOf(four[0]),
      pose() {
        clearIsolate();
        if (markStars(four, 'the four')) frameAll(four);
      },
      reveal() { ping(four[0]); },
      why() {
        const rows = four.map(s => `${esc(starName(s))} ${fmtDist(s.dist)}`).join(' · ');
        return `<em>${esc(starName(four[0]))}</em>, at ${fmtDist(four[0].dist)}. `
          + `<div class="d">Brightness is no guide at all — how bright a star looks `
          + `is its real output and its distance together, and the two are `
          + `independent: ${rows}.</div>`;
      },
    };
  }
  return null;
}

// ---- what a class looks like -------------------------------------------
// The theory question with the observer's own data under it: name the lines
// you would expect, then here is a frame off this telescope with those lines
// marked on it. An install with an empty output/ answers in words alone.
function qLines() {
  // Only stars this installation has actually shot. The whole point of the
  // question is the frame underneath the answer, and "here is a different
  // star of roughly the same class" is a weaker thing to show than the star
  // the question just named.
  // -- and only ones in the half of the sky being asked about. This is the
  // one pool that can empty: a shelf of 46 frames is not 46 of each half, so
  // "southern spectroscopy" on a northern observer's install asks nothing and
  // says so, which is the honest answer rather than a question about a star
  // they have not shot.
  const cands = [];
  for (const [L, list] of BY_CLASS)
    for (const s of list) if (starHemiOK(s)) cands.push({ s, L });
  if (!cands.length) return null;
  const c = rnd(cands);
