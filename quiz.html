  const wrong = shuffle(Object.keys(CLASS_SHORT).filter(k => k !== c.L)).slice(0, 3);
  const opts = shuffle([c.L, ...wrong]);
  const shown = displayType(c.s.sp) || c.L;
  const ex = c.s.obs;

  return {
    kind: 'lines', label: 'what the spectrum shows',
    ask: `<em>${esc(starName(c.s))}</em> is ${'AFMO'.includes(shown[0]) ? 'an' : 'a'} `
       + `<em>${esc(shown)}</em> star. Which lines would you expect to dominate `
       + `its spectrum?`,
    opts: opts.map(L => ({ t: CLASS_SHORT[L] })),
    answer: opts.indexOf(c.L),
    pose() {
      clearIsolate();
      if (markStars([c.s], starName(c.s))) frame(c.s.dir, 60);
    },
    reveal() { if (QUIZ.level !== 'easy') ping(c.s); },
    why() {
      const meas = (ex.spectrum.class_letter || '').toUpperCase();
      return (linesSentence(c.s.sp) || CLASS_SHORT[c.L])
        + `<div class="d" style="margin-top:8px">Your own frame of `
        + `${esc(ex.name)}${ex.snr ? `, S/N ${ex.snr}` : ''}, normalised, with `
        + `those lines marked where they fall.`
        + (meas && meas !== c.L
           ? ` (The pipeline's own fit of this frame reads it as ${esc(meas)} —
              that classifier is weakest on O, F and G, and the stated type is
              what the lines are being read against here.)` : '')
        + `</div><canvas class="qspec" width="760" height="300"></canvas>`;
    },
    // drawn after the card is in the DOM: a canvas cannot be painted from a
    // string of HTML
    after(card) {
      const cv2 = card.querySelector('canvas.qspec');
      if (cv2) plotSpectrum(cv2, ex.spectrum, classColorFor(c.s.sp), CLASS_MARKS[c.L]);
    },
  };
}

// Identification is most of the quiz, which is what the weights say: the six
// generators above the line are 14 of these 18 draws.
const GENERATORS = [
  { kind: 'figure', w: 3, fn: qFigure },
  { kind: 'region', w: 3, fn: qRegion },
  { kind: 'whichregion', w: 2, fn: qWhichRegion },
  { kind: 'brightest', w: 2, fn: qBrightest },
  { kind: 'part', w: 2, fn: qPart },
  { kind: 'home', w: 2, fn: qHome },
  { kind: 'planet', w: 1, fn: qPlanet },
  { kind: 'kind', w: 1, fn: qKind },
  { kind: 'hottest', w: 1, fn: qHottest },
  { kind: 'variable', w: 1, fn: qVariable },
  { kind: 'nearest', w: 1, fn: qNearest },
  { kind: 'lines', w: 2, fn: qLines },
];

function ord(n) {
  const t = n % 100;
  if (t >= 11 && t <= 13) return 'th';
  return ['th', 'st', 'nd', 'rd'][n % 10] || 'th';
}

// Whether this installation can answer a category at all. Only spectroscopy
// can fail: it is built entirely out of frames in output/, so a clone with
// none gets no spectral questions and is not offered the button. `random`
// does not fail with it -- it simply has one fewer kind in the bag.
function catPossible(id) {
  if (id !== 'spec') return true;
  return BY_CLASS.size > 0;
}

function theCat() {
  return CATEGORIES.find(c => c.id === QUIZ.cat)
      || CATEGORIES.find(c => c.id === 'all');
}

function enabledKinds() {
  const cat = theCat();
  const on = new Set();
  for (const g of GENERATORS)
    if (!cat.kinds || cat.kinds.includes(g.kind)) on.add(g.kind);
  if (!catPossible('spec')) on.delete('lines');
  return on;
}

// ---- asking --------------------------------------------------------------
let LAST_KIND = null;
function nextQuestion() {
  const on = enabledKinds();
  const bag = [];
  for (const g of GENERATORS) if (on.has(g.kind)) for (let i = 0; i < g.w; i++) bag.push(g);
  if (!bag.length) { QUIZ.q = null; renderQuiz(); return; }

  let q = null;
  for (let t = 0; t < 60 && !q; t++) {
    // Two of the same kind in a row is dull; the third attempt stops caring,
    // because with one topic enabled there is nothing else to pick.
    const g = rnd(bag);
    if (g.kind === LAST_KIND && t < 12 && bag.length > 1) continue;
    try { q = g.fn(); } catch (e) { console.warn('quiz', g.kind, e); q = null; }
  }
  if (!q) { for (const g of shuffle(bag)) { try { q = g.fn(); } catch (e) { q = null; } if (q) break; } }
  if (!q) { QUIZ.q = null; renderQuiz(); return; }

  LAST_KIND = q.kind;
  QUIZ.q = q; QUIZ.answered = false; QUIZ.chose = -1;
  quizSky();
  q.pose();
  renderQuiz();
}

function answer(i) {
  const q = QUIZ.q;
  if (!q || QUIZ.answered) return;
  QUIZ.answered = true; QUIZ.chose = i;
  QUIZ.asked++;
  if (i === q.answer) {
    QUIZ.right++; QUIZ.streak++;
    if (QUIZ.streak > QUIZ.best) { QUIZ.best = QUIZ.streak; saveBest(); }
  } else {
    QUIZ.streak = 0;
  }
  q.reveal();
  // The answer is in: the sky stops holding anything back, at every level.
  showStarNames = true;
  renderQuiz();
}

function saveBest() {
  try { localStorage.setItem('quizBestStreak', String(QUIZ.best)); } catch (e) { /* private window */ }
}
function loadBest() {
  try { QUIZ.best = parseInt(localStorage.getItem('quizBestStreak') || '0', 10) || 0; }
  catch (e) { QUIZ.best = 0; }
}

// ---- drawing the card ----------------------------------------------------
function renderQuiz() {
  const el = qel('quiz');
  const q = QUIZ.q;
  const pct = QUIZ.asked ? Math.round(100 * QUIZ.right / QUIZ.asked) : 0;

  let h = `<div class="head">`
    + `<span class="kindname">${q ? esc(q.label) : 'quiz'}</span>`
    + `<span>${QUIZ.asked ? `<b>${QUIZ.right}</b>/${QUIZ.asked} · ${pct}%` : 'no questions yet'}`
    + (QUIZ.streak > 1 ? ` · <span class="streak">${QUIZ.streak} in a row</span>` : '')
    + `</span></div>`;

  if (!q) {
    h += `<p class="ask">${enabledKinds().size
      ? 'Nothing in the catalogue could answer that — try another category, '
        + 'half of the sky, or level.'
      : 'Nothing to ask about — pick a category below.'}</p>`;
  } else {
    h += `<p class="ask">${q.ask}</p>`;
    h += `<div class="opts">`;
    q.opts.forEach((o, i) => {
      let cls = '';
      if (QUIZ.answered) {
        if (i === q.answer) cls = 'right';
        else if (i === QUIZ.chose) cls = 'wrong';
        else cls = 'faded';
      }
      const mark = QUIZ.answered && i === q.answer ? '✓'
                 : QUIZ.answered && i === QUIZ.chose ? '✕' : (i + 1);
      h += `<button class="${cls}" data-i="${i}"${QUIZ.answered ? ' disabled' : ''}>`
        + `<span class="n">${mark}</span>`
        + `<span>${esc(o.t)}${o.sub ? ` <span class="d">· ${esc(o.sub)}</span>` : ''}</span>`
        + `</button>`;
    });
    h += `</div>`;
    if (!QUIZ.answered && q.note) h += `<p class="why"><span class="d">${q.note}</span></p>`;
    if (QUIZ.answered) {
      const miss = QUIZ.chose !== q.answer;
      h += `<div class="why${miss ? ' miss' : ''}">${q.why()}</div>`;
      h += `<div class="go">`
        + `<button class="primary" id="qnext">next question</button>`
        + `<button id="qshow">show me again</button>`
        + `<span class="kbd">⏎</span></div>`;
    }
  }

  // ---- what the quiz may ask
  h += `<div id="qsetup"><div class="lab">level — how far down the list of `
    + `figures it will go</div><div class="segs">`;
  for (const k of ['easy', 'medium', 'hard'])
    h += `<button data-lv="${k}" class="${QUIZ.level === k ? 'on' : ''}">${k}`
      + ` <span class="d">${LEVELS[k]}</span></button>`;
  h += `</div><div class="lab">what it asks about</div><div class="segs">`;
  for (const c of CATEGORIES) {
    if (!catPossible(c.id)) continue;
    h += `<button data-cat="${c.id}" class="${QUIZ.cat === c.id ? 'on' : ''}">${c.label}</button>`;
  }
  h += `</div><div class="lab">which half of the sky — a constellation by its `
    + `own centre, and its stars with it</div><div class="segs">`;
  for (const hm of HEMIS)
    h += `<button data-hm="${hm.id}" class="${QUIZ.hemi === hm.id ? 'on' : ''}">`
      + `${hm.label}</button>`;
  h += `</div></div>`;

  el.innerHTML = h;

  el.querySelectorAll('.opts button').forEach(b => {
    b.onclick = () => answer(parseInt(b.dataset.i, 10));
  });
  // Anything a question has to paint rather than write. The card is in the
  // DOM by now, which a canvas needs and a string of HTML cannot give it.
  if (q && QUIZ.answered && q.after) { try { q.after(el); } catch (e) { console.warn(e); } }
  const nx = qel('qnext'); if (nx) nx.onclick = nextQuestion;
  const sh = qel('qshow');
  if (sh) sh.onclick = () => { QUIZ.q.pose(); if (QUIZ.answered) QUIZ.q.reveal(); };
  el.querySelectorAll('[data-lv]').forEach(b => {
    b.onclick = () => { QUIZ.level = b.dataset.lv; nextQuestion(); };
  });
  el.querySelectorAll('[data-cat]').forEach(b => {
    b.onclick = () => {
      if (QUIZ.cat === b.dataset.cat) return;
      QUIZ.cat = b.dataset.cat;
      nextQuestion();
    };
  });
  el.querySelectorAll('[data-hm]').forEach(b => {
    b.onclick = () => {
      if (QUIZ.hemi === b.dataset.hm) return;
      QUIZ.hemi = b.dataset.hm;
      nextQuestion();
    };
  });
}

// =================================================== review
// The other half of the rail. A quiz asks a question and grades the answer;
// a review takes the names off the sky and hands them back as a tray to put
// where they belong. Same catalogue, same isolate(), same frame() -- what
// changes is that the answer is not one of four buttons, it is a POSITION,
// which is the thing being learnt and the one thing a multiple choice cannot
// ask for.
//
// Three boards, and the third is a different shape because what it reviews
// is: shapes (place the constellation names), star names (place the proper
// names on the stars inside them), and the spectral sequence, which is not a
// placement at all but a ladder of this installation's own frames.

// The groups are the ones a beginner actually learns in -- a bright anchor
// and its neighbours, star-hopped from it. They are written down because
// "which constellations are learnt together" is a fact about teaching rather
// than about the sky, and nothing in the catalogue knows it.
const REVIEW_GROUPS = [
  { id: 'dipper', label: 'Big Dipper → Leo',
    cons: ['UMa', 'Boo', 'CrB', 'UMi', 'Leo', 'CVn'] },
  { id: 'orion', label: 'Orion → the Pleiades',
    cons: ['Ori', 'Tau', 'Gem', 'CMa', 'CMi'] },
  { id: 'cas', label: 'Cassiopeia → Aries',
    cons: ['Cas', 'Cep', 'Per', 'And', 'Peg', 'Ari'] },
  { id: 'cygnus', label: 'Cygnus → Serpens Caput',
    cons: ['Cyg', 'Lyr', 'Aql', 'Oph', 'Ser'] },
];

// Serpens is ONE figure in the catalogue and two constellations on the sky:
// the head west of Ophiuchus and the tail east of it, with the serpent-bearer
// standing between them holding it. Naming it once would put a single label
// in the gap between two shapes that are nowhere near each other.
//
// The split is not written down. The figure's own segments fall into exactly
// two connected components, and the one holding alpha Serpentis is the head.
// So a catalogue rebuilt from a different figure file splits itself, or stops
// splitting and falls back to one Serpens, with no table here to go stale.
const CON_SPLIT = {
  Ser: [{ key: 'SerCaput', label: 'Serpens Caput', has: '* alf Ser' },
        { key: 'SerCauda', label: 'Serpens Cauda', has: '* eta Ser' }],
};

// The connected components of a figure: its segments as a graph, union-find
// over the stars they join. Over FIGS rather than over the constellation's
// members, because a figure line may run to a star stamped into the
// neighbouring constellation -- Serpens Caput is drawn partly through delta
// Ophiuchi -- and that star is part of the shape whatever it is labelled.
function figureComponents(abbr) {
  const segs = FIGS.filter(f => f.con === abbr);
  const par = new Map();
  const find = x => {
    while (par.get(x) !== x) { par.set(x, par.get(par.get(x))); x = par.get(x); }
    return x;
  };
  for (const f of segs) for (const s of [f.a, f.b]) if (!par.has(s)) par.set(s, s);
  for (const f of segs) {
    const a = find(f.a), b = find(f.b);
    if (a !== b) par.set(a, b);
  }
  const out = new Map();
  for (const s of par.keys()) {
    const r = find(s);
    if (!out.has(r)) out.set(r, []);
    out.get(r).push(s);
  }
  return [...out.values()];
}

// The centre of a target is the mean of its stars' unit vectors, normalised
// -- the centre of the SHAPE, which is what the eye is looking at and where
// the caption goes, not the centre of the IAU boundary.
function withDir(t) {
  const v = [0, 0, 0];
  for (const s of t.stars) { v[0] += s.dir[0]; v[1] += s.dir[1]; v[2] += s.dir[2]; }
  const L = Math.hypot(v[0], v[1], v[2]) || 1;
  t.dir = [v[0] / L, v[1] / L, v[2] / L];
  return t;
}

// One constellation, as one target or as the two the sky actually shows.
function conTargets(abbr) {
  const rule = CON_SPLIT[abbr];
  if (rule) {
    const comps = figureComponents(abbr);
    const out = [], used = new Set();
    for (const part of rule) {
      const want = BY_CAT_ID.get(part.has);
      const c = want && comps.find(k => k.includes(want));
      if (!c || used.has(c)) continue;
      used.add(c);
      out.push(withDir({ key: part.key, label: part.label, stars: c }));
    }
    // Only when the figure really did come apart the way the rule describes.
    // A catalogue that draws the serpent as one unbroken run gets one
    // Serpens rather than two labels over the same stars.
    if (out.length === rule.length) return out;
  }
  const stars = conStars(abbr);
  return stars.length ? [withDir({ key: abbr, label: conName(abbr), stars })] : [];
}

// A board of more than about a dozen names stops being a review and becomes
// a data-entry exercise, so the star board takes the brightest of the group.
// Brightest rather than arbitrary: those are the ones with proper names worth
// knowing, and the ones you can actually pick out.
const REVIEW_STARS_MAX = 12;

const REVIEW_KINDS = [
  { id: 'shapes', label: 'shapes' },
  { id: 'stars', label: 'star names' },
  { id: 'spectra', label: 'spectra' },
];

const REVIEW = {
  on: false,
  group: 0,
  kind: 'shapes',
  targets: [],          // {key, label, stars, dir, star?}
  chips: [],            // the same keys, shuffled: the tray's order
  place: new Map(),     // target key -> the chip key put on it
  sel: null,            // the chip currently picked up
  checked: false,
  shown: false,         // "show me" -- the truth painted over the board
  // the spectral ladder keeps its own small state
  specHide: false,
  specIx: new Map(),    // class letter -> which of that class's frames
  specShown: new Set(), // which rungs have been turned over in the drill
  specOrder: null,      // shuffled once, so the drill is not in sequence order
  offFrame: 0,          // targets pushed off the edge of the frame
  dimmed: 0,            // targets under the magnitude or Bortle cut
  near: true,           // draw the ring of neighbouring shapes, off the frame
};

const SPEC_ORDER = ['O', 'B', 'A', 'F', 'G', 'K', 'M'];

function reviewGroup() { return REVIEW_GROUPS[REVIEW.group] || REVIEW_GROUPS[0]; }
function reviewTarget(key) { return REVIEW.targets.find(t => t.key === key); }
function reviewLabel(key) { const t = reviewTarget(key); return t ? t.label : key; }
// The designation under a name, on a star board. A shape has none, and a
// star with no proper name is ALREADY shown by its designation.
function reviewAlt(key) {
  const t = reviewTarget(key);
  return t && t.star ? starAlt(t.star) : null;
}

// ---- building a board ----------------------------------------------------
function buildBoard() {
  const g = reviewGroup();
  let ts = [];
  // The ladder places nothing: it is a sequence to read, not a board. An
  // empty target list is what says so, and it is what quizHolds() reads to
  // decide that this board is asking nothing of the sky and so need not hold
  // the tooltip back.
  if (REVIEW.kind === 'spectra') {
    REVIEW.targets = []; REVIEW.chips = []; REVIEW.place = new Map();
    REVIEW.sel = null; REVIEW.checked = false; REVIEW.shown = false;
    return;
  }
  if (REVIEW.kind === 'stars') {
    // Proper names only. Placing "Alioth" and "Mizar" is the exercise;
    // placing "upsilon Bootis" is transcription, and the Bayer name is what
    // the answer TEACHES rather than what it asks for.
    const seen = new Set();
    for (const a of g.cons)
      for (const s of conStars(a)) {
        if (!properName(s) || seen.has(s)) continue;
        seen.add(s);
        ts.push(s);
      }
    ts = ts.sort((x, y) => (x.vmag ?? 99) - (y.vmag ?? 99))
           .slice(0, REVIEW_STARS_MAX)
           .map(s => withDir({ key: s.id, label: properName(s), stars: [s], star: s }));
  } else {
    for (const a of g.cons) ts.push(...conTargets(a));
  }
  REVIEW.targets = ts;
  // Shuffled, and shuffled ONCE: a tray listed in the order the targets were
  // built is a tray listed west to east, which answers the board.
  REVIEW.chips = shuffle(ts.map(t => t.key));
  REVIEW.place = new Map();
  REVIEW.sel = REVIEW.chips[0] || null;
  REVIEW.checked = false;
  REVIEW.shown = false;
  REVIEW.offFrame = REVIEW.dimmed = 0;
}

// The sky a board poses on. quizSky() is the same reset a question starts
// from -- lines on, only-mine off, explode to zero, no stale circle or
// highlight -- and the two differences are deliberate:
//
//   * the captions come OFF, because a caption is the whole answer;
//   * `raw mag` goes OFF, where a question turns it on. A question is
//     allowed to ask what a floodlit sky really shows you. A board cannot
//     be: half a figure is not a shape to put a name on, and the name has
//     nowhere to sit. The sliders stay live either way.
function reviewPose() {
  // quizSky() leaves `raw mag` ON, and a board keeps it. The sliders mean the
  // same thing here that they mean under a question: this is the sky you
  // would actually have, and a figure comes apart under a floodlit one
  // exactly the way the real figure does. A board that sat there unchanged
  // with both sliders on the floor would make them decoration in the one
  // place somebody is most likely to be asking "could I actually find this
  // from my garden".
  //
  // What that costs is that a target can go under the cut and stop being
  // placeable -- so the board counts those and says so, the same way it
  // counts the ones dragged off the edge. See REVIEW.offFrame below.
  quizSky();
  setLabels(false);
  if (REVIEW.kind === 'spectra') { clearIsolate(); return; }
  reviewIsolate();
  frameBoard();
}

// On a star board the halo switch changes what it is a switch FOR.
//
// A halo normally means "there is a spectrum of this one", widened hard for
// an observed star -- and a big soft glow reads as "pick me" next to the thin
// ring that actually marks a target. Which stars have been shot has nothing
// to do with which stars carry a name to place, so the two were fighting over
// the same corner of the reader's attention and the wrong one was winning.
//
// Rather than seizing the switch and forcing it off, the board takes it over:
// halos ON marks the twelve stars in question, halos OFF marks nothing and
// leaves you to find them, which is the same board and a harder one. The
// observed halo stays out of it either way -- it is the meaning that does not
// belong here, not the glow.
//
// Only the star board does this. A shape board has no one star to point at,
// and the ladder is not on the sky at all, so on both of those the switch
// goes on meaning exactly what it says.
function boardOwnsHalo() {
  return REVIEW.on && REVIEW.kind === 'stars';
}

// A board is framed tighter than a question is. frameDirs() opens to
// 1.4x the span because a question poses ONE figure and wants air around it;
// a board poses six at once across half the sky, and at 1.4x the Big
// Dipper-to-Leo group comes up at 154 degrees, where every shape is a
// thumbnail and the rings on a star board are a few pixels wide. The names
// have to be readable against the shapes to be placed on them, so this opens
// only far enough to hold every target and a margin, and the harness checks
// that it really does hold them: a name with nowhere to go is the one way a
// board is impossible rather than hard.
const BOARD_PAD = 1.04, BOARD_MARGIN = 5;
function frameBoard() {
  const dirs = REVIEW.targets.map(t => t.dir);
  if (!dirs.length) return;
  const v = [0, 0, 0];
  for (const d of dirs) { v[0] += d[0]; v[1] += d[1]; v[2] += d[2]; }
  const L = Math.hypot(v[0], v[1], v[2]);
  if (L < 0.05) { frame(dirs[0], FOV_MAX); return; }
  const c = [v[0] / L, v[1] / L, v[2] / L];
  // the widest a target's own stars reach from the centre, not the widest its
  // centre does: a name sits over the shape, and half of Ursa Major hanging
  // off the edge is half a shape to put it on
  let worst = 1;
  for (const t of REVIEW.targets)
    for (const s of t.stars)
      worst = Math.min(worst, s.dir[0] * c[0] + s.dir[1] * c[1] + s.dir[2] * c[2]);
  const span = 2 * Math.acos(Math.max(-1, Math.min(1, worst))) * 180 / Math.PI;
  frame(c, Math.max(40, span * BOARD_PAD + BOARD_MARGIN));
}

// ---- the ring around the board -------------------------------------------
// A group is a teaching order, not a piece of sky, and the quiz knows nothing
// about it: "which constellation is this?" draws its wrong answers from the
// whole catalogue, so the shape you have to tell Cygnus APART from is often
// one no board ever showed you. These are those shapes -- the prominent ones
// whose stars come within a margin of the board's own reach, drawn faintly,
// never placeable, and outside the frame the board opens at. Turn the sky and
// they are there; sit still and the board is the board it always was.
const REVIEW_NEAR_MAX = 8;      // more than this and the ring is just the sky
const REVIEW_NEAR_DEG = 25;     // how far off the board's own stars one may sit
const REVIEW_NEAR_RANK = 55;    // and how obscure it may be and still be worth
                                // telling apart from anything

function reviewNeighbours(cons) {
  const own = new Set(cons);
  const mine = [];
  for (const a of cons) for (const s of conStars(a)) mine.push(s.dir);
  if (!mine.length) return [];
  // Measured from the board's own STARS, not from its centre. A group is a
  // star-hop -- the Dipper group runs from the pole to Leo -- so a radius
  // around its centroid is half the sky, and the brightest things in half the
  // sky are Orion and Scorpius, which is not what "next to the Plough" means.
  const cosLim = Math.cos(REVIEW_NEAR_DEG * Math.PI / 180);
  const out = [];
  for (const abbr of CONS.keys()) {
    if (own.has(abbr)) continue;
    // A ring of eight shapes nobody could name teaches nothing about telling
    // shapes apart, so the obscure half of the sky stays out of it.
    if ((CON_RANK.get(abbr) ?? 99) > REVIEW_NEAR_RANK) continue;
    let best = -1;
    for (const s of conStars(abbr))
      for (const d of mine) {
        const c = s.dir[0] * d[0] + s.dir[1] * d[1] + s.dir[2] * d[2];
        if (c > best) best = c;
      }
    if (best >= cosLim) out.push([abbr, best]);
  }
  // Nearest first, so a cap of eight keeps the ones actually against the
  // board rather than eight of the many things 25 degrees away.
  return out.sort((a, b) => b[1] - a[1])
            .slice(0, REVIEW_NEAR_MAX).map(x => x[0]);
}

function reviewIsolate() {
  const g = reviewGroup();
  isolate(g.cons, REVIEW.near ? reviewNeighbours(g.cons) : null);
}

// ---- putting a name down -------------------------------------------------
// Tap the name, then tap the sky. The hit is the target whose nearest star is
// nearest the click, which is "the shape you were pointing at" rather than
// "the centre you were closest to" -- Ursa Major's centre is a long way from
// the end of the Plough's handle, and pointing at the handle means the bear.
const REVIEW_REACH = { shapes: 170, stars: 46 };

function reviewHit(px, py) {
  const pos = new Map(proj.map(q => [q.s, q]));
  let best = null, bd = Infinity;
  for (const t of REVIEW.targets)
    for (const s of t.stars) {
      const q = pos.get(s);
      if (!q) continue;
      const d = Math.hypot(q.x - px, q.y - py);
      if (d < bd) { bd = d; best = t; }
    }
  return bd <= (REVIEW_REACH[REVIEW.kind] || 120) ? best : null;
}

// A click on the sky with a name picked up. Nothing is graded here: this
// board is placed in full and then checked, so a placement is a statement
// that can still be taken back.
function reviewClick(px, py) {
  if (!REVIEW.sel || REVIEW.checked) return false;
  const t = reviewHit(px, py);
  if (!t) return false;
  // A name is in one place at a time, and a place holds one name: putting
  // this one down lifts it off wherever it was, and turns out whatever was
  // already here.
  for (const [k, v] of [...REVIEW.place]) if (v === REVIEW.sel) REVIEW.place.delete(k);
  REVIEW.place.set(t.key, REVIEW.sel);
  REVIEW.sel = nextLoose(REVIEW.sel);
  renderReview();
  return true;
}

// The next name still in the tray, starting after this one -- so placing the
// last of a run carries on from the top rather than leaving nothing selected
// and the board apparently finished.
function nextLoose(from) {
  const put = new Set(REVIEW.place.values());
  const n = REVIEW.chips.length;
  const at = Math.max(0, REVIEW.chips.indexOf(from));
  for (let i = 1; i <= n; i++) {
    const k = REVIEW.chips[(at + i) % n];
    if (!put.has(k)) return k;
  }
  return null;
}

function reviewScore() {
  let right = 0;
  for (const t of REVIEW.targets) if (REVIEW.place.get(t.key) === t.key) right++;
  return right;
}

// ---- what the board paints on the sky ------------------------------------
// The names go on the sky rather than in the rail, because where a name sits
// IS the answer. `at` is the frame's own star-to-pixel map, handed down from
// draw() so this costs no second projection.
const REV_PENDING = '#d2a8ff';   // the view's "this one, here" violet
const REV_RIGHT = '#3fb950';     // the card's own --ok, so green means one thing
const REV_WRONG = '#f85149';
const REV_TRUTH = '#7daae6';     // the constellation caption's own blue

function reviewLabelAt(t, at) {
  let sx = 0, sy = 0, n = 0;
  for (const s of t.stars) {
    const p = at.get(s);
    if (!p || p.x < 0 || p.x > W || p.y < 0 || p.y > H) continue;
    if (magHidden(s)) continue;
    sx += p.x; sy += p.y; n++;
  }
  // A name over a shape that is mostly off screen drifts to the edge and
  // labels something you cannot see -- the same rule the captions use.
  const want = t.star ? 1 : Math.max(2, Math.ceil(t.stars.length * 0.4));
  return n >= want ? { x: sx / n, y: sy / n } : null;
}

function drawReviewLabels(at) {
  if (!REVIEW.on || REVIEW.kind === 'spectra' || !REVIEW.targets.length) return;
  cx2.save();
  // The ring is drawn off `proj` and NOT off `at`, and the difference is the
  // whole of a bug worth keeping a comment about.
  //
  // `at` is every star that projects in front of the camera; `proj` is every
  // star the frame actually DREW, which the loop culls at the viewport edge.
  // The hit test can only find what is in proj -- so ringing off `at` put
  // rings on stars that could not be clicked. It is not a corner case: drag
  // and the sliders stay live under a board, so any pan pushes targets off
  // the edge, and they kept their rings and stopped answering. A ring is a
  // promise that a name can go here, and this is what keeps the promise the
  // hit test can actually honour: ringed if and only if clickable.
  const shown = new Map(proj.map(q => [q.s, q]));
  let off = 0, dim = 0;
  for (const t of REVIEW.targets) {
    if (t.stars.some(x => shown.has(x))) continue;
    // Two different ways to be unplaceable, with two different ways back:
    // under the magnitude or Bortle cut, or dragged off the edge of the
    // frame. Telling the reader "it is off the edge" when they have just
    // pulled the magnitude slider down is the wrong answer to the right
    // question.
    if (t.stars.every(magHidden)) dim++; else off++;
  }
  if (off !== REVIEW.offFrame || dim !== REVIEW.dimmed) {
    REVIEW.offFrame = off; REVIEW.dimmed = dim;
    renderReview();
  }

  // A star board rings every star it is asking about. Without that the board
  // says "place twelve names" over a field of two hundred stars and never
  // says which twelve.
  //
  // Which is the whole reason the halo switch means something else here --
  // see boardOwnsHalo(). Ringed while it is on; nothing marked at all while
  // it is off, which is the board with the training wheels off and is a
  // harder thing than the same board with them on.
  //
  // The check brings them back whatever the switch says, on the quiz's own
  // precedent: once the answer is in, the sky stops holding anything back.
  if (REVIEW.kind === 'stars' && (showHalo || REVIEW.checked)) {
    for (const t of REVIEW.targets) {
      const q = shown.get(t.star);
      if (!q) continue;
      const p = q;
      const got = REVIEW.place.get(t.key);
      const right = got === t.key;
      const col = !REVIEW.checked ? REV_PENDING : right ? REV_RIGHT : REV_WRONG;
      const r = (q ? q.r : 2) + 7;
      // Enough glow to find a magnitude-3 dot against the whole sky and no
      // more. It was three times this while it was competing with the
      // observed-star halos, which it no longer is -- those are off for the
      // duration of the board, so the ring only has to be seen rather than
      // to win.
      const g = cx2.createRadialGradient(p.x, p.y, 0, p.x, p.y, r + 5);
      g.addColorStop(0, hexA(col, 0.14));
      g.addColorStop(0.7, hexA(col, 0.05));
      g.addColorStop(1, hexA(col, 0));
      cx2.fillStyle = g;
      cx2.beginPath(); cx2.arc(p.x, p.y, r + 5, 0, 6.2832); cx2.fill();
      cx2.lineWidth = 1.6;
      cx2.strokeStyle = hexA(col, REVIEW.checked || got ? 0.95 : 0.8);
      cx2.beginPath(); cx2.arc(p.x, p.y, r, 0, 6.2832); cx2.stroke();
    }
  }
  cx2.font = '600 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  cx2.textAlign = REVIEW.kind === 'stars' ? 'left' : 'center';
  cx2.textBaseline = 'middle';
  // Names nudge off each other. Mizar and Alioth are four degrees apart and
  // their labels land on top of one another at the field a board opens at,
  // which on a board is worse than it is anywhere else in the view: the
  // label IS the answer, and two of them overprinted is the one thing the
  // reader cannot resolve by looking harder. The star-name pass below has a
  // collision list for exactly this; the labels here are drawn before it and
  // keep their own, and they move rather than drop out -- a name that is
  // missing reads as a star nobody placed.
  const put = [];
  const clear = (x, y, w) => !put.some(b => x < b.x + b.w + 5 && x + w + 5 > b.x
                                         && y < b.y + 14 && y + 14 > b.y);
  const write = (text, x, y, colour) => {
    const w = cx2.measureText(text).width;
    const half = cx2.textAlign === 'center' ? w / 2 : 0;
    let dy = 0;
    // straight up and down in growing steps, nearest slot wins
    for (const d of [0, -14, 14, -27, 27, -40, 40]) {
      if (clear(x - half, y + d, w)) { dy = d; break; }
      dy = d;
    }
    put.push({ x: x - half, y: y + dy, w, h: 14 });
    cx2.fillStyle = colour;
    cx2.fillText(text, x, y + dy);
  };
  for (const t of REVIEW.targets) {
    const p = reviewLabelAt(t, at);
    if (!p) continue;
    const q = REVIEW.kind === 'stars' ? proj.find(x => x.s === t.star) : null;
    const x = q ? p.x + q.r + 9 : p.x;
    const got = REVIEW.place.get(t.key);
    const right = got === t.key;
    // Before the check every placement is simply a placement, in the violet
    // that means "you put this here" -- saying nothing about whether it is
    // right, which is the whole point of grading the board in one go.
    // "show me" REPLACES a wrong name rather than stacking the right one
    // under it. Two names on one shape is the thing the board was asking you
    // to sort out, and leaving the mistake up next to the correction is the
    // one arrangement that still looks like the question.
    const replaced = REVIEW.shown && !right;
    if (got && !REVIEW.checked) write(reviewLabel(got), x, p.y, REV_PENDING);
    else if (got && !replaced)
      write(reviewLabel(got), x, p.y, right ? REV_RIGHT : REV_WRONG);
    if (replaced) write(t.label, x, p.y, REV_TRUTH);
  }
  cx2.restore();
}

// ---- the spectral ladder -------------------------------------------------
// Not a placement, because a spectrum is not somewhere on the sky. What it is
// instead is the SEQUENCE: O at the top and M at the bottom, each rung a real
// normalised frame off this telescope with its own lines drawn where they
// fall. Read down it and the Balmer series rises out of the He I at B, peaks
// at A, fades through F as Ca II H+K and the G band come up, and the metal
// forest closes over it at K before the TiO bands arrive at M. That is the
// thing a table of descriptions cannot show, and it is the one review here
// built entirely out of the observer's own data.
function specStar(L) {
  const list = BY_CLASS.get(L);
  if (!list || !list.length) return null;
  return list[(REVIEW.specIx.get(L) || 0) % list.length];
}

function ladderHTML() {
  if (!BY_CLASS.size)
    return `<p class="none">No spectra on this installation — the ladder is `
         + `built out of your own frames, and there are none to read. The `
         + `other two boards need only the catalogue.</p>`;
  const order = REVIEW.specOrder || SPEC_ORDER;
  let h = '';
  for (const L of order) {
    const s = specStar(L);
    const n = (BY_CLASS.get(L) || []).length;
    // In the drill the rung is face down until it is turned over, and the
    // shuffled order is what stops it being answerable by counting down
    // from the top.
    const hid = REVIEW.specHide && !REVIEW.specShown.has(L);
    h += `<div class="rung${hid ? ' hid' : ''}" data-l="${L}">`
      + `<div class="rh">`
      + `<span class="cl" style="background:${hid ? UNKNOWN_COLOR : (CLASS_COLOR[L] || UNKNOWN_COLOR)}">`
      + `${hid ? '?' : L}</span>`
      + `<span class="nm">${hid
          ? '<span class="d">which class is this?</span>'
          : (s ? `${esc(starName(s))} <span class="d">· ${esc(displayType(s.sp) || L)}</span>`
               : '<span class="d">no frame on this shelf</span>')}</span>`
      + (!hid && n > 1
          ? `<button class="more" data-more="${L}">another of ${n}</button>` : '')
      + `</div>`;
    if (!hid) h += `<div class="sh">${esc(CLASS_SHORT[L])}</div>`;
    if (s) h += `<canvas class="qspec" data-c="${L}" width="760" height="300"></canvas>`;
    else if (hid) h += `<div class="sh d">nothing to show</div>`;
    h += `</div>`;
  }
  return h;
}

// A rung face down is drawn in no class's colour. The curve is normally
// painted in the star's own -- blue for an O, orange for a K -- which is the
// whole point of it on a ladder you are reading, and which hands you the
// answer outright on one you are being asked to read. The drill is "look at
// the lines", so the lines are all it gives you.
function ladderColor(L) {
  const s = specStar(L);
  if (!s) return UNKNOWN_COLOR;
  return REVIEW.specHide && !REVIEW.specShown.has(L)
    ? UNKNOWN_COLOR : classColorFor(s.sp);
}

function paintLadder(el) {
  el.querySelectorAll('canvas.qspec[data-c]').forEach(c => {
    const L = c.dataset.c;
    const s = specStar(L);
    if (!s || !s.obs || !s.obs.spectrum) return;
    // Face down, the marks come off too: an Hbeta named on the plot names the
    // class, and the drill is exactly "read the lines yourself".
    const hid = REVIEW.specHide && !REVIEW.specShown.has(L);
    plotSpectrum(c, s.obs.spectrum, ladderColor(L), hid ? null : CLASS_MARKS[L]);
  });
}

// ---- the panel -----------------------------------------------------------
function renderReview() {
  const el = qel('review');
  if (!el) return;
  const spec = REVIEW.kind === 'spectra';
  const n = REVIEW.targets.length;
  const put = REVIEW.place.size;
  const right = reviewScore();

  let h = `<div class="head"><span class="kindname">`
    + `${esc(REVIEW_KINDS.find(k => k.id === REVIEW.kind).label)}</span>`
    + `<span>${spec
        ? (BY_CLASS.size ? `${BY_CLASS.size} of 7 classes on the shelf` : 'no frames')
        : REVIEW.checked ? `<b>${right}</b>/${n} placed right`
                         : `${put} of ${n} placed`}</span></div>`;

  if (spec) {
    h += `<p class="ask">${REVIEW.specHide
      ? 'Each frame is one of this telescope’s own, normalised. '
        + '<em>Name the class</em>, then turn the rung over.'
      : 'The sequence, in your own frames — the Balmer lines rise to <em>A</em>, '
        + 'fade through <em>F</em>, and the metal forest closes over them by '
        + '<em>K</em>.'}</p>`;
    h += ladderHTML();
  } else if (!n) {
    h += `<p class="ask">Nothing in this catalogue to place for that group.</p>`;
  } else {
    // The instruction has to describe the sky the reader is actually looking
    // at: "twelve stars are ringed" over an unmarked sky is the card telling
    // them something they can see is not true.
    h += `<p class="ask">${REVIEW.kind !== 'stars'
      ? 'Tap a name, then tap the shape it belongs to.'
      : showHalo
        ? `${n} stars are ringed. Tap a name, then tap the star it belongs to.`
        : `Nothing is ringed — find the ${n} yourself. Tap a name, then tap `
          + 'the star it belongs to.'} `
      + `Nothing is marked until you <em>check</em>.</p>`;
    h += `<div class="tray">`;
    for (const k of REVIEW.chips) {
      // A placed name stays in the tray rather than leaving it: picking it up
      // again to move it is most of how a board like this is actually worked,
      // and a tray that empties as you go also counts down to the last one.
      const where = targetHolding(k);
      let cls = '';
      if (REVIEW.checked) cls = where === k ? 'right' : 'wrong';
      else if (k === REVIEW.sel) cls = 'sel';
      else if (where) cls = 'put';
      // The designation appears on the CHECK, not before it. Publications
      // pair the two and so does every option in the quiz -- but a chip
      // reading "Arcturus · alpha Boötis" on a board whose whole question is
      // *which star is Arcturus* has answered itself: only one target in this
      // group is in Boötes, so the genitive places it without the sky being
      // read at all. So the pairing is taught where it costs nothing, on the
      // way out, alongside the green and the red.
      const alt = REVIEW.checked ? reviewAlt(k) : null;
      h += `<button class="${cls}" data-chip="${esc(k)}"`
        + `${REVIEW.checked ? ' disabled' : ''}>${esc(reviewLabel(k))}`
        + `${alt ? ` <span class="d">· ${esc(alt)}</span>` : ''}</button>`;
    }
    h += `</div>`;

    // A name with nowhere to go, said out loud. The sky stays draggable under
    // a board on purpose -- turning it to look at a shape from another angle
    // is most of what makes this a sky -- but a target dragged off the edge
    // stops being clickable, and a tray you cannot empty with no explanation
    // reads as a broken board rather than as a scrolled one.
    if (!REVIEW.checked && (REVIEW.offFrame || REVIEW.dimmed)) {
      const bits = [];
      // The magnitude one is stated and not undone. The sliders are the
      // observer's, they were moved on purpose, and a button here that put
      // them back would be the board arguing with the sky it is drawn on.
      if (REVIEW.dimmed)
        bits.push(`${REVIEW.dimmed} ${REVIEW.dimmed === 1 ? 'is' : 'are'} under `
          + `the magnitude cut — this sky does not show ${REVIEW.dimmed === 1
            ? 'it' : 'them'}`);
      // A pan, on the other hand, is not usually a decision about the sky.
      if (REVIEW.offFrame)
        bits.push(`${REVIEW.offFrame} ${REVIEW.offFrame === 1 ? 'is' : 'are'} off `
          + `the edge — <button id="rframe">bring the group back</button>`);
      h += `<p class="off">${bits.join('; ')}.</p>`;
    }

    h += `<div class="go">`;
    if (!REVIEW.checked)
      h += `<button class="primary" id="rcheck"${put ? '' : ' disabled'}>`
        + `check${put < n ? ` (${n - put} still loose)` : ''}</button>`;
    else {
      h += `<button class="primary" id="ragain">try this group again</button>`;
      if (right < n) h += `<button id="rshow">show me</button>`;
    }
    h += `<span class="kbd">⏎</span></div>`;

    if (REVIEW.checked) {
      const misses = [];
      for (const t of REVIEW.targets) {
        const got = REVIEW.place.get(t.key);
        if (got === t.key) continue;
        // The Bayer name is what a star board is really teaching -- the
        // proper name gets you to the star, and the genitive gets you from
        // the star back to the constellation.
        const teach = t.star
          ? ` <span class="d">· ${esc(bayerName(t.star) || '')}</span>` : '';
        misses.push(`<li><em>${esc(t.label)}</em>${teach} — `
          + `${got ? 'you put ' + esc(reviewLabel(got)) + ' there' : 'nothing placed'}</li>`);
      }
      h += `<div class="why${misses.length ? ' miss' : ''}">`;
      if (!misses.length)
        h += `All ${n} in the right place.`
          + `<div class="d">Try the next group, or the star names inside this one.</div>`;
      else
        h += `${right} of ${n}.<ul>${misses.join('')}</ul>`;
      h += `</div>`;
    }
  }

  // ---- what is being reviewed
  h += `<div id="rsetup"><div class="lab">group</div><div class="segs">`;
  for (let i = 0; i < REVIEW_GROUPS.length; i++)
    h += `<button data-g="${i}" class="${REVIEW.group === i ? 'on' : ''}">`
      + `${esc(REVIEW_GROUPS[i].label)}</button>`;
  h += `</div><div class="lab">what to review</div><div class="segs">`;
  for (const k of REVIEW_KINDS) {
    if (k.id === 'spectra' && !catPossible('spec')) continue;
    h += `<button data-rk="${k.id}" class="${REVIEW.kind === k.id ? 'on' : ''}">`
      + `${k.label}</button>`;
  }
  h += `</div>`;
  if (spec && BY_CLASS.size)
    h += `<div class="segs"><button id="rhide" class="${REVIEW.specHide ? 'on' : ''}">`
      + `hide the labels</button></div>`;
  if (!spec)
    h += `<div class="segs"><button id="rnear" class="${REVIEW.near ? 'on' : ''}">`
      + `neighbours</button></div>`;
  h += `</div>`;

  el.innerHTML = h;
  if (spec) paintLadder(el);

  el.querySelectorAll('[data-chip]').forEach(b => {
    b.onclick = () => { REVIEW.sel = b.dataset.chip; renderReview(); };
  });
  el.querySelectorAll('[data-more]').forEach(b => {
    b.onclick = () => {
      const L = b.dataset.more;
      REVIEW.specIx.set(L, (REVIEW.specIx.get(L) || 0) + 1);
      renderReview();
    };
  });
  el.querySelectorAll('.rung.hid').forEach(d => {
    d.onclick = () => { REVIEW.specShown.add(d.dataset.l); renderReview(); };
  });
  const fr = qel('rframe');
  if (fr) fr.onclick = () => { frameBoard(); renderReview(); };
  const ck = qel('rcheck'); if (ck) ck.onclick = checkBoard;
  const ag = qel('ragain'); if (ag) ag.onclick = () => { buildBoard(); reviewPose(); renderReview(); };
  const sw = qel('rshow'); if (sw) sw.onclick = () => { REVIEW.shown = true; renderReview(); };
  const nb = qel('rnear');
  // Re-isolated, not re-posed: turning the ring on and off must not take the
  // sky back to where the board opened, because the ring is the thing you
  // turned the sky away from the board to look at.
  if (nb) nb.onclick = () => {
    REVIEW.near = !REVIEW.near;
    reviewIsolate();
    renderReview();
  };
  const hd = qel('rhide');
  if (hd) hd.onclick = () => {
    REVIEW.specHide = !REVIEW.specHide;
    REVIEW.specShown = new Set();
    // Shuffled while face down, back to O..M once the labels are on: the
    // ladder is only a ladder if it is read in order.
    REVIEW.specOrder = REVIEW.specHide ? shuffle(SPEC_ORDER) : null;
    renderReview();
  };
  el.querySelectorAll('[data-g]').forEach(b => {
    b.onclick = () => {
      const i = parseInt(b.dataset.g, 10);
      if (i === REVIEW.group) return;
      REVIEW.group = i; buildBoard(); reviewPose(); renderReview();
    };
  });
  el.querySelectorAll('[data-rk]').forEach(b => {
    b.onclick = () => {
      if (b.dataset.rk === REVIEW.kind) return;
      REVIEW.kind = b.dataset.rk;
      buildBoard(); reviewPose(); renderReview();
    };
  });
}

// Which target this name is currently sitting on, if any.
function targetHolding(chip) {
  for (const [k, v] of REVIEW.place) if (v === chip) return k;
  return null;
}

function checkBoard() {
  if (REVIEW.checked) return;
  REVIEW.checked = true;
  REVIEW.sel = null;
  // The board is graded: the sky stops holding anything back, the way a
  // question's reveal does.
  renderReview();
}

// ---- the mode switch -----------------------------------------------------
function setMode(review) {
  if (REVIEW.on === review) return;
  REVIEW.on = review;
  document.body.classList.toggle('reviewing', review);
  syncBtn('mQuiz', !review);
  syncBtn('mReview', review);
  if (review) {
    if (!REVIEW.targets.length) buildBoard();
    reviewPose();
    renderReview();
  } else {
    clearIsolate();
    nextQuestion();
  }
}
qel('mQuiz').onclick = () => setMode(false);
qel('mReview').onclick = () => setMode(true);

// ---- keyboard ------------------------------------------------------------
// 1-4 answers and Enter moves on, which is the whole loop without the mouse.
// The search box and the sliders keep their own keys: a number typed into the
// search box is part of a name, and space on a focused button is that button.
window.addEventListener('keydown', e => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA'
            || t.tagName === 'SELECT')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  // A board has the same loop and it is not the quiz's: a number picks up
  // the nth name and Enter checks what has been put down. Without this,
  // "next question" on `n` would pose a question over an open board and take
  // the sky it was being played on away.
  if (REVIEW.on) {
    if (REVIEW.kind === 'spectra') return;
    if (/^[1-9]$/.test(e.key)) {
      const i = parseInt(e.key, 10) - 1;
      if (!REVIEW.checked && i < REVIEW.chips.length) {
        REVIEW.sel = REVIEW.chips[i]; renderReview(); e.preventDefault();
      }
    } else if (e.key === 'Enter') {
      if (REVIEW.checked) { buildBoard(); reviewPose(); }
      else if (REVIEW.place.size) checkBoard();
      renderReview();
      e.preventDefault();
    }
    return;
  }
  if (/^[1-9]$/.test(e.key)) {
    const i = parseInt(e.key, 10) - 1;
    if (QUIZ.q && !QUIZ.answered && i < QUIZ.q.opts.length) { answer(i); e.preventDefault(); }
  } else if (e.key === 'Enter') {
    if (QUIZ.answered) { nextQuestion(); e.preventDefault(); }
  } else if (e.key === 'n' || e.key === 'N') {
    nextQuestion(); e.preventDefault();
  }
});

// ---- the rail folds ------------------------------------------------------
// The sky is what the questions are about, and reading an unfamiliar shape
// sometimes wants the whole screen. Folding changes the canvas width, so the
// projection has to be told.
function toggleRail() {
  document.body.classList.toggle('railed');
  syncSheet(true);
  resize();
}
qel('railmin').onclick = toggleRail;


// ---- the sheet -----------------------------------------------------------
// On a portrait phone the rail is a sheet across the bottom of the sky rather
// than a column beside it, and how much of the canvas it covers is what
// SKY_INSET carries into the projection. Three heights, cycled by tapping the
// grab bar: peek is the score and the mode switch, half is the working height
// where four options or twelve chips fit, full adds the setup rows and the
// sliders.
//
// Read once per change and per resize, never per frame -- a
// getBoundingClientRect in draw() is a forced layout on every frame of a drag,
// which is the same reason ex()/ey() exist.
const SNAPS = ['sheet-peek', 'sheet-half', 'sheet-full'];
let snapAt = 1;
// matchMedia is asked for rather than assumed. The harness runs this page
// under a stub DOM with no layout engine at all, and a page that cannot boot
// without a media query is a page the tests cannot reach.
const mq = q => (typeof window !== 'undefined' && window.matchMedia)
  ? window.matchMedia(q) : { matches: false };
const isPhone = () => mq('(max-width: 720px) and (orientation: portrait)').matches;

function syncSheet(reframe) {
  const phone = PHONE = isPhone();
  qel('sheetgrab').style.display = phone ? 'block' : 'none';
  for (const c of SNAPS) document.body.classList.remove(c);
  // A dragged height outranks the snaps and is re-clamped instead: the screen
  // it was dragged on may since have rotated, and 88% of the old one can be
  // taller than the new one is. Off a phone there is no sheet to be tall.
  if (!phone) setSheetPx(null);
  else if (sheetPx !== null) setSheetPx(sheetPx);
  else document.body.classList.add(SNAPS[snapAt]);
  const was = SKY_INSET;
  // The sheet is over the canvas, so what it covers is its height -- except
  // when the rail is folded away entirely, which is still the desktop's own
  // escape hatch and leaves the sky whole.
  SKY_INSET = phone && !document.body.classList.contains('railed')
    ? Math.round((rail && rail.getBoundingClientRect().height) || 0)
    : 0;
  if (was !== SKY_INSET && reframe) reframeForSheet();
}

// The sky was framed to fit a different amount of screen, so it is framed
// again rather than left half under the sheet. A board re-frames from its own
// targets; a question re-poses, which is exactly what "show me again" does.
function reframeForSheet() {
  try {
    if (REVIEW.on) { if (REVIEW.kind !== 'spectra') frameBoard(); }
    else if (QUIZ.q) { QUIZ.q.pose(); if (QUIZ.answered) QUIZ.q.reveal(); }
  } catch (e) { /* a re-frame is a convenience, never a crash */ }
}

// The bar is dragged as well as tapped. A tap cycles the three snaps, which
// is the quickest way to a height you already know; a drag puts the sheet
// anywhere between SHEET_MIN and most of the screen, which is the thing a
// snap cannot do -- read four options AND see the star being asked about, on
// a screen whose size neither of us picked.
//
// A dragged height is written to --sheet as pixels, and an inline custom
// property outranks the one the snap classes set, so it is tracked here and
// cleared by the next tap. Two things saying how tall the sheet is would
// otherwise disagree at the first rotation.
const SHEET_MIN = 92;
const sheetMax = () => Math.max(SHEET_MIN + 40,
                                Math.round((window.innerHeight || 800) * 0.92));
let sheetPx = null;          // a dragged height in px, or null while snaps rule
let sheetDrag = null;

function setSheetPx(px) {
  sheetPx = px === null ? null
    : Math.max(SHEET_MIN, Math.min(sheetMax(), Math.round(px)));
  if (!rail || !rail.style) return;
  if (sheetPx === null) rail.style.removeProperty('--sheet');
  else rail.style.setProperty('--sheet', sheetPx + 'px');
}

function cycleSnap() {
  setSheetPx(null);
  for (const c of SNAPS) document.body.classList.remove(c);
  snapAt = (snapAt + 1) % SNAPS.length;
  // the height is a transition, so the inset is read after it lands
  syncSheet(false);
  setTimeout(() => syncSheet(true), 240);
}

// Pointer events, not touch: one path then serves a finger, a mouse on a
// narrow window and the harness. The tap is taken on pointerup rather than
// on click, because a `click` is the one part of this a browser may decide
// not to send -- and a control that sometimes does nothing is the bug being
// fixed here, not a detail of it.
const SHEET_SLOP = 4;        // below this a finger is holding still, not dragging
const grabEl = qel('sheetgrab');

grabEl.addEventListener('pointerdown', e => {
  if (!PHONE) return;
  const h = (rail && rail.getBoundingClientRect().height) || sheetPx || 0;
  sheetDrag = { y: e.clientY, h, moved: false, id: e.pointerId };
  document.body.classList.add('sheet-dragging');
  try { grabEl.setPointerCapture(e.pointerId); } catch (_) { /* no capture, no matter */ }
});

grabEl.addEventListener('pointermove', e => {
  if (!sheetDrag) return;
  const dy = sheetDrag.y - e.clientY;            // up is taller
  if (Math.abs(dy) > SHEET_SLOP) sheetDrag.moved = true;
  // Only the height moves while the finger is down. The sky is re-framed on
  // release: reading the rail's box per move is a forced layout per frame,
  // which is the reason ex()/ey() exist.
  if (sheetDrag.moved) setSheetPx(sheetDrag.h + dy);
  if (e.preventDefault) e.preventDefault();
});

function endSheetDrag(e) {
  if (!sheetDrag) return;
  const moved = sheetDrag.moved;
  try { grabEl.releasePointerCapture(sheetDrag.id); } catch (_) { /* as above */ }
  sheetDrag = null;
  document.body.classList.remove('sheet-dragging');
  if (moved) syncSheet(true);                    // the sky follows on release
  else cycleSnap();
}
grabEl.addEventListener('pointerup', endSheetDrag);
grabEl.addEventListener('pointercancel', endSheetDrag);
// Handled above; the synthetic click that follows a tap must not cycle twice.
grabEl.onclick = e => { if (e && e.preventDefault) e.preventDefault(); };
// ... which leaves the keyboard, where there is no pointer at all.
grabEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { cycleSnap(); e.preventDefault(); }
});

// ---- two fingers ---------------------------------------------------------
// Zoom rides on `wheel`, which a touch screen never fires, so without this
// the field slider is the only way in or out on a phone. The gesture is the
// ratio between two pointers' separation, applied about their midpoint --
// which is zoomAbout()'s existing contract, so the sky keeps the point under
// your fingers where it was.
const TOUCHES = new Map();
// The gesture as a whole, captured when the second finger lands: how far
// apart they started, the field at that moment, and ONE anchor pixel.
//
// All three matter, and the first version had none of them right. Applying a
// per-event ratio compounds -- and double-counts, because both fingers report
// a move for the same change, so one pinch arrives as two. Re-aiming at the
// live midpoint is worse: the anchor moves as the fingers drift, so every
// event puts a slightly different direction under a slightly different pixel,
// and the sky walks in a circle. Anchored and absolute, the same finger
// separation always means the same field, and a pinch that ends where it
// started leaves the sky where it started.
let PINCH = null;
let PINCHED = false;        // this gesture has been a pinch, so no finger is a tap
const PINCH_MIN = 24;       // fingers closer than this give a wild ratio

// A pinch changes the FIELD and nothing else -- it does not re-aim.
//
// Holding a direction under a moving midpoint is what zoomTo() does for the
// wheel, and on a phone it is violent: the focal length comes from the
// visible height, which with the sheet up is about 400px, so at a 110 degree
// field a midpoint a hundred pixels off centre is more than sixty degrees off
// axis. Re-aiming to hold something that far out, while the field changes,
// swings the camera hard and can flip between the two pitch solutions
// aimAt() chooses from. Zooming about the centre cannot rotate at all: there
// is no anchor to hold, so there is nothing to solve for. One finger still
// pans, which is where the aiming belongs.
function zoomField(fov) {
  fovDeg = Math.max(FOV_MIN, Math.min(FOV_MAX, fov));
  syncZoom();
}

function pinchSpan() {
  const [a, b] = [...TOUCHES.values()];
  return { d: Math.hypot(a.x - b.x, a.y - b.y),
           x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
}

cv.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'touch') return;
  TOUCHES.set(e.pointerId, { x: ex(e), y: ey(e) });
  if (TOUCHES.size === 2) {
    // a second finger ends the drag rather than fighting it
    dragging = false; vx = vy = 0;
    cv.classList.remove('drag');
    TWEEN = null;
    PINCHED = true;
    const s = pinchSpan();
    PINCH = s.d >= PINCH_MIN ? { d0: s.d, fov0: fovDeg } : null;
  }
  if (TOUCHES.size === 1) PINCHED = false;   // a fresh one-finger gesture
}, true);

cv.addEventListener('pointermove', e => {
  if (e.pointerType !== 'touch' || !TOUCHES.has(e.pointerId)) return;
  TOUCHES.set(e.pointerId, { x: ex(e), y: ey(e) });
  if (TOUCHES.size !== 2 || !PINCH) return;
  const s = pinchSpan();
  if (s.d < PINCH_MIN) return;
  // fingers apart is a closer view of less sky, so the field goes down
  zoomField(PINCH.fov0 / (s.d / PINCH.d0));
  e.preventDefault();
}, true);

for (const ev of ['pointerup', 'pointercancel', 'pointerleave'])
  cv.addEventListener(ev, e => {
    if (e.pointerType !== 'touch') return;
    TOUCHES.delete(e.pointerId);
    // Lifting one finger ends the gesture rather than handing the remaining
    // one a drag mid-pinch, which is a jump every time.
    if (TOUCHES.size < 2) { PINCH = null; dragging = false; }
    if (TOUCHES.size === 0) vx = vy = 0;     // no glide out of a pinch
  }, true);

// ---- a finger is not a mouse pointer -------------------------------------
// pick() answers within 11 pixels, which is right for a cursor and well under
// a fingertip. The board reaches are already generous; this is the detail
// panel's own hit test catching up.
function touchSlop() { return mq('(pointer: coarse)').matches ? 22 : 11; }

window.addEventListener('resize', () => syncSheet(true));

// ---- boot ----------------------------------------------------------------
// Called from the page's own fetch, once the sky is built and sized.
let PARTS_OK = {};
function quizBoot() {
  if (!DATA || !DATA.catalog) return;      // the page is already explaining why

  // Each figure's own centre and stars, which is what a direction is measured
  // between. The mean of the unit vectors, normalised -- the same thing the
  // search index aims at, and for the same reason: the centre of the SHAPE,
  // not the centre of the IAU boundary, is what somebody is looking at.
  CONS = new Map();
  for (const c of CON_LABELS) {
    const v = [0, 0, 0];
    for (const s of c.stars) { v[0] += s.dir[0]; v[1] += s.dir[1]; v[2] += s.dir[2]; }
    const L = Math.hypot(v[0], v[1], v[2]) || 1;
    CONS.set(c.abbr, { abbr: c.abbr, stars: c.stars,
                       dir: [v[0] / L, v[1] / L, v[2] / L] });
  }

  BY_CAT_ID = new Map();
  for (const s of STARS) if (s.cat && s.cat.id) BY_CAT_ID.set(s.cat.id, s);

  // The install's own spectra, by class -- and only the ones a question can
  // honestly be built on. Four conditions, each of which drops a question
  // rather than asking a bad one:
  //
  //   * the star is ON the sky, so the answer can point at it;
  //   * the curve is real -- present, and not all gaps;
  //   * the type is one of the seven MK letters, so there IS a set of lines
  //     to expect (W, C and S are off the sequence and have their own);
  //
  // The class is the STATED one, and the pipeline's own measured letter is
  // deliberately NOT used as a veto. It was, briefly, and it threw away half
  // the library for the wrong reason: this classifier is known to fail O, F
  // and G outright, so it disagrees most about exactly the classes that are
  // thinnest here. Delta Cephei is an F supergiant whatever a chi2 fit of
  // this frame says, and HD 188209 is the only O star on the shelf -- vetoing
  // on the measurement dropped both, and F to a single example.
  BY_CLASS = new Map();
  for (const s of STARS) {
    if (s.solar || !s.obs) continue;
    const sp = s.obs.spectrum;
    if (!sp || !sp.wave || sp.wave.length < 8) continue;
    if (!(sp.norm || []).some(v => v !== null && v !== undefined && isFinite(v))) continue;
    const L = (typeLetter(s.sp) || '').toUpperCase();
    if (!CLASS_SHORT[L]) continue;
    if (!BY_CLASS.has(L)) BY_CLASS.set(L, []);
    BY_CLASS.get(L).push(s);
  }
  const got = [...BY_CLASS.entries()].map(([k, v]) => `${k}${v.length}`).join(' ');
  console.info('quiz: spectra a question can be built on — ' + (got || 'none'));

  // Resolve the written-down parts against THIS catalogue, and drop the ones
  // it cannot answer rather than asking a question with no right answer in
  // the options. An install built with a different BRIGHT_VMAX, or a figure
  // file that draws the swan differently, loses those entries silently.
  PARTS_OK = {};
  let kept = 0, lost = 0;
  for (const [abbr, items] of Object.entries(CON_PARTS)) {
    const mine = new Set(conStars(abbr));
    const ok = [];
    for (const [what, id] of items) {
      const s = BY_CAT_ID.get(id);
      if (s && mine.has(s)) { ok.push([what, s]); kept++; } else lost++;
    }
    if (ok.length) PARTS_OK[abbr] = ok;
  }
  if (lost) console.info(`quiz: ${kept} named parts, ${lost} not in this catalogue`);

  loadBest();
  if (QUIZ.best) QUIZ.streak = 0;
  syncSheet(false);        // the inset before the first question is framed
  nextQuestion();
}

</script>
</body>
</html>
